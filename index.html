    <script>
        // ================================================================
        //  完整 JavaScript
        // ================================================================

        const STORAGE_KEY = 'chuanxun_data_final';
        const defaultData = {
            settings: {
                myAvatar: '😊',
                partnerAvatar: '🌟',
                bubbleColor: '#f3e5f5',
                bg: '#f5f7fa',
                bgImage: '',
                minWait: 3,
                maxWait: 8,
                minReply: 1,
                maxReply: 3,
                interval: 31,
                showTimestamp: true,
            },
            messages: [],
            wordCards: {
                '关心提醒': ['记得多喝水哦 💧', '今天要早点休息～', '工作别太累了 🫂', '加油！你是最棒的 💪', '我一直在你身边 ❤️'],
                '情绪身体状况状态': ['抱抱你 🫂', '今天心情怎么样？', '别难过，我陪着你 😢', '好开心呀！😊', '今天是个好日子！🎉'],
                '关于网站系统链接': ['新链接试过了吗？', '网站加载有点慢…', '这个功能好棒！', '链接打不开，再发一次？'],
                '吵架哄人': ['我错了 😢 原谅我好不好', '别生气啦，请你吃糖 🍬', '我们和好吧 🫂', '对不起，是我不好'],
                '游戏': ['一起打游戏吧 🎮', '你玩什么游戏？', '我超厉害！😎', '输了不赖账！'],
                '日常': ['今天天气真好 🌤', '想你了 💕', '在干嘛呢？', '晚安 🌙', '早安 ☀️']
            },
            letters: { sent: [], received: [] },
            pats: ['拍了拍我的头', '戳了戳我的脸', '捏了捏我的脸', '揉了揉我的肚子', '拍了拍我的肩膀'],
            emojis: ['😊', '❤️', '😂', '😭', '🥺', '✨', '🔥', '💕', '🎉', '🤔', '😘', '💪'],
            sticker: [],
            letterTimers: {},
            selectedGroup: null,
        };

        let data = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const merged = deepMerge(defaultData, parsed);
                    const defaultGroups = Object.keys(defaultData.wordCards);
                    for (const g of defaultGroups) {
                        if (!merged.wordCards[g]) merged.wordCards[g] = [];
                    }
                    return merged;
                }
            } catch (e) {}
            return JSON.parse(JSON.stringify(defaultData));
        }

        function deepMerge(target, source) {
            const result = { ...target };
            for (const key in source) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                    result[key] = deepMerge(target[key] || {}, source[key]);
                } else {
                    result[key] = source[key];
                }
            }
            return result;
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // DOM 引用
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const messageList = $('#messageList');
        const chatInput = $('#chatInput');
        const sendBtn = $('#sendBtn');
        const emptyState = $('#emptyState');
        const typingIndicator = $('#typingIndicator');
        const plusBtn = $('#plusBtn');
        const plusMenu = $('#plusMenu');
        const menuEmoji = $('#menuEmoji');
        const menuImage = $('#menuImage');
        const imageInput = $('#imageInput');
        const myAvatar = $('#myAvatar');
        const partnerAvatar = $('#partnerAvatar');
        const myAvatarInput = $('#myAvatarInput');
        const partnerAvatarInput = $('#partnerAvatarInput');
        const settingsBtn = $('#settingsBtn');
        const settingsPage = $('#settingsPage');
        const closeSettings = $('#closeSettings');
        const envelopeBtn = $('#envelopeBtn');
        const callHeaderBtn = $('#callHeaderBtn');
        const callWindow = $('#callWindow');
        const callName = $('#callName');
        const callStatus = $('#callStatus');
        const callAvatar = $('#callAvatar');
        const callTimer = $('#callTimer');
        const callEndBtn = $('#callEndBtn');
        const callMiniBtn = $('#callMiniBtn');
        const callMiniFloat = $('#callMiniFloat');
        const emojiPanel = $('#emojiPanel');
        const emojiGrid = $('#emojiGrid');
        const emojiTabs = document.querySelectorAll('.emoji-tabs .tab');
        const bubbleColorPicker = $('#bubbleColorPicker');
        const bgPicker = $('#bgPicker');
        const minWaitRange = $('#minWaitRange');
        const maxWaitRange = $('#maxWaitRange');
        const minReplyRange = $('#minReplyRange');
        const maxReplyRange = $('#maxReplyRange');
        const intervalRange = $('#intervalRange');
        const minWaitVal = $('#minWaitVal');
        const maxWaitVal = $('#maxWaitVal');
        const minReplyVal = $('#minReplyVal');
        const maxReplyVal = $('#maxReplyVal');
        const intervalVal = $('#intervalVal');
        const toggleTimestamp = $('#toggleTimestamp');
        const statusTime = $('#statusTime');
        const patPopup = $('#patPopup');
        const patContentList = $('#patContentList');
        const patInput = $('#patInput');
        const addPatBtn = $('#addPatBtn');
        const emojiManageList = $('#emojiManageList');
        const emojiInput = $('#emojiInput');
        const addEmojiBtn = $('#addEmojiBtn');
        const importEmojiBtn = $('#importEmojiBtn');
        const importEmojiInput = $('#importEmojiInput');
        const letterInput = $('#letterInput');
        const sendLetterBtn = $('#sendLetterBtn');
        const letterList = $('#letterList');
        const groupList = $('#groupList');
        const newGroupInput = $('#newGroupInput');
        const addGroupBtn = $('#addGroupBtn');
        const cardLibContent = $('#cardLibContent');
        const exportCardsBtn = $('#exportCardsBtn');
        const importCardsBtn = $('#importCardsBtn');
        const importCardsInput = $('#importCardsInput');
        const gotoStatsBtn = $('#gotoStatsBtn');
        const clearChatBtn = $('#clearChatBtn');
        const managePatBtn = $('#managePatBtn');

        let currentBubbleColor = data.settings.bubbleColor || '#f3e5f5';
        let isReplying = false;
        let replyTimer = null;
        let autoSendTimer = null;
        let isCallActive = false;
        let callTimerInterval = null;
        let callSeconds = 0;
        let callAnswered = false;
        let callIsMinimized = false;
        let randomCallTimer = null;
        let currentEmojiTab = 'emoji';

        // ================================================================
        //  工具函数
        // ================================================================
        function formatTime(ts) {
            const d = new Date(ts);
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }

        function formatDate(ts) {
            const d = new Date(ts);
            return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + ' ' + formatTime(ts);
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function pickRandom(arr) {
            if (!arr || arr.length === 0) return null;
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function getAllCards() {
            const groups = data.wordCards;
            const all = [];
            for (const key in groups) {
                if (Array.isArray(groups[key])) {
                    all.push(...groups[key]);
                }
            }
            return all;
        }

        function getGroupNames() {
            return Object.keys(data.wordCards);
        }

        // ================================================================
        //  拍一拍
        // ================================================================
        function showPat(content) {
            patPopup.textContent = '🫳 ' + content;
            patPopup.classList.remove('hide', 'show');
            void patPopup.offsetWidth;
            patPopup.classList.add('show');
            setTimeout(() => {
                patPopup.classList.remove('show');
                patPopup.classList.add('hide');
                setTimeout(() => patPopup.classList.remove('hide'), 400);
            }, 1200);
        }

        // ================================================================
        //  消息渲染
        // ================================================================
        function renderMessages() {
            const msgs = data.messages;
            messageList.innerHTML = '';
            if (msgs.length === 0) {
                messageList.appendChild(emptyState);
                return;
            }
            const myAvatarUrl = data.settings.myAvatar;
            const partnerAvatarUrl = data.settings.partnerAvatar;
            msgs.forEach((msg) => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender === 'self' ? 'self' : 'other'}`;
                const avatarContent = msg.sender === 'self' ? myAvatarUrl : partnerAvatarUrl;
                const avatarHtml = `<div class="msg-avatar" style="background-image:url('${avatarContent}');background-size:cover;background-position:center;font-size:0;">${avatarContent.startsWith('data:') || avatarContent.startsWith('http') ? '' : avatarContent}</div>`;
                const timeHtml = data.settings.showTimestamp ? `<span class="time-tag">${formatTime(msg.timestamp)}</span>` : '';
                const nameLabel = msg.sender === 'self' ? '我' : '鱼鱼';
                let bubbleContent = msg.content;
                if (typeof msg.content === 'string' && (msg.content.startsWith('data:image/') || (msg.content.startsWith('http') && msg.content.match(/\.(jpg|jpeg|png|gif|webp)/i)))) {
                    bubbleContent = `<img src="${msg.content}" alt="图片" />`;
                }
                const bubbleColor = msg.sender === 'self' ? currentBubbleColor : '#ffffff';
                div.innerHTML = (msg.sender === 'other' ? avatarHtml : '') +
                    `<div class="bubble-wrapper"><div class="sender-name">${nameLabel}</div><div class="bubble" style="background:${bubbleColor}">${bubbleContent}${timeHtml}</div></div>` +
                    (msg.sender === 'self' ? avatarHtml : '');
                messageList.appendChild(div);
            });
            messageList.scrollTop = messageList.scrollHeight;
        }

        function addMessage(sender, content, timestamp) {
            const ts = timestamp || Date.now();
            data.messages.push({ sender, content, timestamp: ts });
            saveData();
            renderMessages();
            updateStatsDisplay();
            return ts;
        }

        function sendImage(dataUrl) {
            addMessage('self', dataUrl);
            if (!isReplying) {
                if (replyTimer) clearTimeout(replyTimer);
                const minWait = data.settings.minWait || 3;
                const maxWait = data.settings.maxWait || 8;
                const delay = randomInt(minWait, maxWait) * 1000;
                replyTimer = setTimeout(() => { simulateReply(); }, delay);
            }
        }

        // ================================================================
        //  模拟回复
        // ================================================================
        async function simulateReply() {
            if (isReplying) return;
            isReplying = true;
            const minWait = data.settings.minWait || 3;
            const maxWait = data.settings.maxWait || 8;
            const minReply = data.settings.minReply || 1;
            const maxReply = data.settings.maxReply || 3;
            const waitTime = randomInt(minWait, maxWait) * 1000;
            typingIndicator.classList.add('show');
            await sleep(waitTime);
            typingIndicator.classList.remove('show');

            const allCards = getAllCards();
            const emojis = data.emojis || [];
            const stickers = data.sticker || [];
            const allEmojis = [...emojis, ...stickers];
            if (allCards.length === 0 && allEmojis.length === 0) { isReplying = false; return; }

            const count = randomInt(minReply, maxReply);
            let replyContents = [];

            const shuffledCards = [...allCards].sort(() => Math.random() - 0.5);
            const cardCount = Math.min(count, allCards.length);
            const selectedCards = shuffledCards.slice(0, cardCount);

            for (let i = 0; i < count; i++) {
                let content = '';
                const roll = Math.random();
                if (roll < 0.4 && selectedCards.length > 0 && allEmojis.length > 0) {
                    const card = selectedCards[i % selectedCards.length];
                    const emoji = pickRandom(allEmojis);
                    content = card + ' ' + emoji;
                } else if (roll < 0.7 && selectedCards.length > 0) {
                    const card = selectedCards[i % selectedCards.length];
                    content = card;
                } else if (allEmojis.length > 0) {
                    content = pickRandom(allEmojis);
                } else if (selectedCards.length > 0) {
                    const card = selectedCards[i % selectedCards.length];
                    content = card;
                } else {
                    content = '...';
                }
                if (content) replyContents.push(content);
            }

            if (replyContents.length === 0) {
                replyContents = ['💬 嗯嗯', '好的～'];
            }

            for (let i = 0; i < replyContents.length; i++) {
                addMessage('other', replyContents[i]);
                if (i < replyContents.length - 1) await sleep(randomInt(400, 1200));
            }
            isReplying = false;
            updateStatsDisplay();
        }

        function sendMessage(text) {
            if (!text || text.trim() === '') return;
            const content = text.trim();
            addMessage('self', content);
            chatInput.value = '';
            chatInput.focus();
            if (!isReplying) {
                if (replyTimer) clearTimeout(replyTimer);
                const minWait = data.settings.minWait || 3;
                const maxWait = data.settings.maxWait || 8;
                const delay = randomInt(minWait, maxWait) * 1000;
                replyTimer = setTimeout(() => { simulateReply(); }, delay);
            }
        }

        function updateStatsDisplay() {
            const total = data.messages.length;
            const sent = data.messages.filter(m => m.sender === 'self').length;
            const received = data.messages.filter(m => m.sender === 'other').length;
            const letters = data.letters.sent.length + data.letters.received.length;
            // 更新统计卡片（如果有）
            document.querySelectorAll('.stat-grid .num').forEach(el => {
                if (el.id === 'statTotal') el.textContent = total;
                if (el.id === 'statSent') el.textContent = sent;
                if (el.id === 'statReceived') el.textContent = received;
                if (el.id === 'statLetters') el.textContent = letters;
            });
        }

        // ================================================================
        //  字卡库管理
        // ================================================================
        function renderCardLib() {
            const groups = data.wordCards;
            const groupNames = Object.keys(groups);
            let selected = data.selectedGroup;
            if (!selected && groupNames.length > 0) {
                selected = groupNames[0];
                data.selectedGroup = selected;
            }
            if (selected && !groups[selected]) {
                selected = groupNames.length > 0 ? groupNames[0] : null;
                data.selectedGroup = selected;
            }

            let leftHtml = '';
            if (groupNames.length === 0) {
                leftHtml = '<div style="color:rgba(0,0,0,0.15); font-size:12px; padding:8px; text-align:center;">暂无分组</div>';
            } else {
                groupNames.forEach(name => {
                    const active = (name === selected) ? 'active' : '';
                    const count = groups[name] ? groups[name].length : 0;
                    leftHtml += `<div class="group-item ${active}" data-group="${name}"><span>${name}</span><span class="count">${count}</span></div>`;
                });
            }
            groupList.innerHTML = leftHtml;

            let rightHtml = '';
            if (selected && groups[selected]) {
                const cards = groups[selected] || [];
                rightHtml += `<div class="right-header"><span class="group-name">${selected}</span><span class="card-count">共 ${cards.length} 条</span></div>`;
                rightHtml += `<div class="card-list">`;
                cards.forEach((c, idx) => {
                    rightHtml += `<span class="card-tag">${c}<span class="del" data-group="${selected}" data-index="${idx}">✕</span></span>`;
                });
                rightHtml += `</div>`;
                const groupOptions = groupNames.map(name => `<option value="${name}" ${name === selected ? 'selected' : ''}>${name}</option>`).join('');
                rightHtml += `<div class="add-row"><input type="text" id="newCardInput" placeholder="添加字卡…" /><select id="addCardGroupSelect">${groupOptions}</select><button id="addCardBtn">+</button></div>`;
                rightHtml += `<div class="batch-area"><textarea id="batchCardInput" placeholder="批量添加，每行一条…"></textarea><div class="batch-row"><select id="batchGroupSelect">${groupOptions}</select><button id="batchAddBtn">📥 批量添加</button></div></div>`;
            } else {
                rightHtml = '<div style="color:rgba(0,0,0,0.1); padding:20px; text-align:center;">👈 请选择分组</div>';
            }
            cardLibContent.innerHTML = rightHtml;

            // 事件绑定
            groupList.querySelectorAll('.group-item').forEach(el => {
                el.addEventListener('click', function() {
                    const group = this.dataset.group;
                    data.selectedGroup = group;
                    saveData();
                    renderCardLib();
                });
            });

            const addCardBtn = document.getElementById('addCardBtn');
            const newCardInput = document.getElementById('newCardInput');
            const addCardGroupSelect = document.getElementById('addCardGroupSelect');
            if (addCardBtn && newCardInput && addCardGroupSelect && selected) {
                addCardBtn.onclick = function() {
                    const val = newCardInput.value.trim();
                    if (!val) return;
                    const group = addCardGroupSelect.value;
                    if (!data.wordCards[group]) data.wordCards[group] = [];
                    data.wordCards[group].push(val);
                    data.selectedGroup = group;
                    saveData();
                    renderCardLib();
                };
                newCardInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') addCardBtn.click();
                });
            }

            const batchBtn = document.getElementById('batchAddBtn');
            const batchInput = document.getElementById('batchCardInput');
            const batchGroupSelect = document.getElementById('batchGroupSelect');
            if (batchBtn && batchInput && batchGroupSelect && selected) {
                batchBtn.onclick = function() {
                    const lines = batchInput.value.split('\n').map(s => s.trim()).filter(s => s);
                    if (lines.length === 0) return;
                    const group = batchGroupSelect.value;
                    if (!data.wordCards[group]) data.wordCards[group] = [];
                    data.wordCards[group].push(...lines);
                    data.selectedGroup = group;
                    saveData();
                    renderCardLib();
                };
            }

            cardLibContent.querySelectorAll('.card-tag .del').forEach(el => {
                el.addEventListener('click', function() {
                    const group = this.dataset.group;
                    const idx = parseInt(this.dataset.index);
                    if (data.wordCards[group]) {
                        data.wordCards[group].splice(idx, 1);
                        saveData();
                        renderCardLib();
                    }
                });
            });

            addGroupBtn.onclick = function() {
                const name = newGroupInput.value.trim();
                if (!name) return;
                if (data.wordCards[name]) { alert('分组已存在'); return; }
                data.wordCards[name] = [];
                data.selectedGroup = name;
                saveData();
                renderCardLib();
                newGroupInput.value = '';
            };
            newGroupInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addGroupBtn.click();
            });

            exportCardsBtn.onclick = function() {
                const json = JSON.stringify(data.wordCards, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `字卡库_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            importCardsBtn.onclick = function() { importCardsInput.click(); };
            importCardsInput.onchange = function(e) {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    try {
                        const imported = JSON.parse(ev.target.result);
                        if (typeof imported === 'object' && !Array.isArray(imported)) {
                            const mode = document.querySelector('input[name="importMode"]:checked')?.value || 'append';
                            if (mode === 'overwrite') {
                                data.wordCards = {};
                            }
                            for (const key in imported) {
                                if (Array.isArray(imported[key])) {
                                    if (!data.wordCards[key]) data.wordCards[key] = [];
                                    data.wordCards[key] = [...new Set([...data.wordCards[key], ...imported[key]])];
                                }
                            }
                            if (!data.selectedGroup) {
                                const keys = Object.keys(data.wordCards);
                                if (keys.length > 0) data.selectedGroup = keys[0];
                            }
                            saveData();
                            renderCardLib();
                            alert('导入成功！');
                        } else {
                            alert('格式错误');
                        }
                    } catch (err) { alert('解析失败：' + err.message); }
                };
                reader.readAsText(file);
                this.value = '';
            };
        }

        // ================================================================
        //  信件
        // ================================================================
        function renderLetters() {
            const sent = data.letters.sent || [];
            const received = data.letters.received || [];
            let html = '';
            const all = [];
            sent.forEach(l => all.push({ ...l, type: 'sent' }));
            received.forEach(l => all.push({ ...l, type: 'received' }));
            all.sort((a, b) => b.timestamp - a.timestamp);
            if (all.length === 0) {
                html = '<div style="color:rgba(0,0,0,0.1); padding:20px; text-align:center;">还没有信件</div>';
            } else {
                all.forEach(l => {
                    const label = l.type === 'sent' ? '📤 寄出' : '📥 收到';
                    const time = formatDate(l.timestamp);
                    html += `<div class="item"><div class="meta"><span>${label}</span><span>${time}</span></div><div class="content">${l.content || '(空)'}</div>${l.type === 'sent' && l.replied ? '<div class="reply-status">✅ 已收到回信</div>' : ''}${l.type === 'sent' && !l.replied ? '<div class="reply-status">⏳ 等待回信…</div>' : ''}</div>`;
                });
            }
            letterList.innerHTML = html;
        }

        function sendLetter() {
            const content = letterInput.value.trim();
            if (!content) return;
            const sentItem = { content, timestamp: Date.now(), replied: false };
            data.letters.sent.push(sentItem);
            saveData();
            const delay = randomInt(6, 12) * 60 * 60 * 1000;
            const timerId = setTimeout(() => {
                const allCards = getAllCards();
                let replyContent = '（对方没有回复）';
                if (allCards.length > 0) replyContent = pickRandom(allCards);
                const receivedItem = { content: replyContent, timestamp: Date.now() };
                data.letters.received.push(receivedItem);
                const sentIdx = data.letters.sent.findIndex(s => s.timestamp === sentItem.timestamp);
                if (sentIdx !== -1) data.letters.sent[sentIdx].replied = true;
                saveData();
                renderLetters();
                addMessage('other', '📬 你有一封新回信，请到信封页面查看');
            }, delay);
            data.letterTimers[sentItem.timestamp] = timerId;
            letterInput.value = '';
            renderLetters();
            addMessage('self', '📮 信件已寄出，将在6-12小时后收到回信');
            updateStatsDisplay();
            alert('💌 信件已寄出！对方将在6-12小时后回信。');
        }

        // ================================================================
        //  头像设置
        // ================================================================
        function setupAvatar(avatarEl, inputEl, storageKey) {
            const group = avatarEl.closest('.avatar-group');
            group.addEventListener('click', function(e) {
                if (e.target.closest('.upload-hint') || e.target === inputEl) return;
                inputEl.click();
            });
            group.querySelector('.upload-hint')?.addEventListener('click', function(e) {
                e.stopPropagation();
                inputEl.click();
            });
            inputEl.addEventListener('change', function(e) {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const dataUrl = ev.target.result;
                    avatarEl.style.backgroundImage = `url(${dataUrl})`;
                    avatarEl.style.backgroundSize = 'cover';
                    avatarEl.style.backgroundPosition = 'center';
                    avatarEl.textContent = '';
                    avatarEl.style.fontSize = '0';
                    data.settings[storageKey] = dataUrl;
                    saveData();
                    renderMessages();
                };
                reader.readAsDataURL(file);
                this.value = '';
            });
            if (data.settings[storageKey] && (data.settings[storageKey].startsWith('data:') || data.settings[storageKey].startsWith('http'))) {
                avatarEl.style.backgroundImage = `url(${data.settings[storageKey]})`;
                avatarEl.style.backgroundSize = 'cover';
                avatarEl.style.backgroundPosition = 'center';
                avatarEl.textContent = '';
                avatarEl.style.fontSize = '0';
            } else if (data.settings[storageKey]) {
                avatarEl.textContent = data.settings[storageKey];
                avatarEl.style.fontSize = '28px';
                avatarEl.style.backgroundImage = 'none';
            }
        }

        function applyBg(bg, bgImage) {
            const layer = document.getElementById('bgLayer');
            const img = document.getElementById('bgImage');
            if (bgImage && (bgImage.startsWith('data:') || bgImage.startsWith('http'))) {
                img.src = bgImage;
                layer.classList.add('has-image');
                layer.style.background = 'transparent';
            } else {
                img.src = '';
                layer.classList.remove('has-image');
                layer.style.background = bg || '#f5f7fa';
            }
        }

        // ================================================================
        //  电话功能
        // ================================================================
        function showCallWindow(name, status, avatar, isIncoming) {
            callName.textContent = name || '鱼鱼';
            callStatus.textContent = status || '正在呼叫...';
            const avatarContent = avatar || '🌟';
            if (avatarContent.startsWith('data:') || avatarContent.startsWith('http')) {
                callAvatar.innerHTML = `<img src="${avatarContent}" alt="头像" />`;
            } else {
                callAvatar.innerHTML = avatarContent;
                callAvatar.style.fontSize = '22px';
            }
            // 强制默认位置：右上角
            callWindow.style.top = '80px';
            callWindow.style.right = '12px';
            callWindow.style.left = 'auto';
            callWindow.style.bottom = 'auto';
            callWindow.classList.add('show');
            callMiniFloat.classList.remove('show');
            isCallActive = true;
            callAnswered = false;
            callSeconds = 0;
            callTimer.textContent = '00:00';
            callIsMinimized = false;
            if (isIncoming) {
                callStatus.textContent = '📞 邀请你通话...';
            }
        }

        function hideCallWindow() {
            callWindow.classList.remove('show');
            callMiniFloat.classList.remove('show');
            isCallActive = false;
            callAnswered = false;
            if (callTimerInterval) {
                clearInterval(callTimerInterval);
                callTimerInterval = null;
            }
            callIsMinimized = false;
            scheduleRandomCall();
        }

        function minimizeCall() {
            if (isCallActive) {
                callWindow.classList.remove('show');
                callMiniFloat.classList.add('show');
                callIsMinimized = true;
            }
        }

        function restoreCall() {
            if (isCallActive && callIsMinimized) {
                callWindow.classList.add('show');
                callMiniFloat.classList.remove('show');
                callIsMinimized = false;
            }
        }

        function startCallTimer() {
            if (callTimerInterval) clearInterval(callTimerInterval);
            callSeconds = 0;
            callTimerInterval = setInterval(() => {
                callSeconds++;
                const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
                const secs = String(callSeconds % 60).padStart(2, '0');
                callTimer.textContent = mins + ':' + secs;
            }, 1000);
        }

        function makeCall(name) {
            if (randomCallTimer) { clearTimeout(randomCallTimer);
                randomCallTimer = null; }
            const avatar = data.settings.partnerAvatar || '🌟';
            showCallWindow(name || '鱼鱼', '📞 正在呼叫...', avatar, false);
            let ringCount = 0;
            const ringInterval = setInterval(() => {
                ringCount++;
                if (ringCount > 8) {
                    clearInterval(ringInterval);
                    if (isCallActive && !callAnswered) {
                        callStatus.textContent = '⏰ 对方未接听';
                        setTimeout(() => { if (isCallActive) hideCallWindow(); }, 1500);
                    }
                    return;
                }
                if (isCallActive && !callAnswered) {
                    callStatus.textContent = ringCount % 2 === 0 ? '📞 正在呼叫...' : '🔔 振铃中...';
                }
            }, 1000);

            const decisionDelay = Math.floor(Math.random() * 2000) + 3000;
            setTimeout(() => {
                if (!isCallActive || callAnswered) return;
                const willAnswer = Math.random() < 0.5;
                if (willAnswer) {
                    callAnswered = true;
                    clearInterval(ringInterval);
                    callStatus.textContent = '📞 通话中...';
                    startCallTimer();
                    const minSec = 600,
                        maxSec = 604800,
                        randomSec = Math.floor(Math.random() * (maxSec - minSec + 1)) + minSec;
                    setTimeout(() => {
                        if (isCallActive && callAnswered) {
                            callStatus.textContent = '📴 对方挂断了通话';
                            setTimeout(() => { if (isCallActive) hideCallWindow(); }, 800);
                        }
                    }, randomSec * 1000);
                } else {
                    clearInterval(ringInterval);
                    callStatus.textContent = '📴 对方拒绝了你的通话';
                    setTimeout(() => { if (isCallActive) hideCallWindow(); }, 1200);
                }
            }, decisionDelay);

            callEndBtn.onclick = function() {
                if (isCallActive) {
                    clearInterval(ringInterval);
                    if (callTimerInterval) { clearInterval(callTimerInterval);
                        callTimerInterval = null; }
                    if (!callAnswered) {
                        callStatus.textContent = '📴 已取消呼叫';
                    } else {
                        callStatus.textContent = '📴 已挂断';
                    }
                    setTimeout(() => { if (isCallActive) hideCallWindow(); }, 600);
                }
            };
        }

        function incomingCall() {
            if (isCallActive) return;
            const avatar = data.settings.partnerAvatar || '🌟';
            showCallWindow('鱼鱼', '📞 邀请你通话...', avatar, true);
            let ringCount = 0;
            const ringInterval = setInterval(() => {
                ringCount++;
                if (ringCount > 8 && !callAnswered) {
                    clearInterval(ringInterval);
                    if (isCallActive && !callAnswered) {
                        callStatus.textContent = '⏰ 对方取消了通话';
                        setTimeout(() => { if (isCallActive) hideCallWindow(); }, 1500);
                    }
                    return;
                }
                if (isCallActive && !callAnswered) {
                    callStatus.textContent = ringCount % 2 === 0 ? '📞 邀请你通话...' : '🔔 振铃中...';
                }
            }, 1000);

            const decisionDelay = Math.floor(Math.random() * 2000) + 3000;
            setTimeout(() => {
                if (!isCallActive || callAnswered) return;
                const willAnswer = Math.random() < 0.5;
                if (willAnswer) {
                    callAnswered = true;
                    clearInterval(ringInterval);
                    callStatus.textContent = '📞 通话中...';
                    startCallTimer();
                    const minSec = 600,
                        maxSec = 604800,
                        randomSec = Math.floor(Math.random() * (maxSec - minSec + 1)) + minSec;
                    setTimeout(() => {
                        if (isCallActive && callAnswered) {
                            callStatus.textContent = '📴 对方挂断了通话';
                            setTimeout(() => { if (isCallActive) hideCallWindow(); }, 800);
                        }
                    }, randomSec * 1000);
                } else {
                    clearInterval(ringInterval);
                    callStatus.textContent = '📴 对方拒绝了你的通话';
                    setTimeout(() => { if (isCallActive) hideCallWindow(); }, 1200);
                }
            }, decisionDelay);

            callEndBtn.onclick = function() {
                if (isCallActive) {
                    clearInterval(ringInterval);
                    if (callTimerInterval) { clearInterval(callTimerInterval);
                        callTimerInterval = null; }
                    if (!callAnswered) {
                        callStatus.textContent = '📴 已拒绝接听';
                    } else {
                        callStatus.textContent = '📴 已挂断';
                    }
                    setTimeout(() => { if (isCallActive) hideCallWindow(); }, 600);
                }
            };
        }

        function scheduleRandomCall() {
            if (randomCallTimer) { clearTimeout(randomCallTimer);
                randomCallTimer = null; }
            const minDelay = 5,
                maxDelay = 604800,
                delaySeconds = Math.floor(Math.random() * (maxDelay - minDelay + 1)) + minDelay;
            randomCallTimer = setTimeout(() => {
                if (!isCallActive) { incomingCall(); } else { scheduleRandomCall(); }
            }, delaySeconds * 1000);
        }

        callMiniBtn.addEventListener('click', minimizeCall);
        callMiniFloat.addEventListener('click', restoreCall);

        // ===== 电话窗口拖拽（鼠标+触屏） =====
        let dragData = { isDragging: false, startX: 0, startY: 0, offsetX: 0, offsetY: 0 };
        callWindow.addEventListener('mousedown', function(e) {
            if (e.target.closest('button')) return;
            dragData.isDragging = true;
            const rect = callWindow.getBoundingClientRect();
            dragData.offsetX = e.clientX - rect.left;
            dragData.offsetY = e.clientY - rect.top;
            callWindow.style.cursor = 'grabbing';
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!dragData.isDragging) return;
            const parentRect = callWindow.parentElement.getBoundingClientRect();
            let newX = e.clientX - parentRect.left - dragData.offsetX;
            let newY = e.clientY - parentRect.top - dragData.offsetY;
            newX = Math.max(0, Math.min(newX, parentRect.width - callWindow.offsetWidth));
            newY = Math.max(0, Math.min(newY, parentRect.height - callWindow.offsetHeight));
            callWindow.style.left = newX + 'px';
            callWindow.style.top = newY + 'px';
            callWindow.style.right = 'auto';
            callWindow.style.bottom = 'auto';
        });
        document.addEventListener('mouseup', function() {
            if (dragData.isDragging) {
                dragData.isDragging = false;
                callWindow.style.cursor = 'grab';
            }
        });
        callWindow.addEventListener('touchstart', function(e) {
            if (e.target.closest('button')) return;
            const touch = e.touches[0];
            const rect = callWindow.getBoundingClientRect();
            dragData.offsetX = touch.clientX - rect.left;
            dragData.offsetY = touch.clientY - rect.top;
            dragData.isDragging = true;
        }, { passive: true });
        document.addEventListener('touchmove', function(e) {
            if (!dragData.isDragging) return;
            const touch = e.touches[0];
            const parentRect = callWindow.parentElement.getBoundingClientRect();
            let newX = touch.clientX - parentRect.left - dragData.offsetX;
            let newY = touch.clientY - parentRect.top - dragData.offsetY;
            newX = Math.max(0, Math.min(newX, parentRect.width - callWindow.offsetWidth));
            newY = Math.max(0, Math.min(newY, parentRect.height - callWindow.offsetHeight));
            callWindow.style.left = newX + 'px';
            callWindow.style.top = newY + 'px';
            callWindow.style.right = 'auto';
            callWindow.style.bottom = 'auto';
        }, { passive: true });
        document.addEventListener('touchend', function() {
            dragData.isDragging = false;
        }, { passive: true });

                const opt = e.target.closest('.color-opt');
                if (!opt) return;
                const color = opt.dataset.color;
                if (!color) return;
                currentBubbleColor = color;
                data.settings.bubbleColor = color;
                saveData();
                bubbleColorPicker.querySelectorAll('.color-opt').forEach(el => el.classList.remove('active'));
                opt.classList.add('active');
                renderMessages();
            });

            bgPicker.addEventListener('click', function(e) {
                const opt = e.target.closest('.bg-opt');
                if (!opt) return;
                if (opt.classList.contains('custom-bg')) {
                    document.getElementById('customBgInput')?.click();
                    return;
                }
                const bg = opt.dataset.bg;
                if (!bg) return;
                data.settings.bg = bg;
                data.settings.bgImage = '';
                saveData();
                applyBg(bg, '');
                bgPicker.querySelectorAll('.bg-opt').forEach(el => el.classList.remove('active'));
                opt.classList.add('active');
            });
            document.getElementById('customBgInput')?.addEventListener('change', function(e) {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const dataUrl = ev.target.result;
                    data.settings.bgImage = dataUrl;
                    data.settings.bg = '';
                    saveData();
                    applyBg('', dataUrl);
                    bgPicker.querySelectorAll('.bg-opt').forEach(el => el.classList.remove('active'));
                    document.querySelector('.bg-opt.custom-bg')?.classList.add('active');
                };
                reader.readAsDataURL(file);
                this.value = '';
            });

            minWaitRange.addEventListener('input', function() { const v = parseInt(this.value);
                minWaitVal.textContent = v + '秒';
                data.settings.minWait = v;
                saveData(); });
            maxWaitRange.addEventListener('input', function() { const v = parseInt(this.value);
                maxWaitVal.textContent = v + '秒';
                data.settings.maxWait = v;
                saveData(); });
            minReplyRange.addEventListener('input', function() { const v = parseInt(this.value);
                minReplyVal.textContent = v + '条';
                data.settings.minReply = v;
                saveData(); });
            maxReplyRange.addEventListener('input', function() { const v = parseInt(this.value);
                maxReplyVal.textContent = v + '条';
                data.settings.maxReply = v;
                saveData(); });
            intervalRange.addEventListener('input', function() { const v = parseInt(this.value);
                intervalVal.textContent = v + '分钟';
                data.settings.interval = v;
                saveData();
                resetAutoSend(); });

            toggleTimestamp.addEventListener('click', function() {
                this.classList.toggle('active');
                data.settings.showTimestamp = this.classList.contains('active');
                saveData();
                renderMessages();
            });

            addPatBtn.addEventListener('click', function() {
                const val = patInput.value.trim();
                if (!val) return;
                data.pats.push(val);
                saveData();
                renderPatManage();
                patInput.value = '';
            });
            patInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addPatBtn.click();
            });

            addEmojiBtn.addEventListener('click', function() {
                const val = emojiInput.value.trim();
                if (!val) return;
                if (val.startsWith('http') || val.startsWith('data:image')) {
                    data.sticker.push(val);
                } else {
                    data.emojis.push(val);
                }
                saveData();
                renderEmojiPanel();
                renderEmojiManage();
                emojiInput.value = '';
            });
            emojiInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') addEmojiBtn.click();
            });
            importEmojiBtn.addEventListener('click', function() { importEmojiInput.click(); });
            importEmojiInput.addEventListener('change', function(e) {
                const files = this.files;
                if (!files || files.length === 0) return;
                for (const file of files) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const dataUrl = ev.target.result;
                        data.sticker.push(dataUrl);
                        saveData();
                        renderEmojiPanel();
                        renderEmojiManage();
                    };
                    reader.readAsDataURL(file);
                }
                this.value = '';
                alert('✅ 表情包导入成功！');
            });

            sendLetterBtn.addEventListener('click', sendLetter);

            gotoStatsBtn.addEventListener('click', function() {
                alert('总消息: ' + data.messages.length + '\n我发的: ' + data.messages.filter(m => m.sender === 'self').length + '\n对方发的: ' + data.messages.filter(m => m.sender === 'other').length + '\n信件: ' + (data.letters.sent.length + data.letters.received.length));
            });
            clearChatBtn.addEventListener('click', function() {
                if (confirm('确定清空所有聊天记录吗？')) {
                    data.messages = [];
                    saveData();
                    renderMessages();
                    updateStatsDisplay();
                }
            });

            managePatBtn.addEventListener('click', function() {
                const patBlock = document.querySelector('.settings-block .block-title:contains("拍一拍")');
                if (patBlock) patBlock.scrollIntoView({ behavior: 'smooth' });
            });

            document.querySelectorAll('.chat-avatars .avatar').forEach(el => {
                el.addEventListener('dblclick', function() {
                    if (data.pats.length > 0) {
                        const pat = pickRandom(data.pats);
                        showPat(pat);
                    }
                });
            });

            document.addEventListener('click', function(e) {
                if (!emojiPanel.contains(e.target) && !menuEmoji.contains(e.target)) {
                    emojiPanel.classList.remove('show');
                }
            });

            scheduleRandomCall();
            resetAutoSend();

            console.log('📡 传讯已启动！电话窗口默认在右上角，可拖拽');
        }

        function resetAutoSend() {
            if (autoSendTimer) { clearInterval(autoSendTimer);
                autoSendTimer = null; }
            const interval = data.settings.interval || 31;
            if (interval > 0) {
                autoSendTimer = setInterval(() => {
                    const allCards = getAllCards();
                    const emojis = data.emojis || [];
                    const stickers = data.sticker || [];
                    const allEmojis = [...emojis, ...stickers];
                    if ((allCards.length > 0 || allEmojis.length > 0) && !isReplying) {
                        let content = '';
                        if (allCards.length > 0 && Math.random() < 0.6) {
                            content = pickRandom(allCards);
                            if (allEmojis.length > 0 && Math.random() < 0.3) {
                                content += ' ' + pickRandom(allEmojis);
                            }
                        } else if (allEmojis.length > 0) {
                            content = pickRandom(allEmojis);
                        } else {
                            content = '💬 嗨～';
                        }
                        addMessage('other', '💬 ' + content);
                        updateStatsDisplay();
                    }
                }, interval * 60 * 1000);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
