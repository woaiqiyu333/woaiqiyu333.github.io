<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>传讯 · 字卡聊天</title>
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #e8ecf1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .phone {
            width: 400px;
            max-width: 100%;
            height: 780px;
            max-height: 95vh;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* 状态栏 */
        .status-bar {
            padding: 12px 20px 6px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            background: transparent;
            z-index: 2;
            position: relative;
        }
        .status-bar .time {
            font-weight: 600;
            color: rgba(0, 0, 0, 0.4);
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: transparent;
        }
        .app-container .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: #f5f7fa;
            transition: background 0.3s;
            pointer-events: none;
        }
        .app-container .bg-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .app-container .bg-layer.has-image {
            background: transparent !important;
        }
        .app-container .bg-layer.has-image img {
            display: block;
        }
        .app-container>*:not(.bg-layer) {
            position: relative;
            z-index: 1;
        }

        /* ===== 聊天头部 ===== */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px 12px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
        }
        .chat-header .title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 1px;
        }
        .chat-header .actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .chat-header .actions button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.03);
            color: rgba(0, 0, 0, 0.3);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-header .actions button:hover {
            background: rgba(0, 0, 0, 0.06);
            color: #1a1a2e;
        }
        .chat-header .actions .call-header-btn {
            color: #22c55e;
            background: rgba(34, 197, 94, 0.08);
        }
        .chat-header .actions .call-header-btn:hover {
            background: rgba(34, 197, 94, 0.15);
            color: #16a34a;
        }

        /* ===== 头像 ===== */
        .chat-avatars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 12px 0 8px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
        }
        .chat-avatars .avatar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            position: relative;
        }
        .chat-avatars .avatar-group .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(124, 58, 237, 0.08);
            object-fit: cover;
            background: #eef1f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: 0.3s;
        }
        .chat-avatars .avatar-group .avatar:hover {
            border-color: #a78bfa;
            transform: scale(1.03);
        }
        .chat-avatars .avatar-group .label {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.25);
            font-weight: 500;
        }
        .chat-avatars .avatar-group .upload-hint {
            position: absolute;
            bottom: -2px;
            right: -4px;
            background: rgba(124, 58, 237, 0.06);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(124, 58, 237, 0.04);
        }
        .chat-avatars .avatar-group input[type="file"] {
            display: none;
        }
        .chat-avatars .vs {
            color: rgba(0, 0, 0, 0.04);
            font-size: 14px;
        }

        /* ===== 消息列表 ===== */
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            background: transparent;
        }
        .message-list::-webkit-scrollbar {
            width: 3px;
        }
        .message-list::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.06);
            border-radius: 10px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 85%;
            animation: msgIn 0.25s ease-out;
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.self {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.other {
            align-self: flex-start;
            flex-direction: row;
        }
        .message .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            background: #eef1f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }
        .message .bubble-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .message .bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.6;
            word-break: break-word;
            background: #ffffff;
            color: #1a1a2e;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.03);
        }
        .message .bubble img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            display: block;
            margin: 2px 0;
        }
        .message.self .bubble {
            background: #f3e5f5;
            border-bottom-right-radius: 4px;
        }
        .message.other .bubble {
            background: #ffffff;
            border-bottom-left-radius: 4px;
        }
        .message .bubble .time-tag {
            font-size: 10px;
            color: rgba(0, 0, 0, 0.15);
            margin-top: 4px;
            display: block;
            text-align: right;
        }
        .message.self .bubble .time-tag {
            color: rgba(0, 0, 0, 0.2);
        }
        .message .sender-name {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.2);
            font-weight: 500;
        }
        .message.self .sender-name {
            text-align: right;
        }
        .message.other .sender-name {
            text-align: left;
        }

        .typing-indicator {
            align-self: flex-start;
            padding: 8px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.2);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        .typing-indicator.show {
            display: flex;
        }
        .typing-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.2);
            animation: dotBounce 1.2s infinite;
        }
        .typing-indicator .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes dotBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.2;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ===== 输入区域 ===== */
        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px 12px;
            flex-shrink: 0;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(16px);
        }
        .chat-input-area .plus-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.03);
            color: rgba(0, 0, 0, 0.3);
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-input-area .plus-btn:hover {
            background: rgba(0, 0, 0, 0.06);
            color: #1a1a2e;
        }
        .chat-input-area input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 24px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.4);
            color: #1a1a2e;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .chat-input-area input::placeholder {
            color: rgba(0, 0, 0, 0.15);
        }
        .chat-input-area input:focus {
            border-color: rgba(124, 58, 237, 0.15);
            background: #ffffff;
        }
        .chat-input-area .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #c084fc, #a78bfa);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.08);
        }
        .chat-input-area .send-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.12);
        }
        .chat-input-area .send-btn:active {
            transform: scale(0.94);
        }

        /* ===== + 菜单 ===== */
        .plus-menu {
            position: absolute;
            bottom: 70px;
            left: 12px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            padding: 8px 0;
            z-index: 15;
            display: none;
            min-width: 140px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .plus-menu.show {
            display: block;
            animation: menuIn 0.2s ease-out;
        }
        @keyframes menuIn {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .plus-menu .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.6);
            transition: 0.2s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .plus-menu .menu-item:hover {
            background: rgba(124, 58, 237, 0.04);
        }
        .plus-menu .menu-item .icon {
            font-size: 20px;
            width: 28px;
            text-align: center;
        }
        .plus-menu .menu-item input[type="file"] {
            display: none;
        }

        /* ===== 表情包面板 ===== */
        .emoji-panel {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding: 8px 12px 12px;
            flex-shrink: 0;
            max-height: 180px;
            overflow-y: auto;
            position: relative;
            z-index: 5;
        }
        .emoji-panel.show {
            display: block;
        }
        .emoji-panel .emoji-tabs {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            margin-bottom: 8px;
            padding-bottom: 6px;
        }
        .emoji-panel .emoji-tabs .tab {
            font-size: 14px;
            color: rgba(0, 0, 0, 0.3);
            cursor: pointer;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }
        .emoji-panel .emoji-tabs .tab.active {
            color: #1a1a2e;
            border-bottom-color: #7c3aed;
        }
        .emoji-panel .emoji-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 0;
        }
        .emoji-panel .emoji-grid .item {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: #fff;
            cursor: pointer;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            position: relative;
        }
        .emoji-panel .emoji-grid .item:hover {
            background: #f5f5fa;
            transform: scale(1.05);
        }
        .emoji-panel .emoji-grid .item img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .emoji-panel .emoji-grid .item .del-emoji {
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
            color: rgba(0, 0, 0, 0.12);
            background: #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.03);
            cursor: pointer;
        }
        .emoji-panel .emoji-grid .item:hover .del-emoji {
            display: flex;
        }

        /* ===== 电话窗口（默认右上角，可拖拽） ===== */
        .call-window {
            position: absolute;
            top: 80px;
            right: 12px;
            width: 200px;
            background: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 10px 14px;
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: none;
        }
        .call-window.show {
            display: flex;
        }
        .call-window:active {
            cursor: grabbing;
        }
        .call-window .call-mini-btn {
            position: absolute;
            top: 4px;
            right: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .call-window .call-mini-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        .call-window .call-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.08);
            object-fit: cover;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 4px;
            overflow: hidden;
        }
        .call-window .call-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .call-window .call-name {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }
        .call-window .call-status {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 8px;
        }
        .call-window .call-timer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 6px;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
        .call-window .call-end-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #ff3b30;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.2);
        }
        .call-window .call-end-btn:hover {
            transform: scale(1.05);
        }
        .call-window .call-end-btn:active {
            transform: scale(0.92);
        }

        .call-mini {
            position: absolute;
            bottom: 90px;
            right: 12px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 25;
            font-size: 16px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .call-mini.show {
            display: flex;
            animation: miniIn 0.3s ease-out;
        }
        @keyframes miniIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .call-mini:hover {
            transform: scale(1.08);
        }
        .call-mini .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            background: #ff3b30;
            border-radius: 50%;
            font-size: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
        }

        /* ===== 设置全屏页面 ===== */
        .settings-page {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #f7f8fa;
            z-index: 50;
            display: none;
            flex-direction: column;
            border-radius: 36px;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }
        .settings-page.open {
            display: flex;
        }
        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .settings-page .settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background: #ffffff;
            flex-shrink: 0;
        }
        .settings-page .settings-header .title {
            font-size: 18px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .settings-page .settings-header .close-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.04);
            color: rgba(0, 0, 0, 0.4);
            font-size: 18px;
            cursor: pointer;
        }
        .settings-page .settings-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 24px;
        }
        .settings-page .settings-body::-webkit-scrollbar {
            width: 3px;
        }
        .settings-page .settings-body::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.08);
            border-radius: 10px;
        }
        .settings-block {
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .settings-block .block-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.5);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }
        .settings-row:last-child {
            border-bottom: none;
        }
        .settings-row .label {
            font-size: 14px;
            color: rgba(0, 0, 0, 0.6);
        }
        .settings-row .action-btn {
            padding: 4px 14px;
            border-radius: 16px;
            border: 1px solid rgba(124, 58, 237, 0.08);
            background: rgba(124, 58, 237, 0.04);
            color: rgba(0, 0, 0, 0.5);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .settings-row .action-btn:hover {
            background: rgba(124, 58, 237, 0.08);
            border-color: rgba(124, 58, 237, 0.15);
            color: #1a1a2e;
        }
        .settings-row .range-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-row .range-group input[type="range"] {
            width: 100px;
            accent-color: #a78bfa;
        }
        .settings-row .range-group .val {
            min-width: 30px;
            text-align: center;
            color: rgba(0, 0, 0, 0.5);
            font-size: 13px;
        }
        .settings-row .toggle-switch {
            width: 40px;
            height: 22px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.06);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            flex-shrink: 0;
        }
        .settings-row .toggle-switch.active {
            background: rgba(124, 58, 237, 0.3);
        }
        .settings-row .toggle-switch .knob {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.3s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .settings-row .toggle-switch.active .knob {
            left: 20px;
        }
        .color-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .color-picker .color-opt {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .color-picker .color-opt:hover {
            transform: scale(1.08);
        }
        .color-picker .color-opt.active {
            border-color: #1a1a2e;
            box-shadow: 0 0 0 2px #fff, 0 0 0 3px #1a1a2e;
        }
        .bg-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .bg-picker .bg-opt {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .bg-picker .bg-opt:hover {
            transform: scale(1.05);
        }
        .bg-picker .bg-opt.active {
            border-color: #1a1a2e;
            box-shadow: 0 0 0 2px #fff, 0 0 0 3px #1a1a2e;
        }
        .bg-picker .bg-opt.custom-bg {
            background: #eef1f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: rgba(0, 0, 0, 0.15);
        }
        .bg-picker .bg-opt input[type="file"] {
            display: none;
        }

        /* ===== 字卡库 ===== */
        .card-lib-layout {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }
        .card-lib-left {
            width: 120px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 12px;
            padding: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .card-lib-left .group-item {
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
            transition: 0.2s;
        }
        .card-lib-left .group-item:hover {
            background: rgba(124, 58, 237, 0.04);
        }
        .card-lib-left .group-item.active {
            background: rgba(124, 58, 237, 0.08);
            color: #7c3aed;
            font-weight: 500;
        }
        .card-lib-left .group-item .count {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.2);
        }
        .card-lib-left .add-group-row {
            display: flex;
            gap: 4px;
            margin-top: 6px;
        }
        .card-lib-left .add-group-row input {
            flex: 1;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            outline: none;
        }
        .card-lib-left .add-group-row button {
            padding: 4px 10px;
            border-radius: 8px;
            border: none;
            background: rgba(124, 58, 237, 0.06);
            color: rgba(0, 0, 0, 0.3);
            font-size: 12px;
            cursor: pointer;
        }
        .card-lib-right {
            flex: 1;
            background: rgba(0, 0, 0, 0.02);
            border-radius: 12px;
            padding: 10px 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .card-lib-right .right-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .card-lib-right .right-header .group-name {
            font-size: 14px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.6);
        }
        .card-lib-right .right-header .card-count {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.2);
        }
        .card-lib-right .card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 8px;
        }
        .card-lib-right .card-list .card-tag {
            padding: 2px 10px;
            border-radius: 14px;
            background: rgba(124, 58, 237, 0.04);
            border: 1px solid rgba(124, 58, 237, 0.03);
            font-size: 12px;
            color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card-lib-right .card-list .card-tag .del {
            cursor: pointer;
            color: rgba(0, 0, 0, 0.12);
            font-size: 10px;
        }
        .card-lib-right .add-row {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .card-lib-right .add-row input {
            flex: 1;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            outline: none;
        }
        .card-lib-right .add-row select {
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            outline: none;
            max-width: 100px;
        }
        .card-lib-right .add-row button {
            padding: 4px 12px;
            border-radius: 12px;
            border: none;
            background: rgba(124, 58, 237, 0.06);
            color: rgba(0, 0, 0, 0.35);
            font-size: 13px;
            cursor: pointer;
        }
        .card-lib-right .batch-area textarea {
            width: 100%;
            padding: 6px 10px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            resize: vertical;
            min-height: 50px;
            outline: none;
            font-family: inherit;
            margin-top: 6px;
        }
        .card-lib-right .batch-row {
            display: flex;
            gap: 4px;
            margin-top: 4px;
            align-items: center;
        }
        .card-lib-right .batch-row select {
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            outline: none;
            max-width: 100px;
        }
        .card-lib-right .batch-row button {
            padding: 4px 12px;
            border-radius: 12px;
            border: none;
            background: rgba(124, 58, 237, 0.06);
            color: rgba(0, 0, 0, 0.35);
            font-size: 13px;
            cursor: pointer;
        }
        .card-lib-footer {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .card-lib-footer button {
            padding: 4px 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.3);
            color: rgba(0, 0, 0, 0.4);
            font-size: 12px;
            cursor: pointer;
        }
        .import-options {
            display: flex;
            gap: 8px;
            margin-top: 4px;
            align-items: center;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.4);
        }
        .import-options input[type="radio"] {
            accent-color: #a78bfa;
        }

        /* ===== 信件 ===== */
        .letter-form textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.4);
            color: rgba(0, 0, 0, 0.6);
            font-size: 15px;
            line-height: 1.7;
            resize: vertical;
            min-height: 100px;
            outline: none;
            font-family: inherit;
        }
        .letter-form textarea:focus {
            border-color: rgba(124, 58, 237, 0.1);
        }
        .letter-form .send-letter-btn {
            margin-top: 10px;
            padding: 10px 24px;
            border-radius: 24px;
            border: none;
            background: linear-gradient(135deg, #c084fc, #a78bfa);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.08);
        }
        .letter-form .send-letter-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.12);
        }
        .letter-history {
            margin-top: 14px;
        }
        .letter-history .item {
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 2px solid rgba(124, 58, 237, 0.06);
        }
        .letter-history .item .meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(0, 0, 0, 0.15);
            margin-bottom: 4px;
        }
        .letter-history .item .content {
            font-size: 14px;
            color: rgba(0, 0, 0, 0.5);
            line-height: 1.5;
        }
        .letter-history .item .reply-status {
            font-size: 11px;
            color: rgba(124, 58, 237, 0.3);
            margin-top: 4px;
        }

        .pat-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            color: #fff;
            padding: 16px 28px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 500;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            text-align: center;
            max-width: 80%;
        }
        .pat-popup.show {
            animation: patIn 0.4s ease-out forwards;
        }
        @keyframes patIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.05);
            }
            70% {
                transform: translate(-50%, -50%) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        .pat-popup.hide {
            animation: patOut 0.4s ease-in forwards;
        }
        @keyframes patOut {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.1);
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(0, 0, 0, 0.1);
            font-size: 14px;
        }
        .empty-state .icon {
            font-size: 32px;
            margin-bottom: 10px;
            opacity: 0.3;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-grid .stat-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }
        .stat-grid .stat-card .num {
            font-size: 24px;
            font-weight: 600;
            color: #a78bfa;
        }
        .stat-grid .stat-card .lbl {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.15);
            margin-top: 4px;
        }

        @media (max-width: 440px) {
            body {
                padding: 0;
            }
            .phone {
                width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }
            .settings-page {
                border-radius: 0;
            }
            .call-window {
                width: 160px;
                top: 70px;
                right: 8px;
                padding: 8px 8px 10px;
            }
            .call-window .call-avatar {
                width: 36px;
                height: 36px;
                font-size: 18px;
            }
            .call-window .call-name {
                font-size: 13px;
            }
            .call-window .call-end-btn {
                width: 32px;
                height: 32px;
                font-size: 14px;
            }
            .call-mini {
                bottom: 80px;
                right: 8px;
                width: 36px;
                height: 36px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- 手机主体 -->
    <div class="phone" id="app">
        <!-- 状态栏 -->
        <div class="status-bar">
            <span class="time" id="statusTime">14:44</span>
            <span class="icons"><span>📶</span><span>📶</span><span>🔋</span></span>
        </div>

        <div class="app-container" id="appContainer">
            <!-- 背景层 -->
            <div class="bg-layer" id="bgLayer">
                <img id="bgImage" src="" alt="背景" />
            </div>

            <!-- 聊天头部 -->
            <div class="chat-header">
                <button class="back" id="backBtn" title="返回">‹</button>
                <span class="title">传讯</span>
                <div class="actions">
                    <button class="call-header-btn" id="callHeaderBtn" title="打电话">📞</button>
                    <button id="envelopeBtn" title="信封投递">✉</button>
                    <button id="settingsBtn" title="设置">⚙</button>
                </div>
            </div>

            <!-- 头像区域 -->
            <div class="chat-avatars" id="avatarArea">
                <div class="avatar-group" id="myAvatarGroup">
                    <div class="avatar" id="myAvatar">😊</div>
                    <span class="label">我</span>
                    <span class="upload-hint">✎</span>
                    <input type="file" id="myAvatarInput" accept="image/*" />
                </div>
                <span class="vs">✦</span>
                <div class="avatar-group" id="partnerAvatarGroup">
                    <div class="avatar" id="partnerAvatar">🌟</div>
                    <span class="label">鱼鱼</span>
                    <span class="upload-hint">✎</span>
                    <input type="file" id="partnerAvatarInput" accept="image/*" />
                </div>
            </div>

            <!-- 消息列表 -->
            <div class="message-list" id="messageList">
                <div class="empty-state" id="emptyState">
                    <div class="icon">💬</div>
                    <div>开始你们的对话吧</div>
                </div>
            </div>

            <!-- 打字指示器 -->
            <div class="typing-indicator" id="typingIndicator">
                <span>鱼鱼正在输入</span>
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>

            <!-- 表情包/Emoji面板 -->
            <div class="emoji-panel" id="emojiPanel">
                <div class="emoji-tabs">
                    <span class="tab active" data-tab="emoji">😊 Emoji</span>
                    <span class="tab" data-tab="sticker">🖼️ 表情包</span>
                </div>
                <div class="emoji-grid" id="emojiGrid"></div>
            </div>

            <!-- 输入区域 -->
            <div class="chat-input-area">
                <button class="plus-btn" id="plusBtn">+</button>
                <input type="text" id="chatInput" placeholder="输入消息..." autocomplete="off" />
                <button class="send-btn" id="sendBtn">➤</button>
            </div>

            <!-- + 菜单 -->
            <div class="plus-menu" id="plusMenu">
                <button class="menu-item" id="menuEmoji"><span class="icon">😊</span> 表情包</button>
                <button class="menu-item" id="menuImage"><span class="icon">🖼️</span> 发送图片<input type="file" id="imageInput" accept="image/*" capture="environment" /></button>
            </div>

            <!-- 拍一拍弹出 -->
            <div class="pat-popup" id="patPopup"></div>

            <!-- ===== 电话窗口（默认右上角，可拖拽） ===== -->
            <div class="call-window" id="callWindow">
                <button class="call-mini-btn" id="callMiniBtn" title="缩小">─</button>
                <div class="call-avatar" id="callAvatar">📞</div>
                <div class="call-name" id="callName">鱼鱼</div>
                <div class="call-status" id="callStatus">正在呼叫...</div>
                <div class="call-timer" id="callTimer">00:00</div>
                <button class="call-end-btn" id="callEndBtn" title="挂断">✕</button>
            </div>

            <!-- 迷你浮窗 -->
            <button class="call-mini" id="callMiniFloat">📞<span class="badge">通话</span></button>

            <!-- ===== 设置全屏页面 ===== -->
            <div class="settings-page" id="settingsPage">
                <div class="settings-header">
                    <span class="title">⚙ 设置</span>
                    <button class="close-btn" id="closeSettings">✕</button>
                </div>
                <div class="settings-body" id="settingsBody">
                    <!-- 聊天设置 -->
                    <div class="settings-block">
                        <div class="block-title">💬 聊天设置</div>
                        <div class="settings-row">
                            <span class="label">最短等待</span>
                            <div class="range-group">
                                <input type="range" id="minWaitRange" min="0" max="60" value="3" />
                                <span class="val" id="minWaitVal">3秒</span>
                            </div>
                        </div>
                        <div class="settings-row">
                            <span class="label">最长等待</span>
                            <div class="range-group">
                                <input type="range" id="maxWaitRange" min="0" max="120" value="8" />
                                <span class="val" id="maxWaitVal">8秒</span>
                            </div>
                        </div>
                        <div class="settings-row">
                            <span class="label">最少回复条数</span>
                            <div class="range-group">
                                <input type="range" id="minReplyRange" min="1" max="10" value="1" />
                                <span class="val" id="minReplyVal">1条</span>
                            </div>
                        </div>
                        <div class="settings-row">
                            <span class="label">最多回复条数</span>
                            <div class="range-group">
                                <input type="range" id="maxReplyRange" min="1" max="10" value="3" />
                                <span class="val" id="maxReplyVal">3条</span>
                            </div>
                        </div>
                        <div class="settings-row">
                            <span class="label">主动发送间隔</span>
                            <div class="range-group">
                                <input type="range" id="intervalRange" min="5" max="120" value="31" />
                                <span class="val" id="intervalVal">31分钟</span>
                            </div>
                        </div>
                        <div class="settings-row">
                            <span class="label">显示时间戳</span>
                            <div class="toggle-switch active" id="toggleTimestamp">
                                <div class="knob"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 自定义回复（字卡库） -->
                    <div class="settings-block">
                        <div class="block-title">📚 自定义回复（字卡库）</div>
                        <div id="cardLibContainer">
                            <div class="card-lib-layout">
                                <div class="card-lib-left" id="cardLibLeft">
                                    <div id="groupList"></div>
                                    <div class="add-group-row">
                                        <input type="text" id="newGroupInput" placeholder="新分组…" />
                                        <button id="addGroupBtn">+</button>
                                    </div>
                                </div>
                                <div class="card-lib-right" id="cardLibRight">
                                    <div id="cardLibContent"></div>
                                </div>
                            </div>
                            <div class="card-lib-footer">
                                <button id="exportCardsBtn">📤 导出字卡</button>
                                <button id="importCardsBtn">📥 导入字卡</button>
                                <input type="file" id="importCardsInput" accept=".json" />
                            </div>
                            <div class="import-options">
                                <label><input type="radio" name="importMode" value="append" checked /> 追加</label>
                                <label><input type="radio" name="importMode" value="overwrite" /> 覆盖</label>
                            </div>
                        </div>
                    </div>

                    <!-- 信件 -->
                    <div class="settings-block">
                        <div class="block-title">✉️ 信件</div>
                        <div class="letter-form">
                            <textarea id="letterInput" placeholder="写一封信… 对方会在6-12小时后从字卡库中回信 💌"></textarea>
                            <button class="send-letter-btn" id="sendLetterBtn">📤 寄出</button>
                        </div>
                        <div class="letter-history" id="letterHistory">
                            <div style="color:rgba(0,0,0,0.1); font-size:12px; letter-spacing:1px; margin-top:12px;">📬 历史</div>
                            <div id="letterList"></div>
                        </div>
                    </div>

                    <!-- 背景与外观 -->
                    <div class="settings-block">
                        <div class="block-title">🎨 背景与外观</div>
                        <div class="settings-row" style="flex-wrap:wrap; gap:6px;">
                            <span class="label" style="width:100%;">气泡颜色</span>
                            <div class="color-picker" id="bubbleColorPicker">
                                <div class="color-opt active" style="background:#f3e5f5" data-color="#f3e5f5"></div>
                                <div class="color-opt" style="background:#e8eaf6" data-color="#e8eaf6"></div>
                                <div class="color-opt" style="background:#e3f2fd" data-color="#e3f2fd"></div>
                                <div class="color-opt" style="background:#e0f7fa" data-color="#e0f7fa"></div>
                                <div class="color-opt" style="background:#e8f5e9" data-color="#e8f5e9"></div>
                                <div class="color-opt" style="background:#fff8e1" data-color="#fff8e1"></div>
                                <div class="color-opt" style="background:#fff3e0" data-color="#fff3e0"></div>
                                <div class="color-opt" style="background:#fce4ec" data-color="#fce4ec"></div>
