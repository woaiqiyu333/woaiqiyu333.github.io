<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>传讯 · 字卡聊天</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif}
        body{background:#e8ecf1;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .phone{width:400px;max-width:100%;height:780px;max-height:95vh;background:#fff;border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.08);overflow:hidden;display:flex;flex-direction:column;position:relative}
        .status-bar{padding:12px 20px 6px;display:flex;justify-content:space-between;font-size:12px;color:rgba(0,0,0,.3);flex-shrink:0;background:transparent;z-index:2;position:relative}
        .status-bar .time{font-weight:600;color:rgba(0,0,0,.4)}
        .app-container{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;background:transparent}
        .app-container .bg-layer{position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;background:#f5f7fa;transition:background .3s;pointer-events:none}
        .app-container .bg-layer img{width:100%;height:100%;object-fit:cover;display:none}
        .app-container .bg-layer.has-image{background:transparent!important}
        .app-container .bg-layer.has-image img{display:block}
        .app-container>*:not(.bg-layer){position:relative;z-index:1}
        .chat-header{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 12px;flex-shrink:0;border-bottom:1px solid rgba(0,0,0,.04);background:rgba(255,255,255,.6);backdrop-filter:blur(16px)}
        .chat-header .title{font-size:20px;font-weight:700;color:#1a1a2e;letter-spacing:1px}
        .chat-header .actions button{width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.03);color:rgba(0,0,0,.3);font-size:18px;cursor:pointer;transition:.2s}
        .chat-header .actions button:hover{background:rgba(0,0,0,.06);color:#1a1a2e}
        .chat-avatars{display:flex;align-items:center;justify-content:center;gap:28px;padding:12px 0 8px;flex-shrink:0;background:rgba(255,255,255,.3);backdrop-filter:blur(8px)}
        .chat-avatars .avatar-group{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative}
        .chat-avatars .avatar-group .avatar{width:56px;height:56px;border-radius:50%;border:2px solid rgba(124,58,237,.08);object-fit:cover;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:28px;color:rgba(0,0,0,.1);overflow:hidden;transition:.3s}
        .chat-avatars .avatar-group .avatar:hover{border-color:#a78bfa;transform:scale(1.03)}
        .chat-avatars .avatar-group .label{font-size:11px;color:rgba(0,0,0,.25);font-weight:500}
        .chat-avatars .avatar-group .upload-hint{position:absolute;bottom:-2px;right:-4px;background:rgba(124,58,237,.06);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(0,0,0,.15);border:1px solid rgba(124,58,237,.04)}
        .chat-avatars .avatar-group input[type=file]{display:none}
        .chat-avatars .vs{color:rgba(0,0,0,.04);font-size:14px}
        .message-list{flex:1;overflow-y:auto;padding:12px 16px 8px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;background:transparent}
        .message-list::-webkit-scrollbar{width:3px}
        .message-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,.06);border-radius:10px}
        .message{display:flex;align-items:flex-start;gap:10px;max-width:85%;animation:msgIn .25s ease-out}
        @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        .message.self{align-self:flex-end;flex-direction:row-reverse}
        .message.other{align-self:flex-start;flex-direction:row}
        .message .msg-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;object-fit:cover;background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid rgba(0,0,0,.03)}
        .message .bubble-wrapper{display:flex;flex-direction:column;gap:2px}
        .message .bubble{padding:10px 16px;border-radius:18px;font-size:16px;line-height:1.6;word-break:break-word;background:#fff;color:#1a1a2e;box-shadow:0 1px 4px rgba(0,0,0,.03)}
        .message .bubble img{max-width:200px;max-height:200px;border-radius:8px;display:block;margin:2px 0}
        .message.self .bubble{background:#f3e5f5;border-bottom-right-radius:4px}
        .message.other .bubble{background:#fff;border-bottom-left-radius:4px}
        .message .bubble .time-tag{font-size:10px;color:rgba(0,0,0,.15);margin-top:4px;display:block;text-align:right}
        .message.self .bubble .time-tag{color:rgba(0,0,0,.2)}
        .message .sender-name{font-size:11px;color:rgba(0,0,0,.2);font-weight:500}
        .message.self .sender-name{text-align:right}
        .message.other .sender-name{text-align:left}
        .typing-indicator{align-self:flex-start;padding:8px 16px;border-radius:18px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);display:none;align-items:center;gap:6px;font-size:14px;color:rgba(0,0,0,.2);box-shadow:0 1px 4px rgba(0,0,0,.02)}
        .typing-indicator.show{display:flex}
        .typing-indicator .dot{width:6px;height:6px;border-radius:50%;background:rgba(124,58,237,.2);animation:dotBounce 1.2s infinite}
        .typing-indicator .dot:nth-child(2){animation-delay:.2s}
        .typing-indicator .dot:nth-child(3){animation-delay:.4s}
        @keyframes dotBounce{0%,60%,100%{transform:translateY(0);opacity:.2}30%{transform:translateY(-6px);opacity:1}}
        .chat-input-area{display:flex;align-items:center;gap:6px;padding:8px 12px 12px;flex-shrink:0;border-top:1px solid rgba(0,0,0,.04);background:rgba(255,255,255,.6);backdrop-filter:blur(16px)}
        .chat-input-area .plus-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(0,0,0,.03);color:rgba(0,0,0,.3);font-size:22px;cursor:pointer;transition:.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center}
        .chat-input-area .plus-btn:hover{background:rgba(0,0,0,.06);color:#1a1a2e}
        .chat-input-area input{flex:1;padding:8px 14px;border-radius:24px;border:1px solid rgba(0,0,0,.04);background:rgba(255,255,255,.4);color:#1a1a2e;font-size:16px;outline:none;transition:.3s}
        .chat-input-area input::placeholder{color:rgba(0,0,0,.15)}
        .chat-input-area input:focus{border-color:rgba(124,58,237,.15);background:#fff}
        .chat-input-area .send-btn{width:36px;height:36px;border-radius:50%;border:none;background:linear-gradient(135deg,#c084fc,#a78bfa);color:#fff;font-size:16px;cursor:pointer;transition:.3s;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 16px rgba(124,58,237,.08)}
        .chat-input-area .send-btn:hover{transform:scale(1.04);box-shadow:0 6px 24px rgba(124,58,237,.12)}
        .chat-input-area .send-btn:active{transform:scale(.94)}
        .plus-menu{position:absolute;bottom:70px;left:12px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.12);padding:8px 0;z-index:15;display:none;min-width:140px;border:1px solid rgba(0,0,0,.04)}
        .plus-menu.show{display:block;animation:menuIn .2s ease-out}
        @keyframes menuIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        .plus-menu .menu-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:14px;color:rgba(0,0,0,.6);transition:.2s;border:none;background:transparent;width:100%;text-align:left}
        .plus-menu .menu-item:hover{background:rgba(124,58,237,.04)}
        .plus-menu .menu-item .icon{font-size:20px;width:28px;text-align:center}
        .plus-menu .menu-item input[type=file]{display:none}
        .overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.15);backdrop-filter:blur(20px);z-index:10;display:none;flex-direction:column;border-radius:36px;overflow:hidden;animation:fadeIn .25s ease-out}
        .overlay.open{display:flex}
        @keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
        .overlay-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;flex-shrink:0;border-bottom:1px solid rgba(0,0,0,.04);background:rgba(255,255,255,.7);backdrop-filter:blur(16px)}
        .overlay-header .title{font-size:17px;font-weight:600;color:#1a1a2e}
        .overlay-header .close-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(0,0,0,.02);color:rgba(0,0,0,.25);font-size:18px;cursor:pointer;transition:.2s}
        .overlay-header .close-btn:hover{background:rgba(0,0,0,.05);color:#1a1a2e}
        .overlay-body{flex:1;overflow-y:auto;padding:16px 20px 24px;background:rgba(255,255,255,.4);backdrop-filter:blur(8px)}
        .overlay-body::-webkit-scrollbar{width:3px}
        .overlay-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.06);border-radius:10px}
        .setting-group{margin-bottom:22px}
        .setting-group .group-title{font-size:12px;font-weight:600;color:rgba(0,0,0,.15);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
        .setting-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(0,0,0,.02)}
        .setting-row .label{font-size:14px;color:rgba(0,0,0,.5)}
        .setting-row .action-btn{padding:4px 14px;border-radius:16px;border:1px solid rgba(124,58,237,.06);background:rgba(124,58,237,.03);color:rgba(0,0,0,.35);font-size:12px;cursor:pointer;transition:.2s}
        .setting-row .action-btn:hover{background:rgba(124,58,237,.06);border-color:rgba(124,58,237,.1);color:#1a1a2e}
        .color-picker{display:flex;gap:10px;flex-wrap:wrap}
        .color-picker .color-opt{width:32px;height:32px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:.2s;flex-shrink:0}
        .color-picker .color-opt:hover{transform:scale(1.08)}
        .color-picker .color-opt.active{border-color:#1a1a2e;box-shadow:0 0 0 2px #fff,0 0 0 4px #1a1a2e}
        .bg-picker{display:flex;gap:10px;flex-wrap:wrap}
        .bg-picker .bg-opt{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;transition:.2s;flex-shrink:0;background-size:cover;background-position:center}
        .bg-picker .bg-opt:hover{transform:scale(1.05)}
        .bg-picker .bg-opt.active{border-color:#1a1a2e;box-shadow:0 0 0 2px #fff,0 0 0 4px #1a1a2e}
        .bg-picker .bg-opt.custom-bg{background:#eef1f5;display:flex;align-items:center;justify-content:center;font-size:18px;color:rgba(0,0,0,.1)}
        .bg-picker .bg-opt input[type=file]{display:none}
        .toggle-switch{width:40px;height:22px;border-radius:12px;background:rgba(0,0,0,.04);cursor:pointer;transition:.3s;position:relative;flex-shrink:0}
        .toggle-switch.active{background:rgba(124,58,237,.25)}
        .toggle-switch .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.04)}
        .toggle-switch.active .knob{left:20px}
        .range-group{display:flex;align-items:center;gap:8px}
        .range-group input[type=range]{width:100px;accent-color:#a78bfa;background:transparent}
        .range-group .val{min-width:30px;text-align:center;color:rgba(0,0,0,.4);font-size:13px}
        .letter-form textarea{width:100%;padding:14px 16px;border-radius:16px;border:1px solid rgba(0,0,0,.04);background:rgba(255,255,255,.4);color:rgba(0,0,0,.6);font-size:15px;line-height:1.7;resize:vertical;min-height:120px;outline:none;font-family:inherit}
        .letter-form textarea:focus{border-color:rgba(124,58,237,.1)}
        .letter-form .send-letter-btn{margin-top:14px;padding:12px 28px;border-radius:24px;border:none;background:linear-gradient(135deg,#c084fc,#a78bfa);color:#fff;font-size:15px;font-weight:500;cursor:pointer;transition:.3s;box-shadow:0 4px 20px rgba(124,58,237,.08)}
        .letter-form .send-letter-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(124,58,237,.12)}
        .letter-history{margin-top:18px}
        .letter-history .item{padding:10px 14px;background:rgba(255,255,255,.3);backdrop-filter:blur(8px);border-radius:10px;margin-bottom:8px;border-left:2px solid rgba(124,58,237,.06)}
        .letter-history .item .meta{display:flex;justify-content:space-between;font-size:11px;color:rgba(0,0,0,.15);margin-bottom:4px}
        .letter-history .item .content{font-size:14px;color:rgba(0,0,0,.5);line-height:1.5}
        .letter-history .item .reply-status{font-size:11px;color:rgba(124,58,237,.3);margin-top:4px}
        .pat-popup{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:rgba(0,0,0,.4);backdrop-filter:blur(16px);color:#fff;padding:16px 28px;border-radius:20px;font-size:18px;font-weight:500;z-index:20;opacity:0;pointer-events:none;text-align:center;max-width:80%}
        .pat-popup.show{animation:patIn .4s ease-out forwards}
        @keyframes patIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{transform:translate(-50%,-50%) scale(.95)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
        .pat-popup.hide{animation:patOut .4s ease-in forwards}
        @keyframes patOut{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.1)}}
        .empty-state{text-align:center;padding:40px 20px;color:rgba(0,0,0,.1);font-size:14px}
        .empty-state .icon{font-size:32px;margin-bottom:10px;opacity:.3}
        .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .stat-grid .stat-card{background:rgba(255,255,255,.3);backdrop-filter:blur(8px);border-radius:12px;padding:14px;text-align:center;border:1px solid rgba(0,0,0,.02)}
        .stat-grid .stat-card .num{font-size:24px;font-weight:600;color:#a78bfa}
        .stat-grid .stat-card .lbl{font-size:11px;color:rgba(0,0,0,.15);margin-top:4px}
        .hidden{display:none!important}

        /* ===== 电话小窗（右上角） ===== */
        .call-window {
            position: absolute;
            top: 56px;
            right: 12px;
            width: 240px;
            height: 300px;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            z-index: 30;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 12px 20px;
            animation: callSlideIn 0.3s ease-out;
            overflow: hidden;
        }
        @keyframes callSlideIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .call-window.show { display: flex; }

        /* 缩小按钮 - 右上角 */
        .call-window .call-mini-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            background: rgba(255,255,255,0.08);
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .call-window .call-mini-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .call-window .call-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.1);
            object-fit: cover;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: rgba(255,255,255,0.2);
            margin-bottom: 8px;
            overflow: hidden;
        }
        .call-window .call-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .call-window .call-name {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }
        .call-window .call-status {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 14px;
        }
        .call-window .call-timer {
            font-size: 14px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
        /* 挂断按钮 - 右下角 */
        .call-window .call-end-btn {
            position: absolute;
            bottom: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: #ff3b30;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
        }
        .call-window .call-end-btn:hover { transform: scale(1.05); background: #e0352b; }
        .call-window .call-end-btn:active { transform: scale(0.92); }

        /* 接听按钮（隐藏，因为系统自动接听） */
        .call-window .call-answer-btn { display: none; }

        /* 缩小后的迷你浮窗 */
        .call-mini {
            position: absolute;
            bottom: 90px;
            right: 16px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(10,10,10,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 25;
            font-size: 18px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .call-mini.show { display: flex; animation: miniIn 0.3s ease-out; }
        @keyframes miniIn { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: scale(1); } }
        .call-mini:hover { transform: scale(1.08); border-color: rgba(255,255,255,0.15); }
        .call-mini .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 16px;
            height: 16px;
            background: #ff3b30;
            border-radius: 50%;
            font-size: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
        }

        /* ===== 字卡库（保留原有样式） ===== */
        .card-lib-layout{display:flex;gap:12px;height:100%;min-height:400px}
        .card-lib-left{width:140px;flex-shrink:0;background:rgba(255,255,255,.3);backdrop-filter:blur(8px);border-radius:12px;padding:10px 8px;overflow-y:auto;max-height:500px}
        .card-lib-left .lib-title{font-size:12px;font-weight:600;color:rgba(0,0,0,.2);padding:4px 8px 8px;border-bottom:1px solid rgba(0,0,0,.04);margin-bottom:6px;letter-spacing:1px}
        .card-lib-left .group-item{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px;color:rgba(0,0,0,.5);transition:.2s;display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
        .card-lib-left .group-item:hover{background:rgba(124,58,237,.04)}
        .card-lib-left .group-item.active{background:rgba(124,58,237,.08);color:#7c3aed;font-weight:500}
        .card-lib-left .group-item .count{font-size:12px;color:rgba(0,0,0,.2);font-weight:400}
        .card-lib-left .group-item .del-group{color:rgba(0,0,0,.1);cursor:pointer;font-size:12px;padding:0 4px}
        .card-lib-left .group-item .del-group:hover{color:#dc2626}
        .card-lib-left .add-group-row{display:flex;gap:4px;margin-top:8px}
        .card-lib-left .add-group-row input{flex:1;padding:6px 8px;border-radius:8px;border:1px solid rgba(0,0,0,.04);background:rgba(255,255,255,.4);font-size:12px;outline:none}
        .card-lib-left .add-group-row input:focus{border-color:rgba(124,58,237,.1)}
        .card-lib-left .add-group-row button{padding:6px 10px;border-radius:8px;border:none;background:rgba(124,58,237,.06);color:rgba(0,0,0,.3);font-size:12px;cursor:pointer;white-space:nowrap}
        .card-lib-left .add-group-row button:hover{background:rgba(124,58,237,.1);color:#1a1a2e}
        .card-lib-right{flex:1;background:rgba(255,255,255,.3);backdrop-filter:blur(8px);border-radius:12px;padding:12px 14px;overflow-y:auto;max-height:500px}
        .card-lib-right .right-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px}
        .card-lib-right .right-header .group-name{font-size:15px;font-weight:600;color:rgba(0,0,0,.6)}
        .card-lib-right .right-header .card-count{font-size:12px;color:rgba(0,0,0,.15)}
        .card-lib-right .card-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

<script>
    // ===== 完整 JavaScript =====
    const STORAGE_KEY='chuanxun_data_final';
    const defaultData={settings:{myAvatar:'😊',partnerAvatar:'🌟',bubbleColor:'#f3e5f5',bg:'#f5f7fa',bgImage:'',minWait:3,maxWait:8,minReply:1,maxReply:3,interval:31,showTimestamp:!0},messages:[],wordCards:{'关心提醒':[],'情绪身体状况状态':[],'关于网站系统链接':[],'吵架哄人':[],'游戏':[],'日常':[]},letters:{sent:[],received:[]},pats:['拍了拍我的头','戳了戳我的脸','捏了捏我的脸','揉了揉我的肚子','拍了拍我的肩膀'],emojis:['😊','❤️','😂','😭','🥺','✨','🔥','💕','🎉','🤔','😘','💪'],letterTimers:{},selectedGroup:null};
    let data=loadData();

    function deepMerge(target,source){const result={...target};for(const key in source){if(source[key]&&typeof source[key]==='object'&&!Array.isArray(source[key])){result[key]=deepMerge(target[key]||{},source[key]);}else{result[key]=source[key];}}return result;}

    // ===== 电话小窗 =====
    function showCallWindow(name,status,avatar,isIncoming){
        callName.textContent=name||'鱼鱼';

        const avatarContent=avatar||'🌟';
        if(avatarContent.startsWith('data:')||avatarContent.startsWith('http')){

        callMiniFloat.classList.remove('show');
        isCallActive=!0;
        callAnswered=!1;
        callSeconds=0;
        callTimer.textContent='00:00';
        callIsMinimized=!1;
        // 如果是来电，显示"邀请你通话"状态
        if(isIncoming){
            callStatus.textContent='📞 邀请你通话...';
        }
    }

    function hideCallWindow(){
        callWindow.classList.remove('show');
        callMiniFloat.classList.remove('show');
        isCallActive=!1;
        callAnswered=!1;
        if(callTimerInterval){clearInterval(callTimerInterval);callTimerInterval=null;}
        callIsMinimized=!1;
        scheduleRandomCall();
    }

    function minimizeCall(){
        if(isCallActive){
            callWindow.classList.remove('show');
            callMiniFloat.classList.add('show');
            callIsMinimized=!0;
        }
    }
    function restoreCall(){
        if(isCallActive&&callIsMinimized){
            callWindow.classList.add('show');
            callMiniFloat.classList.remove('show');
            callIsMinimized=!1;
        }
    }

        if(callTimerInterval)clearInterval(callTimerInterval);
        callSeconds=0;

            callSeconds++;
            const mins=String(Math.floor(callSeconds/60)).padStart(2,'0');
            const secs=String(callSeconds%60).padStart(2,'0');
            callTimer.textContent=mins+':'+secs;
        },1000);
    }

    function makeCall(name){
        if(randomCallTimer){clearTimeout(randomCallTimer);randomCallTimer=null;}
        const avatar=data.settings.partnerAvatar||'🌟';
        showCallWindow(name||'鱼鱼','📞 正在呼叫...',avatar,!1);
        let ringCount=0;
        const ringInterval=setInterval(()=>{
            ringCount++;
            if(ringCount>8){
                clearInterval(ringInterval);
                if(isCallActive&&!callAnswered){
                    callStatus.textContent='⏰ 对方未接听';
                    setTimeout(()=>{if(isCallActive)hideCallWindow();},1500);
                }
                return;
            }
            if(isCallActive&&!callAnswered){
                callStatus.textContent=ringCount%2===0?'📞 正在呼叫...':'🔔 振铃中...';
            }
        },1000);

        // 3~5秒后系统自动决定接听或拒接
        const decisionDelay=Math.floor(Math.random()*2000)+3000; // 3000~5000ms
        setTimeout(()=>{
            if(!isCallActive||callAnswered)return;
            const answerRate=0.5; // 50% 接听概率
            const willAnswer=Math.random()<answerRate;
            if(willAnswer){
                // 接听
                callAnswered=!0;
                clearInterval(ringInterval);
                callStatus.textContent='📞 通话中...';
                startCallTimer();
                const minSec=600,maxSec=604800,randomSec=Math.floor(Math.random()*(maxSec-minSec+1))+minSec;
                setTimeout(()=>{
                    if(isCallActive&&callAnswered){
                        callStatus.textContent='📴 对方挂断了通话';
                        setTimeout(()=>{if(isCallActive)hideCallWindow();},800);
                    }
                },randomSec*1000);
            }else{
                // 拒接
                clearInterval(ringInterval);
                callStatus.textContent='📴 对方拒绝了你的通话';
                setTimeout(()=>{if(isCallActive)hideCallWindow();},1200);
            }
        },decisionDelay);

        // 手动挂断按钮
        callEndBtn.onclick=function(){
            if(isCallActive){
                clearInterval(ringInterval);
                if(callTimerInterval){clearInterval(callTimerInterval);callTimerInterval=null;}
                if(!callAnswered){
                    callStatus.textContent='📴 已取消呼叫';
                }else{
                    callStatus.textContent='📴 已挂断';
                }
                setTimeout(()=>{if(isCallActive)hideCallWindow();},600);
            }
        };
    }

                    callStatus.textContent='⏰ 对方取消了通话';

                return;
            }
            if(isCallActive&&!callAnswered){
                callStatus.textContent=ringCount%2===0?'📞 邀请你通话...':'🔔 振铃中...';

        },1000);

        // 3~5秒后系统自动决定接听或拒接（和拨打一样）
        const decisionDelay=Math.floor(Math.random()*2000)+3000;

            if(willAnswer){
                callAnswered=!0;
                clearInterval(ringInterval);

                startCallTimer();
                const minSec=600,maxSec=604800,randomSec=Math.floor(Math.random()*(maxSec-minSec+1))+minSec;
                setTimeout(()=>{
                    if(isCallActive&&callAnswered){
                        callStatus.textContent='📴 对方挂断了通话';
                        setTimeout(()=>{if(isCallActive)hideCallWindow();},800);
                    }
                },randomSec*1000);
            }else{
                clearInterval(ringInterval);
                callStatus.textContent='📴 对方拒绝了你的通话';
                setTimeout(()=>{if(isCallActive)hideCallWindow();},1200);
            }
        },decisionDelay);

                    callStatus.textContent='📴 已拒绝接听';

    // 随机来电调度
    function scheduleRandomCall(){
        if(randomCallTimer){clearTimeout(randomCallTimer);randomCallTimer=null;}
        const minDelay=5,maxDelay=604800,delaySeconds=Math.floor(Math.random()*(maxDelay-minDelay+1))+minDelay;
        randomCallTimer=setTimeout(()=>{
            if(!isCallActive){incomingCall();}

    function formatTime(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
    function formatDate(ts){const d=new Date(ts);return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+formatTime(ts);}
    function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
    function pickRandom(arr){if(!arr||arr.length===0)return null;return arr[Math.floor(Math.random()*arr.length)];}
    function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
    function getAllCards(){const groups=data.wordCards;const all=[];for(const key in groups){if(Array.isArray(groups[key])){all.push(...groups[key]);}}return all;}

    function renderMessages(){const msgs=data.messages;messageList.innerHTML='';if(msgs.length===0){messageList.appendChild(emptyState);return;}const myAvatarUrl=data.settings.myAvatar,partnerAvatarUrl=data.settings.partnerAvatar;msgs.forEach(msg=>{const div=document.createElement('div');div.className=`message ${msg.sender==='self'?'self':'other'}`;const avatarContent=msg.sender==='self'?myAvatarUrl:partnerAvatarUrl;const avatarHtml=`<div class="msg-avatar" style="background-image:url('${avatarContent}');background-size:cover;background-position:center;font-size:0;">${avatarContent.startsWith('data:')||avatarContent.startsWith('http')?'':avatarContent}</div>`;const timeHtml=data.settings.showTimestamp?`<span class="time-tag">${formatTime(msg.timestamp)}</span>`:'';const nameLabel=msg.sender==='self'?'我':'鱼鱼';let bubbleContent=msg.content;if(typeof msg.content==='string'&&(msg.content.startsWith('data:image/')||(msg.content.startsWith('http')&&msg.content.match(/\.(jpg|jpeg|png|gif|webp)/i)))){bubbleContent=`<img src="${msg.content}" alt="图片" />`;}const bubbleColor=msg.sender==='self'?currentBubbleColor:'#ffffff';div.innerHTML=(msg.sender==='other'?avatarHtml:'')+`<div class="bubble-wrapper"><div class="sender-name">${nameLabel}</div><div class="bubble" style="background:${bubbleColor}">${bubbleContent}${timeHtml}</div></div>`+(msg.sender==='self'?avatarHtml:'');messageList.appendChild(div);});messageList.scrollTop=messageList.scrollHeight;}
    function addMessage(sender,content,timestamp){const ts=timestamp||Date.now();data.messages.push({sender,content,timestamp:ts});saveData();renderMessages();updateStats();return ts;}
    function sendImage(dataUrl){addMessage('self',dataUrl);if(!isReplying){if(replyTimer)clearTimeout(replyTimer);const minWait=data.settings.minWait||3,maxWait=data.settings.maxWait||8,delay=randomInt(minWait,maxWait)*1000;replyTimer=setTimeout(()=>{simulateReply();},delay);}}
    async function simulateReply(){if(isReplying)return;isReplying=!0;const minWait=data.settings.minWait||3,maxWait=data.settings.maxWait||8,minReply=data.settings.minReply||1,maxReply=data.settings.maxReply||3,waitTime=randomInt(minWait,maxWait)*1000;typingIndicator.classList.add('show');await sleep(waitTime);typingIndicator.classList.remove('show');const allCards=getAllCards(),emojis=data.emojis||[];if(allCards.length===0&&emojis.length===0){isReplying=!1;return;}const count=randomInt(minReply,maxReply);let replyContents=[];const shuffledCards=[...allCards].sort(()=>Math.random()-0.5),cardCount=Math.min(count,allCards.length),selectedCards=shuffledCards.slice(0,cardCount);for(let i=0;i<count;i++){let content='';const roll=Math.random();if(roll<0.4&&selectedCards.length>0&&emojis.length>0){const card=selectedCards[i%selectedCards.length],emoji=pickRandom(emojis);content=card+' '+emoji;}else if(roll<0.7&&selectedCards.length>0){content=selectedCards[i%selectedCards.length];}else if(emojis.length>0){content=pickRandom(emojis);}else if(selectedCards.length>0){content=selectedCards[i%selectedCards.length];}else{content='...';}if(content)replyContents.push(content);}if(replyContents.length===0){replyContents=['💬 嗯嗯','好的～'];}for(let i=0;i<replyContents.length;i++){addMessage('other',replyContents[i]);if(i<replyContents.length-1)await sleep(randomInt(400,1200));}isReplying=!1;updateStats();}
    function sendMessage(text){if(!text||text.trim()==='')return;const content=text.trim();addMessage('self',content);chatInput.value='';chatInput.focus();if(!isReplying){if(replyTimer)clearTimeout(replyTimer);const minWait=data.settings.minWait||3,maxWait=data.settings.maxWait||8,delay=randomInt(minWait,maxWait)*1000;replyTimer=setTimeout(()=>{simulateReply();},delay);}}
