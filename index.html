<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>传讯 · 字卡聊天</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .phone { width: 400px; max-width: 100%; height: 780px; max-height: 95vh; background: #ffffff; border-radius: 36px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .status-bar { padding: 12px 20px 6px; display: flex; justify-content: space-between; font-size: 12px; color: rgba(0,0,0,0.3); flex-shrink: 0; background: transparent; z-index: 2; position: relative; }
        .status-bar .time { font-weight: 600; color: rgba(0,0,0,0.4); }
        .app-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; background: transparent; }
        .app-container .bg-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; background: #f5f7fa; transition: background 0.3s; pointer-events: none; }
        .app-container .bg-layer img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .app-container .bg-layer.has-image { background: transparent !important; }
        .app-container .bg-layer.has-image img { display: block; }
        .app-container>*:not(.bg-layer) { position: relative; z-index: 1; }
        .chat-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; flex-shrink: 0; border-bottom: 1px solid rgba(0,0,0,0.04); background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); }
        .chat-header .title { font-size: 20px; font-weight: 700; color: #1a1a2e; letter-spacing: 1px; }
        .chat-header .actions button { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(0,0,0,0.03); color: rgba(0,0,0,0.3); font-size: 18px; cursor: pointer; transition: 0.2s; }
        .chat-header .actions button:hover { background: rgba(0,0,0,0.06); color: #1a1a2e; }
        .chat-avatars { display: flex; align-items: center; justify-content: center; gap: 28px; padding: 12px 0 8px; flex-shrink: 0; background: rgba(255,255,255,0.3); backdrop-filter: blur(8px); }
        .chat-avatars .avatar-group { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; position: relative; }
        .chat-avatars .avatar-group .avatar { width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(124,58,237,0.08); object-fit: cover; background: #eef1f5; display: flex; align-items: center; justify-content: center; font-size: 28px; color: rgba(0,0,0,0.1); overflow: hidden; transition: 0.3s; }
        .chat-avatars .avatar-group .avatar:hover { border-color: #a78bfa; transform: scale(1.03); }
        .chat-avatars .avatar-group .label { font-size: 11px; color: rgba(0,0,0,0.25); font-weight: 500; }
        .chat-avatars .avatar-group .upload-hint { position: absolute; bottom: -2px; right: -4px; background: rgba(124,58,237,0.06); border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(0,0,0,0.15); border: 1px solid rgba(124,58,237,0.04); }
        .chat-avatars .avatar-group input[type="file"] { display: none; }
        .chat-avatars .vs { color: rgba(0,0,0,0.04); font-size: 14px; }
        .message-list { flex: 1; overflow-y: auto; padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; background: transparent; }
        .message-list::-webkit-scrollbar { width: 3px; }
        .message-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.06); border-radius: 10px; }
        .message { display: flex; align-items: flex-start; gap: 10px; max-width: 85%; animation: msgIn 0.25s ease-out; }
        @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .message.self { align-self: flex-end; flex-direction: row-reverse; }
        .message.other { align-self: flex-start; flex-direction: row; }
        .message .msg-avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; object-fit: cover; background: #eef1f5; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1px solid rgba(0,0,0,0.03); }
        .message .bubble-wrapper { display: flex; flex-direction: column; gap: 2px; }
        .message .bubble { padding: 10px 16px; border-radius: 18px; font-size: 16px; line-height: 1.6; word-break: break-word; background: #ffffff; color: #1a1a2e; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
        .message .bubble img { max-width: 200px; max-height: 200px; border-radius: 8px; display: block; margin: 2px 0; }
        .message.self .bubble { background: #f3e5f5; color: #1a1a2e; border-bottom-right-radius: 4px; }
        .message.other .bubble { background: #ffffff; border-bottom-left-radius: 4px; }
        .message .bubble .time-tag { font-size: 10px; color: rgba(0,0,0,0.15); margin-top: 4px; display: block; text-align: right; }
        .message.self .bubble .time-tag { color: rgba(0,0,0,0.2); }
        .message .sender-name { font-size: 11px; color: rgba(0,0,0,0.2); font-weight: 500; }
        .message.self .sender-name { text-align: right; }
        .message.other .sender-name { text-align: left; }
        .typing-indicator { align-self: flex-start; padding: 8px 16px; border-radius: 18px; background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); display: none; align-items: center; gap: 6px; font-size: 14px; color: rgba(0,0,0,0.2); box-shadow: 0 1px 4px rgba(0,0,0,0.02); }
        .typing-indicator.show { display: flex; }
        .typing-indicator .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(124,58,237,0.2); animation: dotBounce 1.2s infinite; }
        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity: 0.2; } 30% { transform: translateY(-6px); opacity: 1; } }
        .chat-input-area { display: flex; align-items: center; gap: 6px; padding: 8px 12px 12px; flex-shrink: 0; border-top: 1px solid rgba(0,0,0,0.04); background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); }
        .chat-input-area .plus-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(0,0,0,0.03); color: rgba(0,0,0,0.3); font-size: 22px; cursor: pointer; transition: 0.2s; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .chat-input-area .plus-btn:hover { background: rgba(0,0,0,0.06); color: #1a1a2e; }
        .chat-input-area input { flex: 1; padding: 8px 14px; border-radius: 24px; border: 1px solid rgba(0,0,0,0.04); background: rgba(255,255,255,0.4); color: #1a1a2e; font-size: 16px; outline: none; transition: 0.3s; }
        .chat-input-area input::placeholder { color: rgba(0,0,0,0.15); }
        .chat-input-area input:focus { border-color: rgba(124,58,237,0.15); background: #ffffff; }
        .chat-input-area .send-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: linear-gradient(135deg, #c084fc, #a78bfa); color: #fff; font-size: 16px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-shadow: 0 4px 16px rgba(124,58,237,0.08); }
        .chat-input-area .send-btn:hover { transform: scale(1.04); box-shadow: 0 6px 24px rgba(124,58,237,0.12); }
        .chat-input-area .send-btn:active { transform: scale(0.94); }
        .plus-menu { position: absolute; bottom: 70px; left: 12px; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.12); padding: 8px 0; z-index: 15; display: none; min-width: 140px; border: 1px solid rgba(0,0,0,0.04); }
        .plus-menu.show { display: block; animation: menuIn 0.2s ease-out; }
        @keyframes menuIn { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .plus-menu .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; font-size: 14px; color: rgba(0,0,0,0.6); transition: 0.2s; border: none; background: transparent; width: 100%; text-align: left; }
        .plus-menu .menu-item:hover { background: rgba(124,58,237,0.04); }
        .plus-menu .menu-item .icon { font-size: 20px; width: 28px; text-align: center; }
        .plus-menu .menu-item input[type="file"] { display: none; }
        .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.15); backdrop-filter: blur(20px); z-index: 10; display: none; flex-direction: column; border-radius: 36px; overflow: hidden; animation: fadeIn 0.25s ease-out; }
        .overlay.open { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        .overlay-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px 12px; flex-shrink: 0; border-bottom: 1px solid rgba(0,0,0,0.04); background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); }
        .overlay-header .title { font-size: 17px; font-weight: 600; color: #1a1a2e; }
        .overlay-header .close-btn { width: 34px; height: 34px; border-radius: 50%; border: none; background: rgba(0,0,0,0.02); color: rgba(0,0,0,0.25); font-size: 18px; cursor: pointer; transition: 0.2s; }
        .overlay-header .close-btn:hover { background: rgba(0,0,0,0.05); color: #1a1a2e; }
        .overlay-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); }
        .overlay-body::-webkit-scrollbar { width: 3px; }
        .overlay-body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.06); border-radius: 10px; }
        .setting-group { margin-bottom: 22px; }
        .setting-group .group-title { font-size: 12px; font-weight: 600; color: rgba(0,0,0,0.15); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.02); }
        .setting-row .label { font-size: 14px; color: rgba(0,0,0,0.5); }
        .setting-row .action-btn { padding: 4px 14px; border-radius: 16px; border: 1px solid rgba(124,58,237,0.06); background: rgba(124,58,237,0.03); color: rgba(0,0,0,0.35); font-size: 12px; cursor: pointer; transition: 0.2s; }
        .setting-row .action-btn:hover { background: rgba(124,58,237,0.06); border-color: rgba(124,58,237,0.1); color: #1a1a2e; }
        .color-picker { display: flex; gap: 10px; flex-wrap: wrap; }
        .color-picker .color-opt { width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .color-picker .color-opt:hover { transform: scale(1.08); }
        .color-picker .color-opt.active { border-color: #1a1a2e; box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #1a1a2e; }
        .bg-picker { display: flex; gap: 10px; flex-wrap: wrap; }
        .bg-picker .bg-opt { width: 44px; height: 44px; border-radius: 12px; border: 2px solid transparent; cursor: pointer; transition: 0.2s; flex-shrink: 0; background-size: cover; background-position: center; }
        .bg-picker .bg-opt:hover { transform: scale(1.05); }
        .bg-picker .bg-opt.active { border-color: #1a1a2e; box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #1a1a2e; }
        .bg-picker .bg-opt.custom-bg { background: #eef1f5; display: flex; align-items: center; justify-content: center; font-size: 18px; color: rgba(0,0,0,0.1); }
        .bg-picker .bg-opt input[type="file"] { display: none; }
        .toggle-switch { width: 40px; height: 22px; border-radius: 12px; background: rgba(0,0,0,0.04); cursor: pointer; transition: 0.3s; position: relative; flex-shrink: 0; }
        .toggle-switch.active { background: rgba(124,58,237,0.25); }
        .toggle-switch .knob { width: 18px; height: 18px; border-radius: 50%; background: #ffffff; position: absolute; top: 2px; left: 2px; transition: 0.3s; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
        .toggle-switch.active .knob { left: 20px; }
        .range-group { display: flex; align-items: center; gap: 8px; }
        .range-group input[type="range"] { width: 100px; accent-color: #a78bfa; background: transparent; }
        .range-group .val { min-width: 30px; text-align: center; color: rgba(0,0,0,0.4); font-size: 13px; }
        .letter-form textarea { width: 100%; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(0,0,0,0.04); background: rgba(255,255,255,0.4); color: rgba(0,0,0,0.6); font-size: 15px; line-height: 1.7; resize: vertical; min-height: 120px; outline: none; font-family: inherit; }
        .letter-form textarea:focus { border-color: rgba(124,58,237,0.1); }
        .letter-form .send-letter-btn { margin-top: 14px; padding: 12px 28px; border-radius: 24px; border: none; background: linear-gradient(135deg, #c084fc, #a78bfa); color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 20px rgba(124,58,237,0.08); }
        .letter-form .send-letter-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,58,237,0.12); }
        .letter-history { margin-top: 18px; }
        .letter-history .item { padding: 10px 14px; background: rgba(255,255,255,0.3); backdrop-filter: blur(8px); border-radius: 10px; margin-bottom: 8px; border-left: 2px solid rgba(124,58,237,0.06); }
        .letter-history .item .meta { display: flex; justify-content: space-between; font-size: 11px; color: rgba(0,0,0,0.15); margin-bottom: 4px; }
        .letter-history .item .content { font-size: 14px; color: rgba(0,0,0,0.5); line-height: 1.5; }

        .pat-popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); background: rgba(0,0,0,0.4); backdrop-filter: blur(16px); color: #ffffff; padding: 16px 28px; border-radius: 20px; font-size: 18px; font-weight: 500; z-index: 20; opacity: 0; pointer-events: none; text-align: center; max-width: 80%; }
        .pat-popup.show { animation: patIn 0.4s ease-out forwards; }
        @keyframes patIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } 30% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } 70% { transform: translate(-50%, -50%) scale(0.95); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        .pat-popup.hide { animation: patOut 0.4s ease-in forwards; }
        @keyframes patOut { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.1); } }
        .empty-state { text-align: center; padding: 40px 20px; color: rgba(0,0,0,0.1); font-size: 14px; }
        .empty-state .icon { font-size: 32px; margin-bottom: 10px; opacity: 0.3; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-grid .stat-card { background: rgba(255,255,255,0.3); backdrop-filter: blur(8px); border-radius: 12px; padding: 14px; text-align: center; border: 1px solid rgba(0,0,0,0.02); }
        .stat-grid .stat-card .num { font-size: 24px; font-weight: 600; color: #a78bfa; }
        .stat-grid .stat-card .lbl { font-size: 11px; color: rgba(0,0,0,0.15); margin-top: 4px; }
        .hidden { display: none !important; }
        .call-window { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); z-index: 30; padding: 24px 20px; text-align: center; transition: all 0.3s ease; display: none; border: 1px solid rgba(255,255,255,0.2); }
        .call-window.show { display: block; animation: callIn 0.4s ease-out; }
        @keyframes callIn { from { opacity: 0; transform: translate(-50%, -50%) scale(0.85) translateY(20px); } to { opacity: 1; transform: translate(-50%, -50%) scale(1) translateY(0); } }
        .call-window .call-avatar { width: 72px; height: 72px; border-radius: 50%; background: #eef1f5; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 36px; border: 2px solid rgba(124,58,237,0.08); }
        .call-window .call-name { font-size: 18px; font-weight: 600; color: #1a1a2e; }

        .call-window .call-actions .call-answer:hover { background: #16a34a; transform: scale(1.05); }
        .call-mini { position: absolute; bottom: 80px; right: 16px; width: 56px; height: 56px; border-radius: 50%; background: #22c55e; color: #fff; border: none; box-shadow: 0 4px 20px rgba(34,197,94,0.3); z-index: 25; font-size: 24px; cursor: pointer; display: none; align-items: center; justify-content: center; transition: 0.3s; }
        .call-mini.show { display: flex; animation: miniIn 0.3s ease-out; }

        .call-mini:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(34,197,94,0.4); }
        .call-mini .badge { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; background: #ef4444; border-radius: 50%; font-size: 9px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; }
        .card-lib-layout { display: flex; gap: 12px; height: 100%; min-height: 400px; }

    <script>
        // ================================================================
        //  完整 JavaScript
        // ================================================================

        const STORAGE_KEY = 'chuanxun_data_v11';
        const defaultData = {
            settings: {
                myAvatar: '😊',
                partnerAvatar: '🌟',
                bubbleColor: '#f3e5f5',
                bg: '#f5f7fa',
                bgImage: '',
                minWait: 3,
                maxWait: 8,
                minReply: 1,
                maxReply: 3,
                interval: 31,
                showTimestamp: true,
            },
            messages: [],
            wordCards: {
                '关心提醒': [],
                '情绪身体状况状态': [],
                '关于网站系统链接': [],
                '吵架哄人': [],
                '游戏': [],
                '日常': []
            },
            letters: { sent: [], received: [] },
            pats: ['拍了拍我的头', '戳了戳我的脸', '捏了捏我的脸', '揉了揉我的肚子', '拍了拍我的肩膀'],
            emojis: ['😊', '❤️', '😂', '😭', '🥺', '✨', '🔥', '💕', '🎉', '🤔', '😘', '💪'],
            letterTimers: {},
            selectedGroup: null,
        };

        let data = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const merged = deepMerge(defaultData, parsed);
                    const defaultGroups = Object.keys(defaultData.wordCards);
                    for (const g of defaultGroups) {
                        if (!merged.wordCards[g]) merged.wordCards[g] = [];
                    }
                    return merged;
                }
            } catch (e) {}
            return JSON.parse(JSON.stringify(defaultData));
        }

        function deepMerge(target, source) {
            const result = { ...target };
            for (const key in source) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                    result[key] = deepMerge(target[key] || {}, source[key]);
                } else {
                    result[key] = source[key];
                }
            }
            return result;
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);

        const messageList = $('#messageList');
        const chatInput = $('#chatInput');
        const sendBtn = $('#sendBtn');
        const emptyState = $('#emptyState');
        const typingIndicator = $('#typingIndicator');
        const plusBtn = $('#plusBtn');

        const closeCardLib = $('#closeCardLib');
        const cardLibContent = $('#cardLibContent');

        const sendLetterBtn = $('#sendLetterBtn');
        const letterList = $('#letterList');

        const closeStats = $('#closeStats');

        const gotoStatsBtn = $('#gotoStatsBtn');

        const bgPicker = $('#bgPicker');

        const maxWaitRange = $('#maxWaitRange');
        const minReplyRange = $('#minReplyRange');
        const maxReplyRange = $('#maxReplyRange');

        const maxWaitVal = $('#maxWaitVal');

        const callWindow = $('#callWindow');
        const callName = $('#callName');
        const callStatus = $('#callStatus');
        const callAvatar = $('#callAvatar');
        const callEndBtn = $('#callEndBtn');
        const callAnswerBtn = $('#callAnswerBtn');

        let currentBubbleColor = data.settings.bubbleColor || '#f3e5f5';
        let isReplying = false;
        let replyTimer = null;
        let autoSendTimer = null;
        let isCallActive = false;
        let callTimer = null;
        let callAnswered = false;

        // ===== 电话功能（随机时长 10分钟 ~ 7天） =====
        function showCallWindow(name, status, avatar, isIncoming) {
            callName.textContent = name || '鱼鱼';
            callStatus.textContent = status || '正在呼叫...';
            callAvatar.textContent = avatar || '📞';
            callWindow.classList.add('show');
            isCallActive = true;
            callAnswered = false;
            if (isIncoming) {
                callAnswerBtn.style.display = 'flex';
                callEndBtn.textContent = '拒接';
            } else {
                callAnswerBtn.style.display = 'none';
                callEndBtn.textContent = '挂断';
            }
        }

        function hideCallWindow() {
            callWindow.classList.remove('show');
            isCallActive = false;
            callAnswered = false;
            if (callTimer) {
                clearTimeout(callTimer);
                callTimer = null;
            }
            callAnswerBtn.style.display = 'flex';
            callEndBtn.textContent = '✕';
        }

        function makeCall(name) {
            showCallWindow(name || '鱼鱼', '📞 正在呼叫...', '📞', false);
            let ringCount = 0;
            const ringInterval = setInterval(() => {
                ringCount++;
                if (ringCount > 8) {
                    clearInterval(ringInterval);
                    if (isCallActive && !callAnswered) {
                        callStatus.textContent = '⏰ 对方未接听';
                        setTimeout(() => {
                            if (isCallActive) hideCallWindow();
                        }, 1500);
                    }
                    return;
                }
                if (isCallActive && !callAnswered) {
                    callStatus.textContent = ringCount % 2 === 0 ? '📞 正在呼叫...' : '🔔 振铃中...';
                }

        // ===== 工具函数 =====
        function formatTime(ts) {
            const d = new Date(ts);
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }

        function formatDate(ts) {
            const d = new Date(ts);
            return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2,
                '0') + ' ' + formatTime(ts);
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function pickRandom(arr) {
            if (!arr || arr.length === 0) return null;
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function getAllCards() {
            const groups = data.wordCards;
            const all = [];
            for (const key in groups) {
                if (Array.isArray(groups[key])) {
                    all.push(...groups[key]);
                }
            }
            return all;
        }

        function getGroupNames() {
            return Object.keys(data.wordCards);
        }

        // ===== 拍一拍 =====
        function showPat(content) {
            patPopup.textContent = '🫳 ' + content;
            patPopup.classList.remove('hide', 'show');
            void patPopup.offsetWidth;
            patPopup.classList.add('show');
            setTimeout(() => {
                patPopup.classList.remove('show');
                patPopup.classList.add('hide');
                setTimeout(() => patPopup.classList.remove('hide'), 400);
            }, 1200);

        // ===== 消息渲染 =====
        function renderMessages() {
            const msgs = data.messages;
            messageList.innerHTML = '';
            if (msgs.length === 0) {
                messageList.appendChild(emptyState);
                return;
            }
            const myAvatarUrl = data.settings.myAvatar;
            const partnerAvatarUrl = data.settings.partnerAvatar;
            msgs.forEach((msg) => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender === 'self' ? 'self' : 'other'}`;
                const avatarContent = msg.sender === 'self' ? myAvatarUrl : partnerAvatarUrl;
                const avatarHtml =
                    `<div class="msg-avatar" style="background-image:url('${avatarContent}'); background-size:cover; background-position:center; font-size:0;">${avatarContent.startsWith('data:') || avatarContent.startsWith('http') ? '' : avatarContent}</div>`;
                const timeHtml = data.settings.showTimestamp ? `<span class="time-tag">${formatTime(msg.timestamp)}</span>` :
                    '';
                const nameLabel = msg.sender === 'self' ? '我' : '鱼鱼';
                let bubbleContent = msg.content;
                if (typeof msg.content === 'string' && (msg.content.startsWith('data:image/') || (msg.content.startsWith(
                        'http') && msg.content.match(/\.(jpg|jpeg|png|gif|webp)/i)))) {
                    bubbleContent = `<img src="${msg.content}" alt="图片" />`;
                }
                const bubbleColor = msg.sender === 'self' ? currentBubbleColor : '#ffffff';
                div.innerHTML = `
                    ${msg.sender === 'other' ? avatarHtml : ''}
                    <div class="bubble-wrapper">
                        <div class="sender-name">${nameLabel}</div>
                        <div class="bubble" style="background:${bubbleColor}">
                            ${bubbleContent}
                            ${timeHtml}
                        </div>
                    </div>
                    ${msg.sender === 'self' ? avatarHtml : ''}
                `;
                messageList.appendChild(div);
            });
            messageList.scrollTop = messageList.scrollHeight;
        }

        function addMessage(sender, content, timestamp) {
            const ts = timestamp || Date.now();
            data.messages.push({ sender, content, timestamp: ts });
            saveData();
            renderMessages();
            updateStats();
            return ts;
        }

        function sendImage(dataUrl) {
            addMessage('self', dataUrl);
            if (!isReplying) {
                if (replyTimer) clearTimeout(replyTimer);
                const minWait = data.settings.minWait || 3;
                const maxWait = data.settings.maxWait || 8;
                const delay = randomInt(minWait, maxWait) * 1000;
                replyTimer = setTimeout(() => { simulateReply(); }, delay);
            }
        }

        async function simulateReply() {
            if (isReplying) return;
            isReplying = true;
            const minWait = data.settings.minWait || 3;
            const maxWait = data.settings.maxWait || 8;
            const minReply = data.settings.minReply || 1;
            const maxReply = data.settings.maxReply || 3;
            const waitTime = randomInt(minWait, maxWait) * 1000;
            typingIndicator.classList.add('show');
            await sleep(waitTime);
            typingIndicator.classList.remove('show');

            const allCards = getAllCards();
            const emojis = data.emojis || [];
            if (allCards.length === 0 && emojis.length === 0) { isReplying = false; return; }

            const count = randomInt(minReply, maxReply);
            let replyContents = [];

            const shuffledCards = [...allCards].sort(() => Math.random() - 0.5);
            const cardCount = Math.min(count, allCards.length);
            const selectedCards = shuffledCards.slice(0, cardCount);

            for (let i = 0; i < count; i++) {
                let content = '';
                const roll = Math.random();
                if (roll < 0.4 && selectedCards.length > 0 && emojis.length > 0) {
                    const card = selectedCards[i % selectedCards.length];
                    const emoji = pickRandom(emojis);
                    content = card + ' ' + emoji;
                } else if (roll < 0.7 && selectedCards.length > 0) {
                    const card = selectedCards[i % selectedCards.length];
                    content = card;
                } else if (emojis.length > 0) {
                    const emoji = pickRandom(emojis);
                    content = emoji;
                } else if (selectedCards.length > 0) {
                    const card = selectedCards[i % selectedCards.length];
                    content = card;
                } else {
                    content = '...';
                }
                if (content) replyContents.push(content);
            }

            if (replyContents.length === 0) {
                replyContents = ['💬 嗯嗯', '好的～'];
            }

            for (let i = 0; i < replyContents.length; i++) {
                addMessage('other', replyContents[i]);
                if (i < replyContents.length - 1) await sleep(randomInt(400, 1200));
            }
            isReplying = false;
            updateStats();
        }

        function sendMessage(text) {
            if (!text || text.trim() === '') return;
            const content = text.trim();
            addMessage('self', content);
            chatInput.value = '';
            chatInput.focus();
            if (!isReplying) {
                if (replyTimer) clearTimeout(replyTimer);
                const minWait = data.settings.minWait || 3;
                const maxWait = data.settings.maxWait || 8;
                const delay = randomInt(minWait, maxWait) * 1000;
                replyTimer = setTimeout(() => { simulateReply(); }, delay);
            }
        }

        function updateStats() {
            const total = data.messages.length;
            const sent = data.messages.filter(m => m.sender === 'self').length;
            const received = data.messages.filter(m => m.sender === 'other').length;
            const letters = data.letters.sent.length + data.letters.received.length;
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statSent').textContent = sent;
            document.getElementById('statReceived').textContent = received;
            document.getElementById('statLetters').textContent = letters;
        }

        // ===== 字卡库 =====
        function renderCardLib() {
            const groups = data.wordCards;
            const groupNames = Object.keys(groups);
            let selected = data.selectedGroup;
            if (!selected && groupNames.length > 0) {
                selected = groupNames[0];
                data.selectedGroup = selected;
            }
            if (selected && !groups[selected]) {
                selected = groupNames.length > 0 ? groupNames[0] : null;
                data.selectedGroup = selected;
            }

            let html = `<div class="card-lib-layout">`;

            html += `<div class="card-lib-left">`;
            html += `<div class="lib-title">📂 分组</div>`;
            if (groupNames.length === 0) {
                html += `<div style="color:rgba(0,0,0,0.1); font-size:12px; padding:8px 0; text-align:center;">暂无分组<br/>👇 在下方创建</div>`;
            } else {
                groupNames.forEach(name => {
                    const active = (name === selected) ? 'active' : '';
                    const count = groups[name] ? groups[name].length : 0;
                    html +=
                        `<div class="group-item ${active}" data-group="${name}"><span>${name}</span><span class="count">${count}条</span><span class="del-group" data-group="${name}">✕</span></div>`;
                });

                    <input type="text" id="newGroupInput" placeholder="新分组…" />
                    <button id="addGroupBtn">+</button>
                </div>
            </div>`;

            html += `<div class="card-lib-right">`;
            if (selected && groups[selected]) {
                const cards = groups[selected] || [];
                html += `
                    <div class="right-header">
                        <span class="group-name">${selected}</span>
                        <span class="card-count">共 ${cards.length} 条</span>
                    </div>
                    <div class="card-list">
                        ${cards.map((c, idx) => `
                            <span class="card-tag">

                            </span>

                html += `

                            <input type="text" id="newCardInput" placeholder="添加字卡…" />
                            <select id="addCardGroupSelect">${groupOptions}</select>
                            <button id="addCardBtn">+ 添加</button>

                            <textarea id="batchCardInput" placeholder="批量添加，每行一条…"></textarea>
                            <div class="batch-row">
                                <select id="batchGroupSelect">${groupOptions}</select>
                                <button id="batchAddBtn">📥 批量添加</button>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                html += `<div class="empty-tip">👈 请选择一个分组，或创建一个新分组</div>`;
            }
            html += `</div></div>`;

            html += `
                <div class="card-lib-footer">
                    <button id="exportCardsBtn">📤 导出字卡</button>
                    <button id="importCardsBtn">📥 导入字卡</button>
                    <input type="file" id="importCardsInput" accept=".json" />
                </div>
                <div class="import-options">
                    <label><input type="radio" name="importMode" value="append" checked /> 追加</label>
                    <label><input type="radio" name="importMode" value="overwrite" /> 覆盖</label>
                </div>
            `;

            cardLibContent.innerHTML = html;

            cardLibContent.querySelectorAll('.group-item').forEach(el => {
                el.addEventListener('click', function(e) {
                    if (e.target.closest('.del-group')) return;
                    const group = this.dataset.group;
                    data.selectedGroup = group;
                    saveData();
                    renderCardLib();
                });
            });
            cardLibContent.querySelectorAll('.del-group').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const group = this.dataset.group;
                    if (confirm(`确定删除分组「${group}」及其所有字卡吗？`)) {
                        delete data.wordCards[group];
                        if (data.selectedGroup === group) data.selectedGroup = null;
                        saveData();
                        renderCardLib();
                    }
                });
            });
            cardLibContent.querySelectorAll('.card-list .del').forEach(el => {
                el.addEventListener('click', function() {
                    const group = this.dataset.group;
                    const idx = parseInt(this.dataset.index);
                    if (data.wordCards[group]) {
                        data.wordCards[group].splice(idx, 1);
                        saveData();
                        renderCardLib();
                    }
                });
            });

            const addCardBtn = document.getElementById('addCardBtn');
            const newCardInput = document.getElementById('newCardInput');
            const addCardGroupSelect = document.getElementById('addCardGroupSelect');
            if (addCardBtn && newCardInput && addCardGroupSelect) {
                addCardBtn.addEventListener('click', function() {
                    const val = newCardInput.value.trim();
                    if (!val) return;
                    const group = addCardGroupSelect.value;
                    if (!data.wordCards[group]) data.wordCards[group] = [];
                    data.wordCards[group].push(val);
                    data.selectedGroup = group;
                    saveData();
                    renderCardLib();
                });
                newCardInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') addCardBtn.click();
                });
            }

            const batchBtn = document.getElementById('batchAddBtn');
            const batchInput = document.getElementById('batchCardInput');
            const batchGroupSelect = document.getElementById('batchGroupSelect');
            if (batchBtn && batchInput && batchGroupSelect) {
                batchBtn.addEventListener('click', function() {
                    const lines = batchInput.value.split('\n').map(s => s.trim()).filter(s => s);
                    if (lines.length === 0) return;
                    const group = batchGroupSelect.value;
                    if (!data.wordCards[group]) data.wordCards[group] = [];
                    data.wordCards[group].push(...lines);
                    data.selectedGroup = group;
                    saveData();
                    renderCardLib();
                });
            }

            const addGroupBtn = document.getElementById('addGroupBtn');
            const newGroupInput = document.getElementById('newGroupInput');
            if (addGroupBtn && newGroupInput) {
                addGroupBtn.addEventListener('click', function() {
                    const name = newGroupInput.value.trim();
                    if (!name) return;
                    if (data.wordCards[name]) { alert('分组已存在'); return; }
                    data.wordCards[name] = [];
                    data.selectedGroup = name;
                    saveData();
                    renderCardLib();
                });
                newGroupInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') addGroupBtn.click();
                });
            }

            document.getElementById('exportCardsBtn')?.addEventListener('click', function() {
                const json = JSON.stringify(data.wordCards, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `字卡库_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
            });

            const importBtn = document.getElementById('importCardsBtn');
            const importInput = document.getElementById('importCardsInput');
            if (importBtn && importInput) {
                importBtn.addEventListener('click', function() { importInput.click(); });
                importInput.addEventListener('change', function(e) {
                    const file = this.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const imported = JSON.parse(ev.target.result);
                            if (typeof imported === 'object' && !Array.isArray(imported)) {
                                const mode = document.querySelector('input[name="importMode"]:checked')
                                    ?.value || 'append';
                                if (mode === 'overwrite') {
                                    data.wordCards = {};
                                }
                                for (const key in imported) {
                                    if (Array.isArray(imported[key])) {
                                        if (!data.wordCards[key]) data.wordCards[key] = [];
                                        data.wordCards[key] = [...new Set([...data.wordCards[key], ...
                                            imported[key]
                                        ])];
                                    }
                                }
                                if (!data.selectedGroup) {
                                    const keys = Object.keys(data.wordCards);
                                    if (keys.length > 0) data.selectedGroup = keys[0];
                                }
                                saveData();
                                renderCardLib();
                                alert('导入成功！');
                            } else {
                                alert('格式错误：请导入有效的字卡库 JSON');
                            }
                        } catch (err) { alert('解析失败：' + err.message); }
                    };
                    reader.readAsText(file);
                    this.value = '';
                });
            }
        }

        // ===== 信件 =====
        function renderLetters() {
            const sent = data.letters.sent || [];
            const received = data.letters.received || [];
            let html = '';
            const all = [];
            sent.forEach(l => all.push({ ...l, type: 'sent' }));
            received.forEach(l => all.push({ ...l, type: 'received' }));
            all.sort((a, b) => b.timestamp - a.timestamp);
            if (all.length === 0) {
                html = '<div class="empty-state"><div class="icon">💌</div><div>还没有信件</div></div>';
            } else {
                all.forEach(l => {
                    const label = l.type === 'sent' ? '📤 寄出' : '📥 收到';
                    const time = formatDate(l.timestamp);
                    html += `
                        <div class="letter-item">
                            <div class="top"><span>${label}</span><span class="badge">${time}</span></div>
                            <div class="content">${l.content || '(空)'}</div>
                            ${l.type === 'sent' && l.replied ? '<div class="reply-status">✅ 已收到回信</div>' : ''}
                            ${l.type === 'sent' && !l.replied ? '<div class="reply-status">⏳ 等待回信…</div>' : ''}
                        </div>
                    `;
                });
            }
            letterList.innerHTML = html;
        }

        function sendLetter() {
            const content = letterInput.value.trim();
            if (!content) return;
            const sentItem = { content, timestamp: Date.now(), replied: false };
            data.letters.sent.push(sentItem);
            saveData();
            const delay = randomInt(6, 12) * 60 * 60 * 1000;
            const timerId = setTimeout(() => {
                const allCards = getAllCards();
                let replyContent = '（对方没有回复）';
                if (allCards.length > 0) replyContent = pickRandom(allCards);
                const receivedItem = { content: replyContent, timestamp: Date.now() };
                data.letters.received.push(receivedItem);
                const sentIdx = data.letters.sent.findIndex(s => s.timestamp === sentItem.timestamp);
                if (sentIdx !== -1) data.letters.sent[sentIdx].replied = true;
                saveData();
                renderLetters();
                addMessage('other', '📬 你有一封新回信，请到信封页面查看');
            }, delay);
            data.letterTimers[sentItem.timestamp] = timerId;
            letterInput.value = '';
            renderLetters();
            addMessage('self', '📮 信件已寄出，将在6-12小时后收到回信');
            updateStats();
            alert('💌 信件已寄出！对方将在6-12小时后回信。');
        }

                inputEl.click();

                    avatarEl.style.backgroundImage = `url(${dataUrl})`;
                    avatarEl.style.backgroundSize = 'cover';
                    avatarEl.style.backgroundPosition = 'center';
                    avatarEl.textContent = '';
                    avatarEl.style.fontSize = '0';
                    data.settings[storageKey] = dataUrl;
                    saveData();
                    renderMessages();
                };
                reader.readAsDataURL(file);
                this.value = '';
            });
            if (data.settings[storageKey] && (data.settings[storageKey].startsWith('data:') || data.settings[storageKey]
                    .startsWith('http'))) {
                avatarEl.style.backgroundImage = `url(${data.settings[storageKey]})`;
                avatarEl.style.backgroundSize = 'cover';
                avatarEl.style.backgroundPosition = 'center';
                avatarEl.textContent = '';
                avatarEl.style.fontSize = '0';
            } else if (data.settings[storageKey]) {
                avatarEl.textContent = data.settings[storageKey];
                avatarEl.style.fontSize = '28px';
                avatarEl.style.backgroundImage = 'none';
            }
        }

        function applyBg(bg, bgImage) {

            renderEmojis();
        }

        function toggleEmojiPanel() {
            if (!emojiPanel) createEmojiPanel();
            emojiPanelOpen = !emojiPanelOpen;
            emojiPanel.style.display = emojiPanelOpen ? 'flex' : 'none';
        }

        function renderEmojis() {
            if (!emojiPanel) return;
            emojiPanel.innerHTML = '';
            data.emojis.forEach((emoji, idx) => {
                const item = document.createElement('div');
                item.className = 'emoji-item';
                item.style.cssText =
                    'width:44px;height:44px;border-radius:8px;border:1px solid rgba(0,0,0,0.04);background:#ffffff;cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;position:relative;transition:0.2s;';
                if (emoji.startsWith('http') || emoji.startsWith('data:image')) {
                    item.innerHTML =
                        `<img src="${emoji}" alt="表情" style="width:36px;height:36px;object-fit:contain;" /><span class="del-emoji" data-idx="${idx}" style="position:absolute;top:-4px;right:-4px;font-size:10px;color:rgba(0,0,0,0.12);background:#fff;border-radius:50%;width:16px;height:16px;display:none;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,0.03);cursor:pointer;">✕</span>`;
                } else {
                    item.textContent = emoji;
                    const del = document.createElement('span');
                    del.className = 'del-emoji';
                    del.dataset.idx = idx;
                    del.textContent = '✕';
                    del.style.cssText =
                        'position:absolute;top:-4px;right:-4px;font-size:10px;color:rgba(0,0,0,0.12);background:#fff;border-radius:50%;width:16px;height:16px;display:none;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,0.03);cursor:pointer;';
                    item.appendChild(del);
                }
                item.addEventListener('mouseenter', function() {
                    const del = this.querySelector('.del-emoji');
                    if (del) del.style.display = 'flex';
                });
                item.addEventListener('mouseleave', function() {
                    const del = this.querySelector('.del-emoji');
                    if (del) del.style.display = 'none';
                });
                item.addEventListener('click', function(e) {
                    if (e.target.closest('.del-emoji')) return;
                    const emojiContent = emoji;
                    chatInput.value += ' ' + emojiContent + ' ';
                    chatInput.focus();
                });
                item.querySelector('.del-emoji')?.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.idx);
                    data.emojis.splice(idx, 1);
                    saveData();
                    renderEmojis();
                    renderEmojiManage();
                });
                emojiPanel.appendChild(item);
            });
            if (data.emojis.length === 0) {
                emojiPanel.innerHTML =
                    '<div style="color:rgba(0,0,0,0.1); font-size:13px; padding:8px 0;">还没有表情包，去设置里添加吧</div>';
            }
        }

        function renderEmojiManage() {
            const list = document.getElementById('emojiManageList');
            if (!list) return;
            list.innerHTML = '';
            data.emojis.forEach((emoji, idx) => {
                const tag = document.createElement('span');
                tag.className = 'card-tag';
                tag.style.cssText =
                    'padding:4px 12px;border-radius:16px;background:rgba(124,58,237,0.04);border:1px solid rgba(124,58,237,0.03);font-size:13px;color:rgba(0,0,0,0.5);display:flex;align-items:center;gap:6px;';
                if (emoji.startsWith('http') || emoji.startsWith('data:image')) {
                    tag.innerHTML =
                        `<img src="${emoji}" style="width:24px;height:24px;object-fit:contain;" /><span class="del" data-idx="${idx}" style="cursor:pointer;color:rgba(0,0,0,0.12);font-size:12px;">✕</span>`;
                } else {
                    tag.textContent = emoji;
                    const del = document.createElement('span');
                    del.className = 'del';
                    del.dataset.idx = idx;
                    del.textContent = '✕';
                    del.style.cssText = 'cursor:pointer;color:rgba(0,0,0,0.12);font-size:12px;';
                    tag.appendChild(del);
                }
                tag.querySelector('.del')?.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    data.emojis.splice(idx, 1);
                    saveData();
                    renderEmojis();
                    renderEmojiManage();
                });
                list.appendChild(tag);
            });
            if (data.emojis.length === 0) {
                list.innerHTML = '<span style="color:rgba(0,0,0,0.1); font-size:13px;">还没有表情包</span>';
            }
        }

        function renderPatManage() {
            const list = document.getElementById('patContentList');
            if (!list) return;
            list.innerHTML = '';
            data.pats.forEach((pat, idx) => {
                const tag = document.createElement('span');
                tag.className = 'card-tag';
                tag.style.cssText =
                    'padding:4px 12px;border-radius:16px;background:rgba(124,58,237,0.04);border:1px solid rgba(124,58,237,0.03);font-size:13px;color:rgba(0,0,0,0.5);display:flex;align-items:center;gap:6px;';
                tag.textContent = pat;
                const del = document.createElement('span');
                del.className = 'del';
                del.textContent = '✕';
                del.style.cssText = 'cursor:pointer;color:rgba(0,0,0,0.12);font-size:12px;';
                del.addEventListener('click', function() {
                    data.pats.splice(idx, 1);
                    saveData();
                    renderPatManage();
                });
                tag.appendChild(del);
                list.appendChild(tag);
            });
            if (data.pats.length === 0) {
                list.innerHTML = '<span style="color:rgba(0,0,0,0.1); font-size:13px;">还没有拍一拍内容</span>';
            }
        }

        function openOverlay(overlay) {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
            overlay.classList.add('open');
        }

        function closeAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
        }

        function resetAutoSend() {
            if (autoSendTimer) { clearInterval(autoSendTimer);
                autoSendTimer = null; }
            const interval = data.settings.interval || 31;
            if (interval > 0) {
                autoSendTimer = setInterval(() => {
                    const allCards = getAllCards();
                    const emojis = data.emojis || [];
                    if ((allCards.length > 0 || emojis.length > 0) && !isReplying) {
                        let content = '';
                        if (allCards.length > 0 && Math.random() < 0.6) {
                            content = pickRandom(allCards);
                            if (emojis.length > 0 && Math.random() < 0.3) {
                                content += ' ' + pickRandom(emojis);
                            }
                        } else if (emojis.length > 0) {
                            content = pickRandom(emojis);
                        } else {
                            content = '💬 嗨～';
                        }
                        addMessage('other', '💬 ' + content);
                        updateStats();
                    }
                }, interval * 60 * 1000);
            }
        }

        function init() {
            function updateTime() {
                const d = new Date();
                statusTime.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2,
                    '0');
            }
            updateTime();
            setInterval(updateTime, 30000);

            setupAvatar(myAvatar, myAvatarInput, 'myAvatar');
            setupAvatar(partnerAvatar, partnerAvatarInput, 'partnerAvatar');

            currentBubbleColor = data.settings.bubbleColor || '#f3e5f5';
            applyBg(data.settings.bg, data.settings.bgImage);
            renderMessages();
            updateStats();
            createEmojiPanel();
            renderEmojis();
            renderPatManage();
            renderEmojiManage();

            minWaitRange.value = data.settings.minWait || 3;
            maxWaitRange.value = data.settings.maxWait || 8;
            minReplyRange.value = data.settings.minReply || 1;
            maxReplyRange.value = data.settings.maxReply || 3;
            intervalRange.value = data.settings.interval || 31;
            minWaitVal.textContent = data.settings.minWait + '秒';
            maxWaitVal.textContent = data.settings.maxWait + '秒';
            minReplyVal.textContent = data.settings.minReply + '条';
            maxReplyVal.textContent = data.settings.maxReply + '条';
            intervalVal.textContent = data.settings.interval + '分钟';
            toggleTimestamp.classList.toggle('active', data.settings.showTimestamp !== false);

            bubbleColorPicker.querySelectorAll('.color-opt').forEach(el => {
                el.classList.toggle('active', el.dataset.color === currentBubbleColor);
            });

            bgPicker.querySelectorAll('.bg-opt').forEach(el => {
                const isActive = (el.dataset.bg === data.settings.bg) ||
                    (data.settings.bgImage && el.classList.contains('custom-bg'));
                el.classList.toggle('active', isActive);
            });

            // 左下角菜单
            plusBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                plusMenu.classList.toggle('show');
            });
            document.addEventListener('click', function() {
                plusMenu.classList.remove('show');
            });

            menuCall.addEventListener('click', function(e) {
                e.stopPropagation();
                plusMenu.classList.remove('show');
                makeCall('鱼鱼');
            });

            menuEmoji.addEventListener('click', function(e) {
                e.stopPropagation();
                plusMenu.classList.remove('show');
                toggleEmojiPanel();
            });

            menuImage.addEventListener('click', function(e) {
                e.stopPropagation();
                plusMenu.classList.remove('show');
                imageInput.click();
            });

            imageInput.addEventListener('change', function(e) {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const dataUrl = ev.target.result;
                    sendImage(dataUrl);
                };
                reader.readAsDataURL(file);
                this.value = '';
            });

            // 来电随机（25%概率，每2分钟检查一次）
            setInterval(() => {
                if (!isCallActive && Math.random() < 0.25) {
                    incomingCall();
                }
            }, 120000);

            // 其他事件
            sendBtn.addEventListener('click', function() { sendMessage(chatInput.value); });
            chatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage(this.value);
                }
            });

            settingsBtn.addEventListener('click', function() { openOverlay(settingsOverlay); });
            closeSettings.addEventListener('click', closeAllOverlays);

            gotoCardLibBtn.addEventListener('click', function() { closeAllOverlays();
                renderCardLib();
                openOverlay(cardLibOverlay); });
            closeCardLib.addEventListener('click', closeAllOverlays);

            envelopeBtn.addEventListener('click', function() { closeAllOverlays();
                renderLetters();
                openOverlay(letterOverlay); });
            gotoLetterBtn.addEventListener('click', function() { closeAllOverlays();
                renderLetters();
                openOverlay(letterOverlay); });
            closeLetter.addEventListener('click', closeAllOverlays);
            sendLetterBtn.addEventListener('click', sendLetter);
            letterInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
                    sendLetter(); }
            });

            gotoStatsBtn.addEventListener('click', function() { closeAllOverlays();
                updateStats();
                openOverlay(statsOverlay); });
            closeStats.addEventListener('click', closeAllOverlays);
            document.getElementById('clearChatBtn')?.addEventListener('click', function() {
                if (confirm('清空所有聊天记录？')) { data.messages = [];
                    saveData();
                    renderMessages();
                    updateStats();
                    closeAllOverlays(); }
            });

            bubbleColorPicker.addEventListener('click', function(e) {
                const opt = e.target.closest('.color-opt');
                if (!opt) return;
                const color = opt.dataset.color;
                if (!color) return;
                currentBubbleColor = color;
                data.settings.bubbleColor = color;
                saveData();
                bubbleColorPicker.querySelectorAll('.color-opt').forEach(el => el.classList.remove('active'));
                opt.classList.add('active');
                renderMessages();
            });

            bgPicker.addEventListener('click', function(e) {
                const opt = e.target.closest('.bg-opt');
                if (!opt) return;
                if (opt.classList.contains('custom-bg')) {
                    document.getElementById('customBgInput')?.click();
                    return;
                }
                const bg = opt.dataset.bg;
                if (!bg) return;
                data.settings.bg = bg;
                data.settings.bgImage = '';
                saveData();
                applyBg(bg, '');
                bgPicker.querySelectorAll('.bg-opt').forEach(el => el.classList.remove('active'));
                opt.classList.add('active');
            });
            document.getElementById('customBgInput')?.addEventListener('change', function(e) {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const dataUrl = ev.target.result;
                    data.settings.bgImage = dataUrl;
                    data.settings.bg = '';
                    saveData();
                    applyBg('', dataUrl);
                    bgPicker.querySelectorAll('.bg-opt').forEach(el => el.classList.remove('active'));
                    document.querySelector('.bg-opt.custom-bg')?.classList.add('active');
                };
                reader.readAsDataURL(file);
                this.value = '';
            });

            minWaitRange.addEventListener('input', function() { const v = parseInt(this.value);
                minWaitVal.textContent = v + '秒';
                data.settings.minWait = v;
                saveData(); });
            maxWaitRange.addEventListener('input', function() { const v = parseInt(this.value);
                maxWaitVal.textContent = v + '秒';
                data.settings.maxWait = v;
                saveData(); });
            minReplyRange.addEventListener('input', function() { const v = parseInt(this.value);
                minReplyVal.textContent = v + '条';
                data.settings.minReply = v;
                saveData(); });
            maxReplyRange.addEventListener('input', function() { const v = parseInt(this.value);
                maxReplyVal.textContent = v + '条';
                data.settings.maxReply = v;
                saveData(); });
            intervalRange.addEventListener('input', function() { const v = parseInt(this.value);
                intervalVal.textContent = v + '分钟';
                data.settings.interval = v;
                saveData();
                resetAutoSend(); });

            toggleTimestamp.addEventListener('click', function() {
                this.classList.toggle('active');
                data.settings.showTimestamp = this.classList.contains('active');
                saveData();
                renderMessages();
            });

            document.getElementById('changeMyAvatarBtn')?.addEventListener('click', function() { myAvatarInput
                .click(); });
            document.getElementById('changePartnerAvatarBtn')?.addEventListener('click', function() {
                partnerAvatarInput.click(); });

            document.getElementById('addPatBtn')?.addEventListener('click', function() {
                const input = document.getElementById('patInput');
                const val = input.value.trim();
                if (!val) return;
                data.pats.push(val);
                saveData();
                renderPatManage();
                input.value = '';
            });
            document.getElementById('patInput')?.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('addPatBtn')?.click();
            });

            document.getElementById('addEmojiBtn')?.addEventListener('click', function() {
                const input = document.getElementById('emojiInput');
                const val = input.value.trim();
                if (!val) return;
                data.emojis.push(val);
                saveData();
                renderEmojis();
                renderEmojiManage();
                input.value = '';
            });
            document.getElementById('emojiInput')?.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') document.getElementById('addEmojiBtn')?.click();
            });

            document.querySelectorAll('.chat-avatars .avatar').forEach(el => {
                el.addEventListener('dblclick', function() {
                    if (data.pats.length > 0) {
                        const pat = pickRandom(data.pats);
                        showPat(pat);
                    }
                });
            });

            document.querySelectorAll('.overlay').forEach(overlay => {
                overlay.addEventListener('click', function(e) {
                    if (e.target === this) this.classList.remove('open');
                });
            });

            document.getElementById('importEmojiBtn')?.addEventListener('click', function() {
                document.getElementById('importEmojiInput')?.click();
            });
            document.getElementById('importEmojiInput')?.addEventListener('change', function(e) {
                const files = this.files;
                if (!files || files.length === 0) return;
                for (const file of files) {
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        const dataUrl = ev.target.result;
                        data.emojis.push(dataUrl);
                        saveData();
                        renderEmojis();
                        renderEmojiManage();
                    };
                    reader.readAsDataURL(file);
                }
                this.value = '';
                alert('✅ 表情包导入成功！');
            });

            resetAutoSend();
            console.log('📡 传讯已启动！');
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
