<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>传讯 · 字卡聊天</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #e8ecf1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .phone {
            width: 400px;
            max-width: 100%;
            height: 780px;
            max-height: 95vh;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .status-bar {
            padding: 12px 20px 6px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            background: transparent;
            position: relative;
            z-index: 2;
        }
        .status-bar .time {
            font-weight: 600;
            color: rgba(0, 0, 0, 0.5);
        }
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            background: transparent;
        }
        .app-container .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: #f7f8fa;
            transition: background 0.3s;
            pointer-events: none;
        }
        .app-container .bg-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .app-container .bg-layer.has-image {
            background: transparent !important;
        }
        .app-container .bg-layer.has-image img {
            display: block;
        }
        .app-container>*:not(.bg-layer) {
            position: relative;
            z-index: 1;
        }
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px 12px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
        .chat-header .title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: 1px;
        }
        .chat-header .actions button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.04);
            color: rgba(0, 0, 0, 0.5);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-header .actions button:hover {
            background: rgba(0, 0, 0, 0.08);
            color: #1a1a2e;
        }
        .chat-avatars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 12px 0 8px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(8px);
        }
        .chat-avatars .avatar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            position: relative;
        }
        .chat-avatars .avatar-group .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 2px solid rgba(124, 58, 237, 0.15);
            object-fit: cover;
            background: #e8ecf1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: 0.3s;
        }
        .chat-avatars .avatar-group .avatar:hover {
            border-color: #7c3aed;
            transform: scale(1.03);
        }
        .chat-avatars .avatar-group .label {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.35);
            font-weight: 500;
        }
        .chat-avatars .avatar-group .upload-hint {
            position: absolute;
            bottom: -2px;
            right: -4px;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(124, 58, 237, 0.1);
        }
        .chat-avatars .avatar-group input[type="file"] {
            display: none;
        }
        .chat-avatars .vs {
            color: rgba(0, 0, 0, 0.06);
            font-size: 14px;
        }
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
            background: transparent;
        }
        .message-list::-webkit-scrollbar {
            width: 3px;
        }
        .message-list::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 85%;
            animation: msgIn 0.25s ease-out;
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message.self {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message.other {
            align-self: flex-start;
        }
        .message .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
            background: #e8ecf1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .message .bubble-wrapper {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .message .bubble {
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.6;
            word-break: break-word;
            background: #ffffff;
            color: #1a1a2e;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .message .bubble img {
            max-width: 150px;
            max-height: 150px;
            border-radius: 8px;
            display: block;
            margin: 4px 0;
        }
        .message.self .bubble {
            background: #7c3aed;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .message.other .bubble {
            background: #ffffff;
            border-bottom-left-radius: 4px;
        }
        .message .bubble .time-tag {
            font-size: 10px;
            color: rgba(0, 0, 0, 0.25);
            margin-top: 4px;
            display: block;
            text-align: right;
        }
        .message.self .bubble .time-tag {
            color: rgba(255, 255, 255, 0.4);
        }
        .message .sender-name {
            font-size: 11px;
            color: rgba(0, 0, 0, 0.3);
            font-weight: 500;
        }
        .message.self .sender-name {
            text-align: right;
        }
        .typing-indicator {
            align-self: flex-start;
            padding: 8px 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: rgba(0, 0, 0, 0.3);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }
        .typing-indicator.show {
            display: flex;
        }
        .typing-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.3);
            animation: dotBounce 1.2s infinite;
        }
        .typing-indicator .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }
        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px 14px;
            flex-shrink: 0;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            color: #1a1a2e;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .chat-input-area input::placeholder {
            color: rgba(0, 0, 0, 0.2);
        }
        .chat-input-area input:focus {
            border-color: rgba(124, 58, 237, 0.3);
            background: #ffffff;
        }
        .chat-input-area .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.2);
        }
        .chat-input-area .send-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.3);
        }
        .chat-input-area .send-btn:active {
            transform: scale(0.94);
        }

        /* 表情包按钮 */
        .chat-input-area .emoji-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.04);
            color: rgba(0, 0, 0, 0.4);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .chat-input-area .emoji-btn:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        /* 表情包面板 */
        .emoji-panel {
            display: none;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
            max-height: 150px;
            overflow-y: auto;
        }
        .emoji-panel.show {
            display: flex;
        }
        .emoji-panel .emoji-item {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            background: #ffffff;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .emoji-panel .emoji-item:hover {
            background: #f0f0f5;
            transform: scale(1.05);
        }
        .emoji-panel .emoji-item img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }
        .emoji-panel .emoji-item .del-emoji {
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
            color: rgba(0, 0, 0, 0.2);
            background: #fff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.04);
            cursor: pointer;
        }
        .emoji-panel .emoji-item:hover .del-emoji {
            display: flex;
        }
        .emoji-panel .emoji-item {
            position: relative;
        }

        /* 覆盖层 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(16px);
            z-index: 10;
            display: none;
            flex-direction: column;
            border-radius: 36px;
            overflow: hidden;
            animation: fadeIn 0.25s ease-out;
        }
        .overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }
        .overlay-header .title {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a2e;
        }
        .overlay-header .close-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.04);
            color: rgba(0, 0, 0, 0.4);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }
        .overlay-header .close-btn:hover {
            background: rgba(0, 0, 0, 0.08);
            color: #1a1a2e;
        }
        .overlay-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 24px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
        }
        .overlay-body::-webkit-scrollbar {
            width: 3px;
        }
        .overlay-body::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        /* 设置项 */
        .setting-group {
            margin-bottom: 22px;
        }
        .setting-group .group-title {
            font-size: 12px;
            font-weight: 600;
            color: rgba(0, 0, 0, 0.25);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }
        .setting-row .label {
            font-size: 14px;
            color: rgba(0, 0, 0, 0.7);
        }
        .setting-row .action-btn {
            padding: 4px 14px;
            border-radius: 16px;
            border: 1px solid rgba(124, 58, 237, 0.1);
            background: rgba(124, 58, 237, 0.04);
            color: rgba(0, 0, 0, 0.5);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .setting-row .action-btn:hover {
            background: rgba(124, 58, 237, 0.08);
            border-color: rgba(124, 58, 237, 0.2);
            color: #1a1a2e;
        }
        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .color-picker .color-opt {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .color-picker .color-opt:hover {
            transform: scale(1.08);
        }
        .color-picker .color-opt.active {
            border-color: #1a1a2e;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #1a1a2e;
        }
        .bg-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .bg-picker .bg-opt {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .bg-picker .bg-opt:hover {
            transform: scale(1.05);
        }
        .bg-picker .bg-opt.active {
            border-color: #1a1a2e;
            box-shadow: 0 0 0 2px #ffffff, 0 0 0 4px #1a1a2e;
        }
        .bg-picker .bg-opt.custom-bg {
            background: #e8ecf1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: rgba(0, 0, 0, 0.2);
        }
        .bg-picker .bg-opt input[type="file"] {
            display: none;
        }

        .toggle-switch {
            width: 40px;
            height: 22px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: rgba(124, 58, 237, 0.5);
        }
        .toggle-switch .knob {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.3s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }
        .toggle-switch.active .knob {
            left: 20px;
        }

        .range-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .range-group input[type="range"] {
            width: 100px;
            accent-color: #7c3aed;
            background: transparent;
        }
        .range-group .val {
            min-width: 30px;
            text-align: center;
            color: rgba(0, 0, 0, 0.6);
            font-size: 13px;
        }

        /* 字卡库 */
        .card-group-item {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(0, 0, 0, 0.03);
        }
        .card-group-item .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .card-group-item .group-header .name {
            font-size: 14px;
            font-weight: 500;
            color: rgba(0, 0, 0, 0.8);
        }
        .card-group-item .group-header .count {
            font-size: 12px;
            color: rgba(0, 0, 0, 0.25);
        }
        .card-group-item .card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .card-group-item .card-list .card-tag {
            padding: 4px 12px;
            border-radius: 16px;
            background: rgba(124, 58, 237, 0.06);
            border: 1px solid rgba(124, 58, 237, 0.04);
            font-size: 13px;
            color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card-group-item .card-list .card-tag .del {
            cursor: pointer;
            color: rgba(0, 0, 0, 0.15);
            font-size: 12px;
        }
        .card-group-item .card-list .card-tag .del:hover {
            color: #dc2626;
        }
        .card-group-item .add-card-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .card-group-item .add-card-row input {
            flex: 1;
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            color: rgba(0, 0, 0, 0.7);
            font-size: 13px;
            outline: none;
        }
        .card-group-item .add-card-row input:focus {
            border-color: rgba(124, 58, 237, 0.2);
        }
        .card-group-item .add-card-row button {
            padding: 6px 14px;
            border-radius: 12px;
            border: none;
            background: rgba(124, 58, 237, 0.08);
            color: rgba(0, 0, 0, 0.5);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .card-group-item .add-card-row button:hover {
            background: rgba(124, 58, 237, 0.15);
            color: #1a1a2e;
        }
        .card-group-item .batch-add-area {
            margin-top: 8px;
        }
        .card-group-item .batch-add-area textarea {
            width: 100%;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            color: rgba(0, 0, 0, 0.7);
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
            outline: none;
            font-family: inherit;
        }
        .card-group-item .batch-add-area textarea:focus {
            border-color: rgba(124, 58, 237, 0.2);
        }
        .card-group-item .batch-add-area .batch-btn {
            margin-top: 6px;
            padding: 6px 14px;
            border-radius: 12px;
            border: none;
            background: rgba(124, 58, 237, 0.08);
            color: rgba(0, 0, 0, 0.5);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .card-group-item .batch-add-area .batch-btn:hover {
            background: rgba(124, 58, 237, 0.15);
            color: #1a1a2e;
        }

        .add-group-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .add-group-row input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: rgba(255, 255, 255, 0.5);
            color: rgba(0, 0, 0, 0.7);
            font-size: 13px;
            outline: none;
        }
        .add-group-row input:focus {
            border-color: rgba(124, 58, 237, 0.2);
        }
        .add-group-row button {
            padding: 8px 18px;
            border-radius: 12px;
            border: none;
            background: rgba(124, 58, 237, 0.08);
            color: rgba(0, 0, 0, 0.5);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-group-row button:hover {
            background: rgba(124, 58, 237, 0.15);
            color: #1a1a2e;
        }
        .import-export-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .import-export-row button {
            padding: 8px 20px;

        /* 拍一拍 */
        .pat-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            color: #ffffff;

            border-radius: 20px;
            font-size: 18px;

            z-index: 20;

            pointer-events: none;
            transition: none;
            text-align: center;
            max-width: 80%;
        }
        .pat-popup.show {
            animation: patIn 0.4s ease-out forwards;
        }
        @keyframes patIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            30% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.05);

            }
            100% {

            }
        }
        @keyframes patOut {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.1);

            .phone { width: 100%; height: 100vh; max-height: 100vh; border-radius: 0; box-shadow: none; }

<script>
// ================================================================
//  完整应用逻辑
// ================================================================

const STORAGE_KEY = 'chuanxun_data_v2';

const defaultData = {
    settings: {
        myAvatar: '😊',
        partnerAvatar: '🌟',
        bubbleColor: '#7c3aed',
        bg: '#f7f8fa',
        bgImage: '',
        minWait: 3,
        maxWait: 8,
        minReply: 1,
        maxReply: 3,
        interval: 31,
        showTimestamp: true,
    },
    messages: [],
    wordCards: {
        '关心/提醒': ['记得多喝水哦 💧', '今天要早点休息 ~', '工作别太累了 🫂', '加油！你是最棒的 💪', '我一直在你身边 ❤️'],
        '情绪': ['抱抱你 🫂', '今天心情怎么样？', '别难过，我陪着你 😢', '好开心呀！😊', '今天是个好日子！🎉'],
        '身体状况': ['记得按时吃饭 🍚', '多运动，身体棒 🏃', '睡够8小时了吗？😴', '注意保暖哦 🣣'],
        '日常': ['今天天气真好 🌤', '想你了 💕', '在干嘛呢？', '晚安 🌙', '早安 ☀️'],
    },
    letters: {
        sent: [],
        received: [],
    },
    pats: ['拍了拍我的头', '戳了戳我的脸', '捏了捏我的脸', '揉了揉我的肚子', '拍了拍我的肩膀'],
    emojis: ['😊', '❤️', '😂', '😭', '🥺', '✨', '🔥', '💕', '🎉', '🤔', '😘', '💪'],
    letterTimers: {},
};

let data = loadData();

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            return deepMerge(defaultData, parsed);
        }
    } catch(e) {}
    return JSON.parse(JSON.stringify(defaultData));
}

function deepMerge(target, source) {
    const result = { ...target };
    for (const key in source) {
        if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
            result[key] = deepMerge(target[key] || {}, source[key]);
        } else {
            result[key] = source[key];
        }
    }
    return result;
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

// ===== 工具 =====
function formatTime(ts) {
    const d = new Date(ts);
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function formatDate(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '/' + String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0') + ' ' + formatTime(ts);
}

function randomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function pickRandom(arr) {
    if (!arr || arr.length === 0) return null;
    return arr[Math.floor(Math.random() * arr.length)];
}

function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
}

function getAllCards() {
    const groups = data.wordCards;
    const all = [];
    for (const key in groups) {
        if (Array.isArray(groups[key])) {
            all.push(...groups[key]);
        }
    }
    return all;
}

// ===== 拍一拍 =====
function showPat(content) {
    patPopup.textContent = '🫳 ' + content;
    patPopup.classList.remove('hide', 'show');
    void patPopup.offsetWidth;
    patPopup.classList.add('show');
    setTimeout(() => {
        patPopup.classList.remove('show');
        patPopup.classList.add('hide');
        setTimeout(() => patPopup.classList.remove('hide'), 400);
    }, 1200);
}

// ===== 消息 =====
function renderMessages() {
    const msgs = data.messages;
    messageList.innerHTML = '';
    if (msgs.length === 0) {
        messageList.appendChild(emptyState);
        return;
    }
    const myAvatarUrl = data.settings.myAvatar;
    const partnerAvatarUrl = data.settings.partnerAvatar;
    msgs.forEach((msg) => {
        const div = document.createElement('div');
        div.className = `message ${msg.sender === 'self' ? 'self' : 'other'}`;
        const avatarContent = msg.sender === 'self' ? myAvatarUrl : partnerAvatarUrl;
        const avatarHtml = `<div class="msg-avatar" style="background-image:url('${avatarContent}'); background-size:cover; background-position:center; font-size:0;">${avatarContent.startsWith('data:') || avatarContent.startsWith('http') ? '' : avatarContent}</div>`;
        const timeHtml = data.settings.showTimestamp ? `<span class="time-tag">${formatTime(msg.timestamp)}</span>` : '';
        const nameLabel = msg.sender === 'self' ? '我' : '鱼鱼';
        let bubbleContent = msg.content;
        // 检查是否是图片
        if (msg.content.startsWith('http') && (msg.content.match(/\.(jpg|jpeg|png|gif|webp)/i))) {
            bubbleContent = `<img src="${msg.content}" alt="表情" />`;
        } else if (msg.content.startsWith('data:image/')) {
            bubbleContent = `<img src="${msg.content}" alt="表情" />`;
        }
        div.innerHTML = `
            ${msg.sender === 'other' ? avatarHtml : ''}
            <div class="bubble-wrapper">
                <div class="sender-name">${nameLabel}</div>
                <div class="bubble" style="background:${msg.sender === 'self' ? currentBubbleColor : '#ffffff'}">
                    ${bubbleContent}
                    ${timeHtml}
                </div>
            </div>
            ${msg.sender === 'self' ? avatarHtml : ''}
        `;
        // 如果是图片表情，调整样式
        messageList.appendChild(div);
    });
    messageList.scrollTop = messageList.scrollHeight;
}

function addMessage(sender, content, timestamp) {
    const ts = timestamp || Date.now();
    data.messages.push({ sender, content, timestamp: ts });
    saveData();
    renderMessages();
    updateStats();
    return ts;
}

// ===== 模拟回复 =====
async function simulateReply() {
    if (isReplying) return;
    isReplying = true;
    const minWait = data.settings.minWait || 3;
    const maxWait = data.settings.maxWait || 8;
    const minReply = data.settings.minReply || 1;
    const maxReply = data.settings.maxReply || 3;
    const waitTime = randomInt(minWait, maxWait) * 1000;
    typingIndicator.classList.add('show');
    await sleep(waitTime);
    typingIndicator.classList.remove('show');
    const allCards = getAllCards();
    if (allCards.length === 0) { isReplying = false; return; }
    const count = randomInt(minReply, maxReply);
    const shuffled = [...allCards].sort(() => Math.random() - 0.5);
    const selected = shuffled.slice(0, Math.min(count, allCards.length));
    for (let i = 0; i < selected.length; i++) {
        addMessage('other', selected[i]);
        if (i < selected.length - 1) await sleep(randomInt(400, 1200));
    }
    isReplying = false;
    updateStats();
}

// ===== 发送 =====
function sendMessage(text) {
    if (!text || text.trim() === '') return;
    const content = text.trim();
    addMessage('self', content);
    chatInput.value = '';
    chatInput.focus();
    if (!isReplying) {
        if (replyTimer) clearTimeout(replyTimer);
        const minWait = data.settings.minWait || 3;
        const maxWait = data.settings.maxWait || 8;
        const delay = randomInt(minWait, maxWait) * 1000;
        replyTimer = setTimeout(() => { simulateReply(); }, delay);
    }
}

// ===== 更新统计 =====
function updateStats() {
    const total = data.messages.length;
    const sent = data.messages.filter(m => m.sender === 'self').length;
    const received = data.messages.filter(m => m.sender === 'other').length;
    const letters = data.letters.sent.length + data.letters.received.length;
    document.getElementById('statTotal').textContent = total;
    document.getElementById('statSent').textContent = sent;
    document.getElementById('statReceived').textContent = received;
    document.getElementById('statLetters').textContent = letters;
}

// ===== 渲染字卡库 =====
function renderCardLib() {
    const groups = data.wordCards;
    let html = '';
    for (const [groupName, cards] of Object.entries(groups)) {
        if (!Array.isArray(cards)) continue;
        html += `
            <div class="card-group-item" data-group="${groupName}">
                <div class="group-header">
                    <span class="name">📂 ${groupName}</span>
                    <span class="count">${cards.length} 条</span>
                    <div>
                        <button class="del-group-btn" data-group="${groupName}" style="background:transparent; border:none; color:rgba(0,0,0,0.2); cursor:pointer;">✕</button>
                    </div>
                </div>
                <div class="card-list">
                    ${cards.map((c, idx) => `
                        <span class="card-tag">
                            ${c}
                            <span class="del" data-group="${groupName}" data-index="${idx}">✕</span>
                        </span>
                    `).join('')}
                </div>
                <div class="add-card-row">
                    <input type="text" placeholder="添加字卡…" class="new-card-input" data-group="${groupName}" />
                    <button class="add-card-btn" data-group="${groupName}">+</button>
                </div>
                <div class="batch-add-area">
                    <textarea placeholder="批量添加，每行一条…" class="batch-textarea" data-group="${groupName}"></textarea>
                    <button class="batch-btn" data-group="${groupName}">📥 批量添加</button>
                </div>
            </div>
        `;
    }
    html += `
        <div class="add-group-row">
            <input type="text" id="newGroupName" placeholder="新分组名称…" />
            <button id="addGroupBtn">+ 新建分组</button>
        </div>
        <div class="import-export-row">
            <button id="exportCardsBtn">📤 导出字卡</button>
            <button id="importCardsBtn">📥 导入字卡</button>
            <input type="file" id="importCardsInput" accept=".json" />
        </div>
        <div class="import-options">
            <label><input type="radio" name="importMode" value="append" checked /> 追加</label>
            <label><input type="radio" name="importMode" value="overwrite" /> 覆盖</label>
        </div>
    `;
    cardLibContent.innerHTML = html;

    // 事件
    cardLibContent.querySelectorAll('.del-group-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const group = this.dataset.group;
            if (confirm(`确定删除分组「${group}」？`)) {
                delete data.wordCards[group];
                saveData();
                renderCardLib();
            }
        });
    });
    cardLibContent.querySelectorAll('.card-tag .del').forEach(el => {
        el.addEventListener('click', function() {
            const group = this.dataset.group;
            const idx = parseInt(this.dataset.index);
            if (data.wordCards[group]) {
                data.wordCards[group].splice(idx, 1);
                saveData();
                renderCardLib();
            }
        });
    });
    cardLibContent.querySelectorAll('.add-card-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const group = this.dataset.group;
            const input = document.querySelector(`.new-card-input[data-group="${group}"]`);
            if (!input) return;
            const val = input.value.trim();
            if (!val) return;
            if (!data.wordCards[group]) data.wordCards[group] = [];
            data.wordCards[group].push(val);
            saveData();
            renderCardLib();
        });
    });
    cardLibContent.querySelectorAll('.batch-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const group = this.dataset.group;
            const textarea = document.querySelector(`.batch-textarea[data-group="${group}"]`);
            if (!textarea) return;
            const lines = textarea.value.split('\n').map(s => s.trim()).filter(s => s);
            if (lines.length === 0) return;
            if (!data.wordCards[group]) data.wordCards[group] = [];
            data.wordCards[group].push(...lines);
            saveData();
            renderCardLib();
        });
    });
    const addGroupBtn = document.getElementById('addGroupBtn');
    const newGroupName = document.getElementById('newGroupName');
    if (addGroupBtn && newGroupName) {
        addGroupBtn.addEventListener('click', function() {
            const name = newGroupName.value.trim();
            if (!name || data.wordCards[name]) { if(data.wordCards[name]) alert('分组已存在'); return; }
            data.wordCards[name] = [];
            saveData();
            renderCardLib();
            newGroupName.value = '';
        });
        newGroupName.addEventListener('keydown', e => { if (e.key === 'Enter') addGroupBtn.click(); });
    }
    document.getElementById('exportCardsBtn')?.addEventListener('click', function() {
        const json = JSON.stringify(data.wordCards, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `字卡库_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    });
    const importBtn = document.getElementById('importCardsBtn');
    const importInput = document.getElementById('importCardsInput');
    if (importBtn && importInput) {
        importBtn.addEventListener('click', function() { importInput.click(); });
        importInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const imported = JSON.parse(ev.target.result);
                    if (typeof imported === 'object' && !Array.isArray(imported)) {
                        const mode = document.querySelector('input[name="importMode"]:checked')?.value || 'append';
                        if (mode === 'overwrite') {
                            data.wordCards = {};
                        }
                        for (const key in imported) {
                            if (Array.isArray(imported[key])) {
                                if (!data.wordCards[key]) data.wordCards[key] = [];
                                data.wordCards[key] = [...new Set([...data.wordCards[key], ...imported[key]])];
                            }
                        }
                        saveData();
                        renderCardLib();
                        alert('导入成功！');
                    } else {
                        alert('格式错误');
                    }
                } catch(err) { alert('解析失败：' + err.message); }
            };
            reader.readAsText(file);
            this.value = '';
        });
    }
}

// ===== 渲染信件 =====
function renderLetters() {
    const sent = data.letters.sent || [];
    const received = data.letters.received || [];
    let html = '';
    const all = [];
    sent.forEach(l => all.push({ ...l, type: 'sent' }));
    received.forEach(l => all.push({ ...l, type: 'received' }));
    all.sort((a, b) => b.timestamp - a.timestamp);
    if (all.length === 0) {
        html = '<div class="empty-state"><div class="icon">💌</div><div>还没有信件</div></div>';
    } else {
        all.forEach(l => {
            const label = l.type === 'sent' ? '📤 寄出' : '📥 收到';
            const time = formatDate(l.timestamp);
            html += `
                <div class="letter-item">
                    <div class="top"><span>${label}</span><span class="badge">${time}</span></div>
                    <div class="content">${l.content || '(空)'}</div>
                    ${l.type === 'sent' && l.replied ? '<div class="reply-status">✅ 已收到回信</div>' : ''}
                    ${l.type === 'sent' && !l.replied ? '<div class="reply-status">⏳ 等待回信…</div>' : ''}
                </div>
            `;
        });
    }
    letterList.innerHTML = html;
}

// ===== 写信 =====
function sendLetter() {
    const content = letterInput.value.trim();
    if (!content) return;
    const sentItem = { content, timestamp: Date.now(), replied: false };
    data.letters.sent.push(sentItem);
    saveData();
    // 6-12小时后回信
    const delay = randomInt(6, 12) * 60 * 60 * 1000;
    const timerId = setTimeout(() => {
        const allCards = getAllCards();
        let replyContent = '（对方没有回复）';
        if (allCards.length > 0) replyContent = pickRandom(allCards);
        const receivedItem = { content: replyContent, timestamp: Date.now() };
        data.letters.received.push(receivedItem);
        // 标记已回复
        const sentIdx = data.letters.sent.findIndex(s => s.timestamp === sentItem.timestamp);
        if (sentIdx !== -1) data.letters.sent[sentIdx].replied = true;
        saveData();
        renderLetters();
        // 在聊天里显示回信通知（但信件内容不显示在聊天里）
        addMessage('other', '📬 你有一封新回信，请到信封页面查看');
    }, delay);
    data.letterTimers[sentItem.timestamp] = timerId;
    letterInput.value = '';
    renderLetters();
    addMessage('self', '📮 信件已寄出，将在6-12小时后收到回信');
    updateStats();
    alert('💌 信件已寄出！对方将在6-12小时后回信。');
}

// ===== 头像 =====
function setupAvatar(avatarEl, inputEl, storageKey) {
    const group = avatarEl.closest('.avatar-group');
    group.addEventListener('click', function(e) {
        if (e.target.closest('.upload-hint') || e.target === inputEl) return;
        inputEl.click();
    });
    group.querySelector('.upload-hint')?.addEventListener('click', function(e) {
        e.stopPropagation();
        inputEl.click();
    });
    inputEl.addEventListener('change', function(e) {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            const dataUrl = ev.target.result;
            avatarEl.style.backgroundImage = `url(${dataUrl})`;
            avatarEl.style.backgroundSize = 'cover';
            avatarEl.style.backgroundPosition = 'center';
            avatarEl.textContent = '';
            avatarEl.style.fontSize = '0';
            data.settings[storageKey] = dataUrl;
            saveData();
            renderMessages();
        };
        reader.readAsDataURL(file);
        this.value = '';
    });
    if (data.settings[storageKey] && (data.settings[storageKey].startsWith('data:') || data.settings[storageKey].startsWith('http'))) {
        avatarEl.style.backgroundImage = `url(${data.settings[storageKey]})`;
        avatarEl.style.backgroundSize = 'cover';
        avatarEl.style.backgroundPosition = 'center';
        avatarEl.textContent = '';
        avatarEl.style.fontSize = '0';
    } else if (data.settings[storageKey]) {
        avatarEl.textContent = data.settings[storageKey];
        avatarEl.style.fontSize = '28px';
        avatarEl.style.backgroundImage = 'none';
    }
}

// ===== 背景 =====
function applyBg(bg, bgImage) {
    const layer = document.getElementById('bgLayer');
    const img = document.getElementById('bgImage');
    if (bgImage && bgImage.startsWith('data:') || bgImage && bgImage.startsWith('http')) {
        img.src = bgImage;
        layer.classList.add('has-image');
        layer.style.background = 'transparent';
    } else {
        img.src = '';
        layer.classList.remove('has-image');
        layer.style.background = bg || '#f7f8fa';
    }
}

// ===== 表情包 =====
function renderEmojis() {
    const panel = emojiPanel;
    panel.innerHTML = '';
    data.emojis.forEach((emoji, idx) => {
        const item = document.createElement('div');
        item.className = 'emoji-item';
        if (emoji.startsWith('http') || emoji.startsWith('data:image')) {
            item.innerHTML = `<img src="${emoji}" alt="表情" /><span class="del-emoji" data-idx="${idx}">✕</span>`;
        } else {
            item.textContent = emoji;
            const del = document.createElement('span');
            del.className = 'del-emoji';
            del.dataset.idx = idx;
            del.textContent = '✕';
            item.appendChild(del);
        }
        item.addEventListener('click', function(e) {
            if (e.target.closest('.del-emoji')) return;
            const emojiContent = emoji;
            chatInput.value += ' ' + emojiContent + ' ';
            chatInput.focus();
        });
        item.querySelector('.del-emoji')?.addEventListener('click', function(e) {
            e.stopPropagation();
            const idx = parseInt(this.dataset.idx);
            data.emojis.splice(idx, 1);
            saveData();
            renderEmojis();
            renderEmojiManage();
        });
        panel.appendChild(item);
    });
    if (data.emojis.length === 0) {
        panel.innerHTML = '<div style="color:rgba(0,0,0,0.15); font-size:13px; padding:8px 0;">还没有表情包，去设置里添加吧</div>';
    }
}

function renderEmojiManage() {
    const list = document.getElementById('emojiManageList');
    if (!list) return;
    list.innerHTML = '';
    data.emojis.forEach((emoji, idx) => {
        const tag = document.createElement('span');
        tag.className = 'card-tag';
        if (emoji.startsWith('http') || emoji.startsWith('data:image')) {
            tag.innerHTML = `<img src="${emoji}" style="width:24px;height:24px;object-fit:contain;" /><span class="del" data-idx="${idx}">✕</span>`;
        } else {
            tag.textContent = emoji;
            const del = document.createElement('span');
            del.className = 'del';
            del.dataset.idx = idx;
            del.textContent = '✕';
            tag.appendChild(del);
        }
        tag.querySelector('.del')?.addEventListener('click', function() {
            const idx = parseInt(this.dataset.idx);
            data.emojis.splice(idx, 1);
            saveData();
            renderEmojis();
            renderEmojiManage();
        });
        list.appendChild(tag);
    });
    if (data.emojis.length === 0) {
        list.innerHTML = '<span style="color:rgba(0,0,0,0.15); font-size:13px;">还没有表情包</span>';
    }
}

// ===== 拍一拍管理 =====
function renderPatManage() {
    const list = document.getElementById('patContentList');
    if (!list) return;
    list.innerHTML = '';
    data.pats.forEach((pat, idx) => {
        const tag = document.createElement('span');
        tag.className = 'card-tag';
        tag.textContent = pat;
        const del = document.createElement('span');
        del.className = 'del';
        del.textContent = '✕';
        del.addEventListener('click', function() {
            data.pats.splice(idx, 1);
            saveData();
            renderPatManage();
        });
        tag.appendChild(del);
        list.appendChild(tag);
    });
    if (data.pats.length === 0) {
        list.innerHTML = '<span style="color:rgba(0,0,0,0.15); font-size:13px;">还没有拍一拍内容</span>';
    }
}

// ===== 打开覆盖层 =====
function openOverlay(overlay) {
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
    overlay.classList.add('open');
}

function closeAllOverlays() {
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
}

// ===== 初始化 =====
function init() {
    function updateTime() {
        const d = new Date();
        statusTime.textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }
    updateTime();
    setInterval(updateTime, 30000);

    setupAvatar(myAvatar, myAvatarInput, 'myAvatar');
    setupAvatar(partnerAvatar, partnerAvatarInput, 'partnerAvatar');

    currentBubbleColor = data.settings.bubbleColor;
    applyBg(data.settings.bg, data.settings.bgImage);
    renderMessages();
    updateStats();
    renderEmojis();
    renderPatManage();
    renderEmojiManage();

    // 设置面板值
    minWaitRange.value = data.settings.minWait || 3;
    maxWaitRange.value = data.settings.maxWait || 8;
    minReplyRange.value = data.settings.minReply || 1;
    maxReplyRange.value = data.settings.maxReply || 3;
    intervalRange.value = data.settings.interval || 31;
    minWaitVal.textContent = data.settings.minWait + 's';
    maxWaitVal.textContent = data.settings.maxWait + 's';
    minReplyVal.textContent = data.settings.minReply;
    maxReplyVal.textContent = data.settings.maxReply;
    intervalVal.textContent = data.settings.interval + 'min';
    toggleTimestamp.classList.toggle('active', data.settings.showTimestamp !== false);

    // 气泡颜色高亮
    bubbleColorPicker.querySelectorAll('.color-opt').forEach(el => {
        el.classList.toggle('active', el.dataset.color === currentBubbleColor);
    });

    // 背景高亮
    bgPicker.querySelectorAll('.bg-opt').forEach(el => {
        const isActive = (el.dataset.bg === data.settings.bg) || 
            (data.settings.bgImage && el.classList.contains('custom-bg'));
        el.classList.toggle('active', isActive);
    });

    // ===== 事件 =====
    sendBtn.addEventListener('click', function() { sendMessage(chatInput.value); });
    chatInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage(this.value);
        }
    });

    // 表情包按钮
    emojiBtn.addEventListener('click', function() {
        emojiPanel.classList.toggle('show');
    });

    // 设置
    settingsBtn.addEventListener('click', function() { openOverlay(settingsOverlay); });
    closeSettings.addEventListener('click', closeAllOverlays);

    // 字卡库
    gotoCardLibBtn.addEventListener('click', function() { closeAllOverlays(); renderCardLib(); openOverlay(cardLibOverlay); });
    closeCardLib.addEventListener('click', closeAllOverlays);

    // 信封
    envelopeBtn.addEventListener('click', function() { closeAllOverlays(); renderLetters(); openOverlay(letterOverlay); });
    gotoLetterBtn.addEventListener('click', function() { closeAllOverlays(); renderLetters(); openOverlay(letterOverlay); });
    closeLetter.addEventListener('click', closeAllOverlays);
    sendLetterBtn.addEventListener('click', sendLetter);
    letterInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendLetter(); }
    });

    // 统计
    gotoStatsBtn.addEventListener('click', function() { closeAllOverlays(); updateStats(); openOverlay(statsOverlay); });
    closeStats.addEventListener('click', closeAllOverlays);
    document.getElementById('clearChatBtn')?.addEventListener('click', function() {
        if (confirm('清空所有聊天记录？')) { data.messages = []; saveData(); renderMessages(); updateStats(); closeAllOverlays(); }
    });

    // 气泡颜色
    bubbleColorPicker.addEventListener('click', function(e) {
        const opt = e.target.closest('.color-opt');
        if (!opt) return;
        const color = opt.dataset.color;
        if (!color) return;
        currentBubbleColor = color;
        data.settings.bubbleColor = color;
        saveData();
        bubbleColorPicker.querySelectorAll('.color-opt').forEach(el => el.classList.remove('active'));
        opt.classList.add('active');
        renderMessages();
    });

    // 背景
    bgPicker.addEventListener('click', function(e) {
        const opt = e.target.closest('.bg-opt');
        if (!opt) return;
        if (opt.classList.contains('custom-bg')) {
            document.getElementById('customBgInput')?.click();
            return;
        }
        const bg = opt.dataset.bg;
        if (!bg) return;
        data.settings.bg = bg;
        data.settings.bgImage = '';
        saveData();
        applyBg(bg, '');
        bgPicker.querySelectorAll('.bg-opt').forEach(el => el.classList.remove('active'));
        opt.classList.add('active');
    });
    document.getElementById('customBgInput')?.addEventListener('change', function(e) {
        const file = this.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            const dataUrl = ev.target.result;
            data.settings.bgImage = dataUrl;
            data.settings.bg = '';
            saveData();
            applyBg('', dataUrl);
            bgPicker.querySelectorAll('.bg-opt').forEach(el => el.classList.remove('active'));
            document.querySelector('.bg-opt.custom-bg')?.classList.add('active');
        };
        reader.readAsDataURL(file);
        this.value = '';
    });

    // 范围滑块
    minWaitRange.addEventListener('input', function() { const v=parseInt(this.value); minWaitVal.textContent=v+'s'; data.settings.minWait=v; saveData(); });
    maxWaitRange.addEventListener('input', function() { const v=parseInt(this.value); maxWaitVal.textContent=v+'s'; data.settings.maxWait=v; saveData(); });
    minReplyRange.addEventListener('input', function() { const v=parseInt(this.value); minReplyVal.textContent=v; data.settings.minReply=v; saveData(); });
    maxReplyRange.addEventListener('input', function() { const v=parseInt(this.value); maxReplyVal.textContent=v; data.settings.maxReply=v; saveData(); });
    intervalRange.addEventListener('input', function() { const v=parseInt(this.value); intervalVal.textContent=v+'min'; data.settings.interval=v; saveData(); resetAutoSend(); });

    toggleTimestamp.addEventListener('click', function() {
        this.classList.toggle('active');
        data.settings.showTimestamp = this.classList.contains('active');
        saveData();
        renderMessages();
    });

    // 更换头像按钮
    document.getElementById('changeMyAvatarBtn')?.addEventListener('click', function() { myAvatarInput.click(); });
    document.getElementById('changePartnerAvatarBtn')?.addEventListener('click', function() { partnerAvatarInput.click(); });

    // 拍一拍
    document.getElementById('addPatBtn')?.addEventListener('click', function() {
        const input = document.getElementById('patInput');
        const val = input.value.trim();
        if (!val) return;
        data.pats.push(val);
        saveData();
        renderPatManage();
        input.value = '';
    });
    document.getElementById('patInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('addPatBtn')?.click();
    });

    // 表情包管理
    document.getElementById('addEmojiBtn')?.addEventListener('click', function() {
        const input = document.getElementById('emojiInput');
        const val = input.value.trim();
        if (!val) return;
        data.emojis.push(val);
        saveData();
        renderEmojis();
        renderEmojiManage();
        input.value = '';
    });
    document.getElementById('emojiInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('addEmojiBtn')?.click();
    });

    // 头像点击拍一拍
    document.querySelectorAll('.chat-avatars .avatar').forEach(el => {
        el.addEventListener('dblclick', function() {
            if (data.pats.length > 0) {
                const pat = pickRandom(data.pats);
                showPat(pat);
                // 同时给双方都显示一条拍一拍提示（不存消息）
            }
        });
    });

    // 关闭覆盖层点击外部
    document.querySelectorAll('.overlay').forEach(overlay => {
        overlay.addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('open');
        });
    });

    resetAutoSend();
    console.log('📡 传讯已启动！');
}

// ===== 自动发送 =====
function resetAutoSend() {
    if (autoSendTimer) { clearInterval(autoSendTimer); autoSendTimer = null; }
    const interval = data.settings.interval || 31;
    if (interval > 0) {
        autoSendTimer = setInterval(() => {
            const allCards = getAllCards();
            if (allCards.length > 0 && !isReplying) {
                const card = pickRandom(allCards);
                if (card) {
                    addMessage('other', '💬 ' + card);
                    updateStats();
                }
            }
        }, interval * 60 * 1000);
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
