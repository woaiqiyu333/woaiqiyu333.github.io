<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>传讯 · 字卡聊天</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        body {
            background: #0b0710;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* ===== 手机容器 ===== */
        .phone {
            width: 400px;
            max-width: 100%;
            height: 780px;
            max-height: 95vh;
            background: #120d1a;
            border-radius: 36px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(120, 80, 200, 0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all 0.2s;
        }
        /* ===== 状态栏 ===== */
        .status-bar {
            padding: 12px 20px 6px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            background: transparent;
            flex-shrink: 0;
            letter-spacing: 0.3px;
        }
        .status-bar .time {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
        }
        .status-bar .icons {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .status-bar .icons span {
            font-size: 13px;
        }

        /* ===== 主界面容器 ===== */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ===== 聊天头部 ===== */
        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px 12px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 2;
        }
        .chat-header .back {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            cursor: pointer;
            border-radius: 50%;
            transition: 0.2s;
            background: transparent;
            border: none;
        }
        .chat-header .back:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .chat-header .title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #c084fc, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .chat-header .actions {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .chat-header .actions button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .chat-header .actions button:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .chat-header .actions button.active {
            background: rgba(167, 139, 250, 0.2);
            color: #a78bfa;
        }

        /* ===== 头像双人 ===== */
        .chat-avatars {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            padding: 12px 0 8px;
            flex-shrink: 0;
            position: relative;
        }
        .chat-avatars .avatar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            position: relative;
        }
        .chat-avatars .avatar-group .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid rgba(167, 139, 250, 0.3);
            object-fit: cover;
            transition: 0.3s;
            background: #1a1425;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.3);
            overflow: hidden;
        }
        .chat-avatars .avatar-group .avatar:hover {
            border-color: #a78bfa;
            transform: scale(1.03);
        }
        .chat-avatars .avatar-group .label {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
        }
        .chat-avatars .vs {
            color: rgba(255, 255, 255, 0.08);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .chat-avatars .avatar-group .upload-hint {
            position: absolute;
            bottom: -2px;
            right: -4px;
            background: rgba(167, 139, 250, 0.25);
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(167, 139, 250, 0.2);
            backdrop-filter: blur(4px);
        }
        .chat-avatars .avatar-group input[type="file"] {
            display: none;
        }

        /* ===== 消息列表 ===== */
        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .message-list::-webkit-scrollbar {
            width: 3px;
        }
        .message-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .message-list::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.25);
            border-radius: 10px;
        }

        /* ===== 消息气泡 ===== */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: msgIn 0.25s ease-out;
        }
        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .message.self {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message.other {
            align-self: flex-start;
            align-items: flex-start;
        }
        .message .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            color: #f0edf5;
            position: relative;
            background: #1e1830;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            transition: background 0.3s;
        }
        .message.self .bubble {
            background: #7c3aed;
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .message.other .bubble {
            background: #1e1830;
            border-bottom-left-radius: 4px;
        }
        .message .bubble .time-tag {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 4px;
            display: block;
            text-align: right;
            letter-spacing: 0.3px;
        }
        .message.other .bubble .time-tag {
            text-align: left;
        }
        .message .sender-name {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 2px;
            padding-left: 4px;
            letter-spacing: 0.5px;
        }
        .message.self .sender-name {
            text-align: right;
            padding-right: 4px;
        }

        /* ===== 打字指示器 ===== */
        .typing-indicator {
            align-self: flex-start;
            padding: 8px 16px;
            border-radius: 18px;
            background: rgba(30, 24, 48, 0.6);
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(167, 139, 250, 0.08);
        }
        .typing-indicator.show {
            display: flex;
        }
        .typing-indicator .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(167, 139, 250, 0.4);
            animation: dotBounce 1.2s infinite;
        }
        .typing-indicator .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes dotBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* ===== 输入区域 ===== */
        .chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px 14px;
            flex-shrink: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            background: rgba(18, 13, 26, 0.6);
            backdrop-filter: blur(10px);
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: #f0edf5;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .chat-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .chat-input-area input:focus {
            border-color: rgba(167, 139, 250, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }
        .chat-input-area .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.25);
        }
        .chat-input-area .send-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 24px rgba(124, 58, 237, 0.35);
        }
        .chat-input-area .send-btn:active {
            transform: scale(0.94);
        }
        .chat-input-area .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== 覆盖层 ===== */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(8, 5, 14, 0.7);
            backdrop-filter: blur(12px);
            z-index: 10;
            display: none;
            flex-direction: column;
            border-radius: 36px;
            overflow: hidden;
            animation: fadeIn 0.25s ease-out;
        }
        .overlay.open {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.97);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px 12px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .overlay-header .title {
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
        }
        .overlay-header .close-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .overlay-header .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .overlay-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 24px;
        }
        .overlay-body::-webkit-scrollbar {
            width: 3px;
        }
        .overlay-body::-webkit-scrollbar-thumb {
            background: rgba(167, 139, 250, 0.2);
            border-radius: 10px;
        }

        /* ===== 设置面板 ===== */
        .setting-group {
            margin-bottom: 22px;
        }
        .setting-group .group-title {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .setting-row .label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
        .setting-row .value {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
        }
        .setting-row .action-btn {
            padding: 4px 14px;
            border-radius: 16px;
            border: 1px solid rgba(167, 139, 250, 0.15);
            background: rgba(167, 139, 250, 0.06);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .setting-row .action-btn:hover {
            background: rgba(167, 139, 250, 0.12);
            border-color: rgba(167, 139, 250, 0.25);
            color: #fff;
        }
        /* 颜色选择器 */
        .color-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .color-picker .color-opt {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .color-picker .color-opt:hover {
            transform: scale(1.08);
        }
        .color-picker .color-opt.active {
            border-color: #fff;
            box-shadow: 0 0 16px rgba(167, 139, 250, 0.3);
        }
        /* 背景选择 */
        .bg-picker {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .bg-picker .bg-opt {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }
        .bg-picker .bg-opt:hover {
            transform: scale(1.05);
        }
        .bg-picker .bg-opt.active {
            border-color: #a78bfa;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.2);
        }
        /* 输入数字 */
        .setting-row input[type="number"],
        .setting-row input[type="text"] {
            width: 60px;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.04);
            color: #fff;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: 0.2s;
        }
        .setting-row input[type="number"]:focus,
        .setting-row input[type="text"]:focus {
            border-color: rgba(167, 139, 250, 0.3);
        }
        .setting-row .range-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .setting-row .range-group input[type="range"] {
            width: 100px;
            accent-color: #a78bfa;
            background: transparent;
        }
        .setting-row .range-group .val {
            min-width: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }
        .toggle-switch {
            width: 40px;
            height: 22px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            flex-shrink: 0;
        }
        .toggle-switch.active {
            background: rgba(124, 58, 237, 0.6);
        }
        .toggle-switch .knob {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.3s;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
        .toggle-switch.active .knob {
            left: 20px;
            background: #fff;
        }

        /* ===== 字卡库 ===== */
        .card-group-item {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: 0.2s;
        }
        .card-group-item:hover {
            border-color: rgba(167, 139, 250, 0.1);
        }
        .card-group-item .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .card-group-item .group-header .name {
            font-size: 14px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
        }
        .card-group-item .group-header .count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
        }
        .card-group-item .group-header .actions {
            display: flex;
            gap: 6px;
        }
        .card-group-item .group-header .actions button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            font-size: 13px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .card-group-item .group-header .actions button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.6);
        }
        .card-group-item .card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .card-group-item .card-list .card-tag {
            padding: 4px 12px;
            border-radius: 16px;
            background: rgba(167, 139, 250, 0.08);
            border: 1px solid rgba(167, 139, 250, 0.06);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .card-group-item .card-list .card-tag .del {
            cursor: pointer;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            transition: 0.2s;
        }
        .card-group-item .card-list .card-tag .del:hover {
            color: #f87171;
        }
        .card-group-item .add-card-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .card-group-item .add-card-row input {
            flex: 1;
            padding: 6px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            outline: none;
        }
        .card-group-item .add-card-row input:focus {
            border-color: rgba(167, 139, 250, 0.2);
        }
        .card-group-item .add-card-row button {
            padding: 6px 14px;
            border-radius: 12px;
            border: none;
            background: rgba(167, 139, 250, 0.12);
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .card-group-item .add-card-row button:hover {
            background: rgba(167, 139, 250, 0.2);
            color: #fff;
        }
        .add-group-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }
        .add-group-row input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            outline: none;
        }
        .add-group-row input:focus {
            border-color: rgba(167, 139, 250, 0.2);
        }
        .add-group-row button {
            padding: 8px 18px;
            border-radius: 12px;
            border: none;
            background: rgba(167, 139, 250, 0.12);
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .add-group-row button:hover {
            background: rgba(167, 139, 250, 0.2);
            color: #fff;
        }
        .import-export-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .import-export-row button {
            padding: 8px 20px;
            border-radius: 12px;
            border: 1px solid rgba(167, 139, 250, 0.1);
            background: rgba(167, 139, 250, 0.04);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }
        .import-export-row button:hover {
            background: rgba(167, 139, 250, 0.1);
            color: #fff;
            border-color: rgba(167, 139, 250, 0.2);
        }
        .import-export-row input[type="file"] {
            display: none;
        }

        /* ===== 写信 ===== */
        .letter-form textarea {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: #f0edf5;
            font-size: 15px;
            line-height: 1.7;
            resize: vertical;
            min-height: 120px;
            outline: none;
            transition: 0.3s;
        }
        .letter-form textarea:focus {
            border-color: rgba(167, 139, 250, 0.2);
        }
        .letter-form textarea::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        .letter-form .send-letter-btn {
            margin-top: 14px;
            padding: 12px 28px;
            border-radius: 24px;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #a78bfa);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.2);
        }

    <script>
        // ================================================================
        //  传讯 · 完整应用逻辑
        // ================================================================

        // ---------- 数据 ----------
        const STORAGE_KEY = 'chuanxun_data';

        const defaultData = {
            settings: {
                myAvatar: '😊',
                partnerAvatar: '🌟',
                bubbleColor: '#7c3aed',
                bg: '#120d1a',

                ],

                    '今天是个好日子！🎉',
                ],
                '身体状况': [
                    '记得按时吃饭 🍚',
                    '多运动，身体棒 🏃',
                    '睡够8小时了吗？😴',
                    '注意保暖哦 🧣',
                    '身体是革命的本钱 💪',
                    '今天有没有好好照顾自己？',
                ],
                '关于网站/系统/链接': [
                    '新链接试过了吗？',
                    '网站加载有点慢…',
                    '这个功能好棒！',
                    '链接打不开，再发一次？',
                    'UI 设计得真好看 ✨',
                    '系统升级中，稍等～',
                ],
                '吵架': [
                    '我错了 😢 原谅我好不好',
                    '别生气啦，请你吃糖 🍬',
                    '我们和好吧 🫂',
                    '对不起，是我不好',
                    '不要冷战了… 我好想你',
                    '你赢了，我认输 🙈',
                ],
            },
            letters: {
                sent: [],
                received: [],
            },
        };

        let data = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    // 合并默认值，保证结构完整
                    return deepMerge(defaultData, parsed);
                }
            } catch (e) { /* ignore */ }
            return JSON.parse(JSON.stringify(defaultData));
        }

        function deepMerge(target, source) {
            const result = { ...target };
            for (const key in source) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                    result[key] = deepMerge(target[key] || {}, source[key]);
                } else {
                    result[key] = source[key];
                }
            }
            return result;
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // ---------- DOM 引用 ----------
        const $ = (sel) => document.querySelector(sel);
        const $$ = (sel) => document.querySelectorAll(sel);

        const messageList = $('#messageList');
        const chatInput = $('#chatInput');
        const sendBtn = $('#sendBtn');
        const emptyState = $('#emptyState');
        const typingIndicator = $('#typingIndicator');

        const myAvatar = $('#myAvatar');
        const partnerAvatar = $('#partnerAvatar');
        const myAvatarInput = $('#myAvatarInput');
        const partnerAvatarInput = $('#partnerAvatarInput');

        const settingsBtn = $('#settingsBtn');
        const settingsOverlay = $('#settingsOverlay');
        const closeSettings = $('#closeSettings');

        const cardLibOverlay = $('#cardLibOverlay');
        const closeCardLib = $('#closeCardLib');
        const cardLibContent = $('#cardLibContent');

        const letterOverlay = $('#letterOverlay');
        const closeLetter = $('#closeLetter');
        const letterInput = $('#letterInput');
        const sendLetterBtn = $('#sendLetterBtn');
        const letterList = $('#letterList');

        const statsOverlay = $('#statsOverlay');
        const closeStats = $('#closeStats');

        const envelopeBtn = $('#envelopeBtn');
        const gotoLetterBtn = $('#gotoLetterBtn');
        const gotoCardLibBtn = $('#gotoCardLibBtn');
        const gotoStatsBtn = $('#gotoStatsBtn');

        const bubbleColorPicker = $('#bubbleColorPicker');
        const bgPicker = $('#bgPicker');

        const minWaitRange = $('#minWaitRange');
        const maxWaitRange = $('#maxWaitRange');
        const replyCountRange = $('#replyCountRange');
        const intervalRange = $('#intervalRange');
        const minWaitVal = $('#minWaitVal');
        const maxWaitVal = $('#maxWaitVal');
        const replyCountVal = $('#replyCountVal');
        const intervalVal = $('#intervalVal');

        const toggleTimestamp = $('#toggleTimestamp');
        const toggleReadReceipt = $('#toggleReadReceipt');

        const statusTime = $('#statusTime');

        // ---------- 状态 ----------
        let isReplying = false;
        let replyTimer = null;
        let autoSendTimer = null;
        let currentBubbleColor = data.settings.bubbleColor;
        let currentBg = data.settings.bg;

        // ---------- 工具 ----------
        function formatTime(ts) {
            const d = new Date(ts);
            return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        }

        function formatDate(ts) {
            const d = new Date(ts);
            return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2,
                '0') + ' ' + formatTime(ts);
        }

        function randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function pickRandom(arr) {
            if (!arr || arr.length === 0) return null;
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        // ---------- 渲染消息 ----------
        function renderMessages() {
            const msgs = data.messages;
            messageList.innerHTML = '';
            if (msgs.length === 0) {
                messageList.appendChild(emptyState);
                return;
            }
            let lastSender = '';
            msgs.forEach((msg, idx) => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender === 'self' ? 'self' : 'other'}`;
                const showName = (idx === 0 || msgs[idx - 1].sender !== msg.sender);
                let senderLabel = msg.sender === 'self' ? '我' : '鱼鱼';
                let nameHtml = showName ? `<div class="sender-name">${senderLabel}</div>` : '';
                const timeHtml = data.settings.showTimestamp ?
                    `<span class="time-tag">${formatTime(msg.timestamp)}</span>` :
                    '';
                div.innerHTML = `
                    ${msg.sender === 'other' ? nameHtml : ''}
                    <div class="bubble" style="background:${msg.sender === 'self' ? currentBubbleColor : '#1e1830'}">
                        ${msg.content}
                        ${timeHtml}
                    </div>
                    ${msg.sender === 'self' ? nameHtml : ''}
                `;
                messageList.appendChild(div);
            });
            // 滚动到底部
            messageList.scrollTop = messageList.scrollHeight;
        }

        // ---------- 添加消息 ----------
        function addMessage(sender, content, timestamp) {
            const ts = timestamp || Date.now();
            data.messages.push({ sender, content, timestamp: ts });
            saveData();
            renderMessages();
            updateStats();
            return ts;
        }

        // ---------- 模拟对方回复 ----------
        async function simulateReply() {
            if (isReplying) return;
            isReplying = true;

            const minWait = data.settings.minWait || 3;
            const maxWait = data.settings.maxWait || 8;
            const count = data.settings.replyCount || 1;

            // 随机等待
            const waitTime = randomInt(minWait, maxWait) * 1000;
            // 显示打字指示
            typingIndicator.classList.add('show');
            await sleep(waitTime);
            typingIndicator.classList.remove('show');

            // 从字卡库选词
            const allCards = getAllCards();
            if (allCards.length === 0) {
                isReplying = false;
                return;
            }

            const replyCount = Math.min(count, allCards.length);
            const shuffled = [...allCards].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, replyCount);

            for (let i = 0; i < selected.length; i++) {
                const card = selected[i];
                addMessage('other', card);
                // 消息之间间隔 0.5~1.5s
                if (i < selected.length - 1) {
                    await sleep(randomInt(400, 1200));
                }
            }

            isReplying = false;
            // 更新统计
            updateStats();
        }

        function getAllCards() {
            const groups = data.wordCards;
            const all = [];
            for (const key in groups) {
                if (Array.isArray(groups[key])) {
                    all.push(...groups[key]);
                }
            }
            return all;
        }

        // ---------- 发送消息 ----------
        function sendMessage(text) {
            if (!text || text.trim() === '') return;
            const content = text.trim();
            addMessage('self', content);
            chatInput.value = '';
            chatInput.focus();

            // 触发回复
            if (!isReplying) {
                // 清除之前的定时器
                if (replyTimer) clearTimeout(replyTimer);
                // 随机延迟后回复
                const minWait = data.settings.minWait || 3;
                const maxWait = data.settings.maxWait || 8;
                const delay = randomInt(minWait, maxWait) * 1000;
                replyTimer = setTimeout(() => {
                    simulateReply();
                }, delay);
            }
        }

        // ---------- 更新统计 ----------
        function updateStats() {
            const total = data.messages.length;
            const sent = data.messages.filter(m => m.sender === 'self').length;
            const received = data.messages.filter(m => m.sender === 'other').length;
            const letters = data.letters.sent.length + data.letters.received.length;
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statSent').textContent = sent;
            document.getElementById('statReceived').textContent = received;
            document.getElementById('statLetters').textContent = letters;
        }

        // ---------- 渲染字卡库 ----------
        function renderCardLib() {
            const groups = data.wordCards;
            let html = '';
            for (const [groupName, cards] of Object.entries(groups)) {
                if (!Array.isArray(cards)) continue;
                html += `
                    <div class="card-group-item" data-group="${groupName}">
                        <div class="group-header">
                            <span class="name">📂 ${groupName}</span>
                            <span class="count">${cards.length} 条</span>
                            <div class="actions">
                                <button class="del-group-btn" data-group="${groupName}" title="删除分组">✕</button>
                            </div>
                        </div>
                        <div class="card-list">
                            ${cards.map((c, idx) => `
                                <span class="card-tag">
                                    ${c}
                                    <span class="del" data-group="${groupName}" data-index="${idx}">✕</span>
                                </span>
                            `).join('')}
                        </div>
                        <div class="add-card-row">
                            <input type="text" placeholder="添加字卡…" class="new-card-input" data-group="${groupName}" />
                            <button class="add-card-btn" data-group="${groupName}">+ 添加</button>
                        </div>
                    </div>
                `;
            }
            html += `
                <div class="add-group-row">
                    <input type="text" id="newGroupName" placeholder="新分组名称…" />
                    <button id="addGroupBtn">+ 新建分组</button>
                </div>
                <div class="import-export-row">
                    <button id="exportCardsBtn">📤 导出字卡</button>
                    <button id="importCardsBtn">📥 导入字卡</button>
                    <input type="file" id="importCardsInput" accept=".json" />
                </div>
            `;
            cardLibContent.innerHTML = html;

            // 事件绑定
            // 删除分组
            cardLibContent.querySelectorAll('.del-group-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const group = this.dataset.group;
                    if (confirm(`确定要删除分组「${group}」及其所有字卡吗？`)) {
                        delete data.wordCards[group];
                        saveData();
                        renderCardLib();
                    }
                });
            });
            // 删除字卡
            cardLibContent.querySelectorAll('.card-tag .del').forEach(el => {
                el.addEventListener('click', function() {
                    const group = this.dataset.group;
                    const idx = parseInt(this.dataset.index);
                    if (data.wordCards[group] && Array.isArray(data.wordCards[group])) {
                        data.wordCards[group].splice(idx, 1);
                        if (data.wordCards[group].length === 0) {
                            // 分组为空时保留空数组
                        }
                        saveData();
                        renderCardLib();
                    }
                });
            });
            // 添加字卡
            cardLibContent.querySelectorAll('.add-card-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const group = this.dataset.group;
                    const input = document.querySelector(`.new-card-input[data-group="${group}"]`);
                    if (!input) return;
                    const val = input.value.trim();
                    if (!val) return;
                    if (!data.wordCards[group]) data.wordCards[group] = [];
                    data.wordCards[group].push(val);
                    saveData();
                    renderCardLib();
                });
            });
            // 输入框回车
            cardLibContent.querySelectorAll('.new-card-input').forEach(inp => {
                inp.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const group = this.dataset.group;
                        const btn = document.querySelector(`.add-card-btn[data-group="${group}"]`);
                        if (btn) btn.click();
                    }
                });
            });
            // 新建分组
            const addGroupBtn = document.getElementById('addGroupBtn');
            const newGroupName = document.getElementById('newGroupName');
            if (addGroupBtn && newGroupName) {
                addGroupBtn.addEventListener('click', function() {
                    const name = newGroupName.value.trim();
                    if (!name) return;
                    if (data.wordCards[name]) {
                        alert('分组已存在');
                        return;
                    }
                    data.wordCards[name] = [];
                    saveData();
                    renderCardLib();
                    newGroupName.value = '';
                });
                newGroupName.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') addGroupBtn.click();
                });
            }
            // 导出
            const exportBtn = document.getElementById('exportCardsBtn');
            if (exportBtn) {
                exportBtn.addEventListener('click', function() {
                    const json = JSON.stringify(data.wordCards, null, 2);
                    const blob = new Blob([json], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `字卡库_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                });
            }
            // 导入
            const importBtn = document.getElementById('importCardsBtn');
            const importInput = document.getElementById('importCardsInput');
            if (importBtn && importInput) {
                importBtn.addEventListener('click', function() {
                    importInput.click();
                });
                importInput.addEventListener('change', function(e) {
                    const file = this.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        try {
                            const imported = JSON.parse(ev.target.result);
                            if (typeof imported === 'object' && !Array.isArray(imported)) {
                                // 合并导入
                                for (const key in imported) {
                                    if (Array.isArray(imported[key])) {
                                        if (!data.wordCards[key]) data.wordCards[key] = [];
                                        data.wordCards[key] = [...new Set([...data.wordCards[key], ...imported[
                                        key]])];
                                    }
                                }
                                saveData();
                                renderCardLib();
                                alert('导入成功！');
                            } else {
                                alert('格式错误：请导入有效的字卡库 JSON');
                            }
                        } catch (err) {
                            alert('解析失败：' + err.message);
                        }
                    };
                    reader.readAsText(file);
                    this.value = '';
                });
            }
        }

        // ---------- 渲染信件 ----------
        function renderLetters() {
            const sent = data.letters.sent || [];
            const received = data.letters.received || [];
            let html = '';
            if (sent.length === 0 && received.length === 0) {
                html = '<div class="empty-state"><div class="icon">💌</div><div>还没有信件</div></div>';
            } else {
                // 按时间合并排序
                const all = [];
                sent.forEach(l => all.push({ ...l, type: 'sent' }));
                received.forEach(l => all.push({ ...l, type: 'received' }));
                all.sort((a, b) => b.timestamp - a.timestamp);
                all.forEach(l => {
                    const label = l.type === 'sent' ? '📤 寄出' : '📥 收到';
                    const time = formatDate(l.timestamp);
                    const content = l.content || '(空)';
                    const replyStatus = l.type === 'sent' ?
                        (l.replied ? '✅ 已收到回信' : '⏳ 等待回信') :
                        '';
                    html += `
                        <div class="letter-item">
                            <div class="top">
                                <span>${label}</span>
                                <span class="badge">${time}</span>
                            </div>
                            <div class="content">${content}</div>
                            ${replyStatus ? `<div class="reply-status">${replyStatus}</div>` : ''}
                        </div>
                    `;
                });
            }
            letterList.innerHTML = html;
        }

        // ---------- 写信 ----------
        function sendLetter() {
            const content = letterInput.value.trim();
            if (!content) return;
            // 添加寄出信件
            const sentItem = {
                content: content,
                timestamp: Date.now(),
                replied: false,
            };
            data.letters.sent.push(sentItem);
            saveData();

            // 从字卡库选一条作为回信
            const allCards = getAllCards();
            let replyContent = '（对方没有回复）';
            if (allCards.length > 0) {
                replyContent = pickRandom(allCards);
            }
            // 添加收到回信
            const receivedItem = {
                content: replyContent,
                timestamp: Date.now(),
            };
            data.letters.received.push(receivedItem);
            // 标记已回复
            sentItem.replied = true;
            saveData();

            letterInput.value = '';
            renderLetters();
            // 在聊天中也显示
            addMessage('self', `📮 信件：「${content}」`);
            // 延迟显示回信
            setTimeout(() => {
                addMessage('other', `📬 回信：「${replyContent}」`);
            }, 800);
            alert('💌 信件已寄出，并收到回信！');
            updateStats();
        }

        // ---------- 头像 ----------
        function setupAvatar(avatarEl, inputEl, storageKey, typeKey) {
            const group = avatarEl.closest('.avatar-group');
            group.addEventListener('click', function(e) {
                if (e.target.closest('.upload-hint') || e.target === inputEl) return;
                inputEl.click();
            });
            // 点击上传提示
            group.querySelector('.upload-hint')?.addEventListener('click', function(e) {
                e.stopPropagation();
                inputEl.click();
            });
            inputEl.addEventListener('change', function(e) {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const dataUrl = ev.target.result;
                    avatarEl.style.backgroundImage = `url(${dataUrl})`;
                    avatarEl.style.backgroundSize = 'cover';
                    avatarEl.style.backgroundPosition = 'center';
                    avatarEl.textContent = '';
                    avatarEl.style.fontSize = '0';
                    data.settings[storageKey] = dataUrl;
                    data.settings[typeKey] = 'image';
                    saveData();
                };
                reader.readAsDataURL(file);
                this.value = '';
            });
            // 如果已保存图片，恢复
            if (data.settings[typeKey] === 'image' && data.settings[storageKey]) {
                avatarEl.style.backgroundImage = `url(${data.settings[storageKey]})`;
                avatarEl.style.backgroundSize = 'cover';
                avatarEl.style.backgroundPosition = 'center';
                avatarEl.textContent = '';
                avatarEl.style.fontSize = '0';
            } else if (data.settings[storageKey] && !data.settings[storageKey].startsWith('data:')) {
                avatarEl.textContent = data.settings[storageKey];
                avatarEl.style.fontSize = '24px';
                avatarEl.style.backgroundImage = 'none';
            }
        }

        // ---------- 切换覆盖层 ----------
        function openOverlay(overlay) {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
            overlay.classList.add('open');
        }

        function closeAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
        }

        // ---------- 初始化 ----------
        function init() {
            // 状态栏时间
            function updateTime() {
                const d = new Date();
                statusTime.textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2,
                '0');
            }
            updateTime();
            setInterval(updateTime, 30000);

            // 头像
            setupAvatar(myAvatar, myAvatarInput, 'myAvatar', 'myAvatarType');
            setupAvatar(partnerAvatar, partnerAvatarInput, 'partnerAvatar', 'partnerAvatarType');

            // 应用背景
            applyBg(data.settings.bg);

            // 气泡颜色
            currentBubbleColor = data.settings.bubbleColor;
            applyBubbleColor(currentBubbleColor);

            // 渲染消息
            renderMessages();

            // 统计
            updateStats();

            // 设置面板的值
            minWaitRange.value = data.settings.minWait || 23;
            maxWaitRange.value = data.settings.maxWait || 23;
            replyCountRange.value = data.settings.replyCount || 2;
            intervalRange.value = data.settings.interval || 31;
            minWaitVal.textContent = data.settings.minWait + 's';
            maxWaitVal.textContent = data.settings.maxWait + 's';
            replyCountVal.textContent = data.settings.replyCount;
            intervalVal.textContent = data.settings.interval + 'min';

            // toggle
            if (data.settings.showTimestamp !== false) {
                toggleTimestamp.classList.add('active');
            } else {
                toggleTimestamp.classList.remove('active');
            }
            if (data.settings.showReadReceipt !== false) {
                toggleReadReceipt.classList.add('active');
            } else {
                toggleReadReceipt.classList.remove('active');
            }

            // 颜色选择器高亮
            bubbleColorPicker.querySelectorAll('.color-opt').forEach(el => {
                el.classList.toggle('active', el.dataset.color === currentBubbleColor);
            });

            // 背景高亮
            bgPicker.querySelectorAll('.bg-opt').forEach(el => {
                const isActive = (el.dataset.bg === data.settings.bg) ||
                    (data.settings.bg === 'gradient1' && el.dataset.bg === 'gradient1') ||
                    (data.settings.bg === 'gradient2' && el.dataset.bg === 'gradient2') ||
                    (data.settings.bg === 'gradient3' && el.dataset.bg === 'gradient3');
                el.classList.toggle('active', isActive);
            });

            // ---------- 事件绑定 ----------
            // 发送
            sendBtn.addEventListener('click', function() {
                sendMessage(chatInput.value);
            });
            chatInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage(this.value);
                }
            });

            // 设置
            settingsBtn.addEventListener('click', function() {
                openOverlay(settingsOverlay);
            });
            closeSettings.addEventListener('click', closeAllOverlays);

            // 字卡库
            gotoCardLibBtn.addEventListener('click', function() {
                closeAllOverlays();
                renderCardLib();
                openOverlay(cardLibOverlay);
            });
            closeCardLib.addEventListener('click', closeAllOverlays);

            // 写信
            envelopeBtn.addEventListener('click', function() {
                closeAllOverlays();
                renderLetters();
                openOverlay(letterOverlay);
            });
            gotoLetterBtn.addEventListener('click', function() {
                closeAllOverlays();
                renderLetters();
                openOverlay(letterOverlay);
            });
            closeLetter.addEventListener('click', closeAllOverlays);
            sendLetterBtn.addEventListener('click', sendLetter);
            letterInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendLetter();
                }
            });

            // 统计
            gotoStatsBtn.addEventListener('click', function() {
                closeAllOverlays();
                updateStats();
                openOverlay(statsOverlay);
            });
            closeStats.addEventListener('click', closeAllOverlays);

            // 清空聊天
            document.getElementById('clearChatBtn')?.addEventListener('click', function() {
                if (confirm('确定要清空所有聊天记录吗？')) {
                    data.messages = [];
                    saveData();
                    renderMessages();
                    updateStats();
                    closeAllOverlays();
                }
            });

            // 气泡颜色
            bubbleColorPicker.addEventListener('click', function(e) {
                const opt = e.target.closest('.color-opt');
                if (!opt) return;
                const color = opt.dataset.color;
                if (!color) return;
                currentBubbleColor = color;
                data.settings.bubbleColor = color;
                saveData();
                applyBubbleColor(color);
                bubbleColorPicker.querySelectorAll('.color-opt').forEach(el => el.classList.remove('active'));
                opt.classList.add('active');
            });

            // 背景
            bgPicker.addEventListener('click', function(e) {
                const opt = e.target.closest('.bg-opt');
                if (!opt) return;
                const bg = opt.dataset.bg;
                if (!bg) return;
                data.settings.bg = bg;
                currentBg = bg;
                saveData();
                applyBg(bg);
                bgPicker.querySelectorAll('.bg-opt').forEach(el => el.classList.remove('active'));
                opt.classList.add('active');
            });

            // 范围滑块
            minWaitRange.addEventListener('input', function() {
                const val = parseInt(this.value);
                minWaitVal.textContent = val + 's';
                data.settings.minWait = val;
                saveData();
            });
            maxWaitRange.addEventListener('input', function() {
                const val = parseInt(this.value);
                maxWaitVal.textContent = val + 's';
                data.settings.maxWait = val;
                saveData();
            });
            replyCountRange.addEventListener('input', function() {
                const val = parseInt(this.value);
                replyCountVal.textContent = val;
                data.settings.replyCount = val;
                saveData();
            });
            intervalRange.addEventListener('input', function() {
                const val = parseInt(this.value);
                intervalVal.textContent = val + 'min';
                data.settings.interval = val;
                saveData();
                resetAutoSend();
            });

            // Toggle
            toggleTimestamp.addEventListener('click', function() {
                this.classList.toggle('active');
                data.settings.showTimestamp = this.classList.contains('active');
                saveData();
                renderMessages();
            });
            toggleReadReceipt.addEventListener('click', function() {
                this.classList.toggle('active');
                data.settings.showReadReceipt = this.classList.contains('active');
                saveData();
                // 简单反馈
            });

            // 更换头像按钮（设置里）
            document.getElementById('changeMyAvatarBtn')?.addEventListener('click', function() {
                myAvatarInput.click();
            });
            document.getElementById('changePartnerAvatarBtn')?.addEventListener('click', function() {
                partnerAvatarInput.click();
            });

            // 自动发送（主动发消息）
            resetAutoSend();

            // 点击外部关闭overlay（通过背景点击）
            document.querySelectorAll('.overlay').forEach(overlay => {
                overlay.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('open');
                    }
                });
            });

            // 返回按钮（关闭覆盖层）
            document.getElementById('backBtn')?.addEventListener('click', function() {
                if (document.querySelector('.overlay.open')) {
                    closeAllOverlays();
                } else {
                    // 回到顶部或刷新
                }
            });

            console.log('📡 传讯已启动！');
        }

        // ---------- 应用背景 ----------
        function applyBg(bg) {
            const overlay = document.getElementById('bgOverlay');
            if (!overlay) return;
            if (bg === 'gradient1') {
                overlay.style.background = 'linear-gradient(135deg, #120d1a, #1a0f2a)';
            } else if (bg === 'gradient2') {
                overlay.style.background = 'linear-gradient(135deg, #0d0a1a, #0f1a2a)';
            } else if (bg === 'gradient3') {
                overlay.style.background = 'linear-gradient(135deg, #1a0d1a, #2a0f1a)';
            } else {
                overlay.style.background = bg || '#120d1a';
            }
        }

        // ---------- 应用气泡颜色 ----------
        function applyBubbleColor(color) {
            document.querySelectorAll('.message.self .bubble').forEach(el => {
                el.style.background = color;
            });
            // 以后新消息会自动应用
        }

        // ---------- 自动发送 ----------
        function resetAutoSend() {
            if (autoSendTimer) {
                clearInterval(autoSendTimer);
                autoSendTimer = null;
            }
            const interval = data.settings.interval || 31;
            if (interval > 0) {
                autoSendTimer = setInterval(() => {
                    // 主动发送一条消息（从字卡库选）
                    const allCards = getAllCards();
                    if (allCards.length > 0 && !isReplying) {
                        const card = pickRandom(allCards);
                        if (card) {
                            // 模拟对方主动发消息
                            addMessage('other', '💬 ' + card);
                            // 更新统计
                            updateStats();
                            // 触发自动回复（对方发了，我方也可以回，但这里不自动回，保持自然）
                        }
                    }
                }, interval * 60 * 1000);
            }
        }

        // ---------- 启动 ----------
        document.addEventListener('DOMContentLoaded', init);

        // ---------- 暴露一些方便调试 ----------
        window.__chuanxun = { data, saveData, renderMessages, addMessage, sendMessage, getAllCards };
    </script>
</body>
</html>
